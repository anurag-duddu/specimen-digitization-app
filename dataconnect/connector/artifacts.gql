# Append-only server operations. API must validate typed domain and verified actor.
mutation AppendProfileVersion($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $profileKey: String!, $version: String!, $configObject: String!, $configSha256: String!, $approvedBy: String, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.canViewSensitive && this.role in ['reviewer', 'manager', 'admin']") { active role canViewSensitive }
  }
  profileVersion_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, profileKey: $profileKey, version: $version, configObject: $configObject, configSha256: $configSha256, approvedBy: $approvedBy})
}
