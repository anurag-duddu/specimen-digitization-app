# SOURCE UNRUN: V2 is additive. Compiler/physical mapping/transaction/CEL/IAM unqualified.
# SOURCE ONLY: the native feature/schema/physical mapping/compiler/CEL/atomicity
# and restricted backend IAM remain qualification gates. No old operation changes.
# Preparation writes retain the full String, with a preparation_digest metadata
# member, alongside a JSONB body that omits only that member. Check that custody
# before removing metadata through JSON (not JSONB): scalar kinds and duplicate
# body keys must survive for the strict HTTP/model decoders.
# Receipt replay authorizes current access but deliberately reads no current job,
# registration, lease/outbox or budget. Partial native/request pairs are returned
# as incomplete objects and fail closed in the adapter, never treated as absence.
query GetResearchPublicationReceiptV2($organizationId: UUID!, $collectionId: UUID!, $specimenId: UUID!, $actorUid: String!, $idempotencyKey: String!, $operationDigest: String!) @auth(level: NO_ACCESS) {
  organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) { active }
  collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) { active role canViewSensitive }
  specimen(key: {organizationId: $organizationId, collectionId: $collectionId, id: $specimenId}) { sensitive }
  retained: _selectFirst(sql: """
    SELECT row_to_json(native_exact)::text AS exact_json FROM (

    WITH pair AS (
      SELECT p, q FROM (SELECT * FROM public.research_publication_receipt_v2
        WHERE organization_id=$1 AND collection_id=$2 AND actor_uid=$4 AND idempotency_key=$5) p
      FULL JOIN (SELECT * FROM public.request_receipt WHERE organization_id=$1 AND collection_id=$2
        AND actor_uid=$4 AND operation='research-publication/v2' AND idempotency_key=$5) q ON true
    )
    SELECT CASE WHEN (pair.p).id IS NULL THEN NULL ELSE jsonb_build_object(
      'id',(pair.p).id,'actorUid',(pair.p).actor_uid,'idempotencyKey',(pair.p).idempotency_key,
      'specimenId',(pair.p).specimen_id,'operationDigest',(pair.p).operation_digest,
      'publicationDigest',(pair.p).publication_digest,'preparedDigest',(pair.p).prepared_digest,
      'bindingId',(pair.p).binding_id,'jobId',(pair.p).job_id,'jobKey',(pair.p).job_key,
      'generation',(pair.p).generation,'inputDigest',(pair.p).input_digest,'profileDigest',(pair.p).profile_digest,
      'runtimeBindingDigest',(pair.p).runtime_binding_digest,'usedCanonicalRevision',(pair.p).used_canonical_revision,
      'usedRecordVersionId',(pair.p).used_record_version_id,'usedHostRecordVersionId',(pair.p).used_host_record_version_id,
      'usedSnapshotSha256',(pair.p).used_snapshot_sha256,'resultingCanonicalRevision',(pair.p).resulting_canonical_revision,
      'nativeRecordVersionId',(pair.p).native_record_version_id,'canonicalRunId',(pair.p).canonical_run_id,
      'hostRecordVersionId',(pair.p).host_record_version_id,'snapshotSha256',(pair.p).snapshot_sha256,
      'projectionDigest',(pair.p).projection_digest,'projectionCount',(pair.p).projection_count,'sensitive',(pair.p).sensitive,
      'auditId',(pair.p).audit_id,'outboxId',(pair.p).outbox_id,'policyReceiptDigest',(pair.p).policy_receipt_digest,'lineageDigest',(pair.p).lineage_digest,'prepackProofDigest',(pair.p).prepack_proof_digest
    ) END AS publication,
    CASE WHEN (pair.q).idempotency_key IS NULL THEN NULL ELSE jsonb_build_object('operation',(pair.q).operation,
      'actorUid',(pair.q).actor_uid,'idempotencyKey',(pair.q).idempotency_key,'requestSha256',(pair.q).request_sha256,
      'specimenId',(pair.q).specimen_id,'revision',(pair.q).revision) END AS request,
    CASE WHEN snap.revision IS NULL THEN NULL ELSE jsonb_build_object('snapshot',snap.snapshot,'sha256',snap.sha256,
      'revision',snap.revision,'contractVersion',snap.contract_version) END AS snapshot,
    CASE WHEN rv.id IS NULL THEN NULL ELSE jsonb_build_object('id',rv.id,'runId',rv.run_id,'predecessorId',rv.predecessor_id) END AS record,
    (SELECT COALESCE(jsonb_agg(jsonb_build_object('id',f.id,'recordVersionId',f.record_version_id,
      'candidateId',f.candidate_id,'fieldKey',f.field_key,'state',f.state,'fieldGroup',f.field_group) ORDER BY f.field_key),'[]'::jsonb)
      FROM public.resolved_field f WHERE f.organization_id=$1 AND f.collection_id=$2
      AND f.record_version_id=(pair.p).native_record_version_id) AS fields,
    CASE WHEN a.id IS NULL THEN NULL ELSE jsonb_build_object('actorUid',a.actor_uid,'revision',a.revision,'requestSha256',a.request_sha256) END AS audit,
    CASE WHEN o.id IS NULL THEN NULL ELSE jsonb_build_object('aggregateRevision',o.aggregate_revision,'deduplicationKey',o.deduplication_key) END AS outbox,
    CASE WHEN intent.payload_json::jsonb=intent.payload THEN intent.payload_json::json END AS intent,
    CASE WHEN (SELECT count(*) FROM json_each(prep.payload_json::json) e WHERE e.key='preparation_digest')=1
          AND prep.payload_json::jsonb->'preparation_digest'=to_jsonb(prep.preparation_digest)
          AND (prep.payload_json::jsonb-'preparation_digest')=prep.payload
        THEN (SELECT json_object_agg(e.key,e.value) FROM json_each(prep.payload_json::json) e
          WHERE e.key<>'preparation_digest') END AS preparation, (pair.p).causal_proof AS causal,
    CASE WHEN attempt.id IS NULL THEN NULL ELSE jsonb_build_object('id',attempt.id,'preparation_id',attempt.preparation_id,'operation_digest',attempt.operation_digest,'preparation_digest',attempt.preparation_digest,'admission_digest',attempt.admission_digest) END AS attempt, (pair.p).prepack_proof AS prepack
    FROM pair JOIN public.specimen s ON s.organization_id=$1 AND s.collection_id=$2 AND s.id=$3
    JOIN public.organization_member om ON om.organization_id=$1 AND om.uid=$4 AND om.active
    JOIN public.collection_member cm ON cm.organization_id=$1 AND cm.collection_id=$2 AND cm.uid=$4 AND cm.active
      AND (NOT s.sensitive OR cm.can_view_sensitive)
    LEFT JOIN public.research_publication_intent_v2 intent ON intent.organization_id=$1 AND intent.collection_id=$2
      AND intent.id=(pair.p).intent_id AND intent.actor_uid=$4 AND intent.idempotency_key=$5 AND intent.specimen_id=$3
    LEFT JOIN public.research_publication_preparation_v2 prep ON prep.organization_id=$1 AND prep.collection_id=$2
      AND prep.id=(pair.p).winning_preparation_id AND prep.intent_id=intent.id
    LEFT JOIN public.research_publication_attempt_v2 attempt ON attempt.organization_id=$1 AND attempt.collection_id=$2
      AND attempt.intent_id=intent.id AND attempt.preparation_id=prep.id
    LEFT JOIN public.specimen_snapshot snap ON snap.organization_id=$1 AND snap.collection_id=$2
      AND snap.specimen_id=$3 AND snap.revision=(pair.p).resulting_canonical_revision
    LEFT JOIN public.record_version rv ON rv.organization_id=$1 AND rv.collection_id=$2 AND rv.id=(pair.p).native_record_version_id
    LEFT JOIN public.audit_event a ON a.organization_id=$1 AND a.collection_id=$2 AND a.specimen_id=$3
      AND a.id=(pair.p).audit_id AND a.revision=(pair.p).resulting_canonical_revision AND a.action='research_publication' AND a.request_sha256=(pair.p).operation_digest
    LEFT JOIN public.outbox_event o ON o.organization_id=$1 AND o.collection_id=$2 AND o.specimen_id=$3
      AND o.id=(pair.p).outbox_id AND o.aggregate_revision=(pair.p).resulting_canonical_revision AND o.deduplication_key=(pair.p).operation_digest
    WHERE ((pair.p).id IS NOT NULL OR (pair.q).idempotency_key IS NOT NULL)
      AND $6<>''

    ) native_exact
    """, params: [$organizationId,$collectionId,$specimenId,$actorUid,$idempotencyKey,$operationDigest])
}

# Routing follows CONTRACTS.md: an unfinished (running) or operationally blocked
# publication carries a null disposition, never deferred; only a completed one
# carries cleared or needs_human_review. A running publication stays due work.
# A field waiting on a policy the profile declares missing (verbatim_dts) is a
# policy gate: completed, needs_human_review, with its mandatory_unresolved field
# reason.
mutation PublishCanonicalResearchV2($organizationId: UUID!, $collectionId: UUID!, $specimenId: UUID!, $actorUid: String!, $commitJson: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active == true") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active == true && response.query.organizationMember.active == true && this.role in ['operator','reviewer','manager','admin']") { active role canViewSensitive }
  }
  committed: _execute(sql: """
    WITH RECURSIVE args AS MATERIALIZED (SELECT $5::jsonb AS c), ancestors AS (
      SELECT p.*,1 AS depth,ARRAY[p.id] AS visited FROM public.canonical_research_binding_v2 pointer
      JOIN public.research_publication_receipt_v2 p ON p.organization_id=pointer.organization_id
        AND p.collection_id=pointer.collection_id AND p.id=pointer.current_receipt_id
      WHERE pointer.organization_id=$1 AND pointer.collection_id=$2 AND pointer.specimen_id=$3
      UNION ALL
      SELECT p.*,a.depth+1,a.visited||p.id FROM ancestors a
      JOIN public.research_publication_receipt_v2 p ON p.organization_id=$1 AND p.collection_id=$2
        AND p.id=(a.causal_proof->>'parent_receipt_id')::uuid
      WHERE a.depth<21 AND NOT p.id=ANY(a.visited)
    ), locked AS (
      SELECT s.id, s.revision, b.*, h.revision AS state_revision, h.state AS old_state, c
      FROM public.specimen s JOIN args ON true
      JOIN public.canonical_research_binding_v2 b ON b.organization_id=s.organization_id
        AND b.collection_id=s.collection_id AND b.specimen_id=s.id
      JOIN public.specimen_snapshot snap ON snap.organization_id=s.organization_id AND snap.collection_id=s.collection_id
        AND snap.specimen_id=s.id AND snap.revision=s.revision
      JOIN public.record_version rv ON rv.organization_id=b.organization_id AND rv.collection_id=b.collection_id
        AND rv.id=b.current_record_version_id AND rv.run_id=b.canonical_run_id
      JOIN public.pipeline_run run ON run.organization_id=b.organization_id AND run.collection_id=b.collection_id
        AND run.id=b.canonical_run_id AND run.specimen_id=s.id
      JOIN public.profile_version profile ON profile.organization_id=run.organization_id AND profile.collection_id=run.collection_id
        AND profile.id=run.profile_version_id
      JOIN public.research_harness_state h ON h.organization_id=b.organization_id AND h.program_key=b.program_key
      JOIN public.research_publication_intent_v2 intent ON intent.organization_id=s.organization_id AND intent.collection_id=s.collection_id
        AND intent.specimen_id=s.id AND intent.actor_uid=$4 AND intent.idempotency_key=c->'receipt'->>'idempotencyKey'
        AND intent.id=(c->>'intent_id')::uuid AND intent.operation_digest=c->'receipt'->>'operationDigest'
        AND intent.scientific_intent_digest=c->'causal'->>'scientific_intent_digest'
      JOIN public.research_publication_preparation_v2 prep ON prep.organization_id=s.organization_id
        AND prep.collection_id=s.collection_id AND prep.intent_id=intent.id AND prep.id=(c->'causal'->>'winning_preparation_id')::uuid
        AND prep.preparation_digest=c->'receipt'->>'preparedDigest' AND prep.payload->'prepared'=c->'prepared'
        AND prep.admission_digest=c->'causal'->>'admission_digest' AND prep.payload=c->'preparation'
      JOIN public.research_publication_attempt_v2 attempt ON attempt.organization_id=s.organization_id
        AND attempt.collection_id=s.collection_id AND attempt.intent_id=intent.id AND attempt.preparation_id=prep.id
        AND attempt.operation_digest=intent.operation_digest AND attempt.preparation_digest=prep.preparation_digest
        AND attempt.admission_digest=prep.admission_digest
      JOIN public.organization_member om ON om.organization_id=s.organization_id AND om.uid=$4 AND om.active
      JOIN public.collection_member cm ON cm.organization_id=s.organization_id AND cm.collection_id=s.collection_id
        AND cm.uid=$4 AND cm.active AND cm.role IN ('operator','reviewer','manager','admin')
        AND (NOT s.sensitive OR cm.can_view_sensitive)
      WHERE s.organization_id=$1 AND s.collection_id=$2 AND s.id=$3 AND NOT s.sensitive
        AND b.active AND b.registration_revision=(c->>'registration_revision')::integer
        AND b.binding_id=(c->'receipt'->>'bindingId')::uuid AND b.publication_version='research-publication/v2'
        AND b.current_receipt_id IS NOT DISTINCT FROM (c->'causal'->>'parent_receipt_id')::uuid
        AND b.current_chain_digest=c->'causal'->>'parent_chain_digest'
        AND b.authority_digest=intent.payload->>'authority_digest'
        AND b.import_proof_id=(intent.payload->>'import_proof_id')::uuid
        AND b.import_proof_digest=intent.payload->>'import_proof_digest'
        AND (SELECT count(*) FROM public.canonical_research_binding_v2 counted WHERE counted.organization_id=$1
          AND counted.collection_id=$2 AND counted.specimen_id=$3 AND counted.active)=1
        AND (SELECT count(*) FROM ancestors)<=20
        AND COALESCE((SELECT jsonb_agg(causal_proof ORDER BY used_canonical_revision) FROM ancestors),'[]'::jsonb)=c->'causal_chain'
        AND (SELECT count(DISTINCT causal_proof->>'changed_field') FROM ancestors)=(SELECT count(*) FROM ancestors)
        AND NOT EXISTS (SELECT 1 FROM ancestors p WHERE p.causal_proof->>'changed_field'=c->>'changed_field')
        AND NOT EXISTS (SELECT 1 FROM ancestors p
          LEFT JOIN public.research_publication_intent_v2 original ON original.organization_id=$1 AND original.collection_id=$2
            AND original.id=p.intent_id AND original.specimen_id=$3 AND original.actor_uid=$4
          LEFT JOIN public.research_publication_preparation_v2 winning ON winning.organization_id=$1 AND winning.collection_id=$2
            AND winning.id=p.winning_preparation_id AND winning.intent_id=original.id
          WHERE original.id IS NULL OR winning.id IS NULL OR p.operation_digest IS DISTINCT FROM original.operation_digest
            OR p.prepared_digest IS DISTINCT FROM winning.preparation_digest
            OR p.causal_proof->>'scientific_intent_digest' IS DISTINCT FROM original.scientific_intent_digest
            OR p.causal_proof->>'changed_field' IS DISTINCT FROM original.payload->>'changed_field'
            OR p.causal_proof->>'admission_digest' IS DISTINCT FROM winning.admission_digest
            OR p.causal_proof->'original_base' IS DISTINCT FROM intent.payload->'original_base'
            OR p.causal_proof->'human_locks' IS DISTINCT FROM original.payload->'human_locks')
        AND NOT EXISTS (SELECT 1 FROM ancestors p LEFT JOIN public.record_version r ON r.organization_id=$1
          AND r.collection_id=$2 AND r.id=p.native_record_version_id
          LEFT JOIN public.specimen_snapshot z ON z.organization_id=$1 AND z.collection_id=$2 AND z.specimen_id=$3
            AND z.revision=p.resulting_canonical_revision
          WHERE p.specimen_id<>$3 OR p.actor_uid<>$4 OR p.binding_id<>b.binding_id OR p.job_key<>b.job_key
            OR p.job_id<>b.job_id OR p.generation<>b.generation OR p.input_digest<>b.input_digest
            OR p.profile_digest<>b.profile_digest OR p.runtime_binding_digest<>b.runtime_binding_digest
            OR p.causal_proof->>'authority_digest'<>b.authority_digest
            OR p.causal_proof->>'program_key'<>b.program_key OR p.causal_proof->>'import_proof_id'<>b.import_proof_id::text
            OR p.causal_proof->>'import_proof_digest'<>b.import_proof_digest
            OR p.resulting_canonical_revision<>p.used_canonical_revision+1 OR r.predecessor_id IS DISTINCT FROM p.used_record_version_id
            OR r.run_id IS DISTINCT FROM b.canonical_run_id OR z.sha256 IS DISTINCT FROM p.snapshot_sha256)
        AND (CASE WHEN b.current_receipt_id IS NULL THEN jsonb_array_length(c->'causal_chain')=0
          AND b.current_record_version_id=b.base_record_version_id AND b.current_canonical_revision=b.base_canonical_revision
          ELSE EXISTS (SELECT 1 FROM ancestors p WHERE p.causal_proof->>'parent_receipt_id' IS NULL
            AND p.used_record_version_id=b.base_record_version_id AND p.used_canonical_revision=b.base_canonical_revision
            AND p.used_snapshot_sha256=b.base_snapshot_sha256 AND p.used_host_record_version_id=b.base_host_record_version_id)
          AND NOT EXISTS (SELECT 1 FROM ancestors p WHERE p.causal_proof->>'parent_receipt_id' IS NOT NULL
            AND NOT EXISTS (SELECT 1 FROM ancestors parent WHERE parent.id=(p.causal_proof->>'parent_receipt_id')::uuid
              AND parent.native_record_version_id=p.used_record_version_id
              AND parent.resulting_canonical_revision=p.used_canonical_revision
              AND parent.snapshot_sha256=p.used_snapshot_sha256 AND parent.host_record_version_id=p.used_host_record_version_id
              AND parent.chain_digest=p.causal_proof->>'parent_chain_digest')) END)
        AND (prep.payload->'anchor'=intent.payload->'original_base' OR EXISTS (SELECT 1 FROM ancestors p
          WHERE p.causal_proof->'resulting'=prep.payload->'anchor' AND p.id=(prep.payload->>'anchor_receipt_id')::uuid
            AND p.chain_digest=prep.payload->>'anchor_chain_digest'))
        AND NOT EXISTS (SELECT 1 FROM ancestors p WHERE p.resulting_canonical_revision>
          (prep.payload->'anchor'->>'record_revision')::integer AND (p.causal_proof->>'changed_field'=c->>'changed_field'
          OR EXISTS (SELECT 1 FROM jsonb_array_elements(intent.payload->'dependency_sources') d
            WHERE d->>'canonical_field_key'=p.causal_proof->>'changed_field')))
        AND (CASE WHEN NOT EXISTS (SELECT 1 FROM ancestors p WHERE p.resulting_canonical_revision>
          (prep.payload->'anchor'->>'record_revision')::integer) THEN h.state=prep.payload->'expected_state'
          AND h.revision=(prep.payload->>'state_revision')::integer
          AND b.registration_revision=(prep.payload->>'anchor_registration_revision')::integer
          ELSE EXISTS (SELECT 1 FROM ancestors first_after WHERE first_after.used_canonical_revision=
            (prep.payload->'anchor'->>'record_revision')::integer
            AND first_after.causal_proof->'before_state'=prep.payload->'expected_state'
            AND (first_after.causal_proof->>'before_state_revision')::integer=(prep.payload->>'state_revision')::integer
            AND (first_after.causal_proof->>'before_registration_revision')::integer=
              (prep.payload->>'anchor_registration_revision')::integer)
          AND NOT EXISTS (SELECT 1 FROM ancestors p JOIN ancestors parent
            ON parent.id=(p.causal_proof->>'parent_receipt_id')::uuid
            WHERE p.used_canonical_revision>(prep.payload->'anchor'->>'record_revision')::integer
            AND (p.causal_proof->'before_state' IS DISTINCT FROM parent.causal_proof->'after_state'
              OR (p.causal_proof->>'before_state_revision')::integer IS DISTINCT FROM
                (parent.causal_proof->>'after_state_revision')::integer
              OR (p.causal_proof->>'before_registration_revision')::integer IS DISTINCT FROM
                (parent.causal_proof->>'after_registration_revision')::integer))
          AND EXISTS (SELECT 1 FROM ancestors last_after WHERE last_after.id=b.current_receipt_id
            AND last_after.causal_proof->'after_state'=h.state
            AND (last_after.causal_proof->>'after_state_revision')::integer=h.revision
            AND (last_after.causal_proof->>'after_registration_revision')::integer=b.registration_revision) END)
        AND c->'preparation'->'human_locks'=c->'causal'->'human_locks'
        AND c->'causal'->'human_locks'=intent.payload->'human_locks'
        AND (SELECT jsonb_object_agg(b.semantic_mapping->'field_mapping'->>f.key,COALESCE((f.value->>'locked')::boolean,true)
          OR COALESCE((snap.snapshot->'run'->>'human_approved')::boolean,true)
           OR COALESCE(snap.snapshot->'run'->'history_restore_human_locks' = 'true'::jsonb, false))
          FROM jsonb_each(h.state->'jobs'->b.job_key->'fields') f)=intent.payload->'human_locks'
        AND NOT EXISTS (SELECT 1 FROM ancestors p WHERE p.resulting_canonical_revision>
          (prep.payload->'anchor'->>'record_revision')::integer
          AND p.causal_proof->'human_locks' IS DISTINCT FROM prep.payload->'human_locks')
        AND NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'dependency_checkpoint_proofs') proof
          WHERE h.state->'jobs'->b.job_key->'fields'->(proof->>'field_key')->'checkpoint'
            IS DISTINCT FROM proof->'native_checkpoint')
        AND NOT EXISTS (SELECT 1 FROM jsonb_array_elements(intent.payload->'dependency_sources') source
          LEFT JOIN public.resolved_field original_field ON original_field.organization_id=$1 AND original_field.collection_id=$2
            AND original_field.record_version_id=(source->>'projection_record_version_id')::uuid
            AND original_field.field_key=source->>'canonical_field_key'
          LEFT JOIN public.resolved_field current_field ON current_field.organization_id=$1 AND current_field.collection_id=$2
            AND current_field.record_version_id=b.current_record_version_id AND current_field.field_key=source->>'canonical_field_key'
          LEFT JOIN public.field_candidate candidate ON candidate.organization_id=$1 AND candidate.collection_id=$2
            AND candidate.id=(source->>'candidate_id')::uuid
          LEFT JOIN public.record_version source_record ON source_record.organization_id=$1 AND source_record.collection_id=$2
            AND source_record.id=(source->>'source_record_version_id')::uuid
          WHERE original_field.candidate_id IS DISTINCT FROM candidate.id OR current_field.candidate_id IS DISTINCT FROM candidate.id
            OR candidate.run_id IS DISTINCT FROM b.canonical_run_id OR candidate.field_key IS DISTINCT FROM source->>'canonical_field_key'
            OR source_record.run_id IS DISTINCT FROM b.canonical_run_id
            OR NOT EXISTS (SELECT 1 FROM public.resolved_field source_projection WHERE source_projection.organization_id=$1
              AND source_projection.collection_id=$2 AND source_projection.record_version_id=source_record.id
              AND source_projection.field_key=source->>'canonical_field_key' AND source_projection.candidate_id=candidate.id))
        AND c->'causal'->'before_state'=h.state AND c->'causal'->'after_state'=c->'next_state'
        AND (c->'causal'->>'before_state_revision')::integer=h.revision
        AND (c->'causal'->>'after_state_revision')::integer=h.revision+1
        AND (c->'causal'->>'before_registration_revision')::integer=b.registration_revision
        AND (c->'causal'->>'after_registration_revision')::integer=b.registration_revision+1
        AND s.revision=b.current_canonical_revision AND s.revision>=1
        AND s.revision=(c->'receipt'->>'usedCanonicalRevision')::integer
        AND (c->'receipt'->>'resultingCanonicalRevision')::integer=s.revision+1
        AND s.active_run_id=b.canonical_run_id AND b.canonical_run_id=(c->'receipt'->>'canonicalRunId')::uuid
        AND rv.id=(c->'receipt'->>'usedRecordVersionId')::uuid AND snap.sha256=b.current_snapshot_sha256
        AND snap.sha256=c->'receipt'->>'usedSnapshotSha256' AND s.source_checksum=b.source_sha256
        AND run.input_sha256=b.source_sha256 AND profile.config_sha256=b.canonical_profile_digest
        AND b.current_host_record_version_id=c->'receipt'->>'usedHostRecordVersionId'
        AND b.job_id=c->'receipt'->>'jobId' AND b.job_key=c->'receipt'->>'jobKey'
        AND b.generation=(c->'receipt'->>'generation')::integer
        AND b.input_digest=c->'receipt'->>'inputDigest' AND b.profile_digest=c->'receipt'->>'profileDigest'
        AND b.runtime_binding_digest=c->'receipt'->>'runtimeBindingDigest'
        AND h.revision=(c->>'state_revision')::integer AND h.state=c->'expected_state'
        AND h.state->>'contract_version'='research-durability/v1' AND h.state->>'program_key'=b.program_key
        AND (h.state->>'halted')::boolean=false
        AND (h.state->'budget_policy'->>'ceiling_micro_usd')::bigint<=12000000
        AND (h.state->'budget_policy'->>'ceiling_micro_usd')::bigint>0
        AND (h.state->'budget_totals'->>'settled_micro_usd')::bigint
          +(h.state->'budget_totals'->>'held_micro_usd')::bigint<=(h.state->'budget_policy'->>'ceiling_micro_usd')::bigint
        AND h.state->'jobs'->b.job_key->>'binding_digest'=b.runtime_binding_digest
        AND h.state->'jobs'->b.job_key->'pins'->>'input_digest'=b.input_digest
        AND h.state->'jobs'->b.job_key->'identity'=jsonb_build_object('organization_id',$1::text,
          'collection_id',$2::text,'specimen_id',$3::text,'job_id',b.job_id)
        AND (h.state->'jobs'->b.job_key->>'generation')::integer=b.generation
        AND (h.state->'jobs'->b.job_key->>'record_revision')::integer=b.base_canonical_revision
        AND (h.state->'jobs'->b.job_key->>'paused')::boolean=false
        AND h.state->'jobs'->b.job_key->'lease'=c->'native_guard'->'lease'
        AND (h.state->'jobs'->b.job_key->'lease'->>'expires_at')::numeric>extract(epoch FROM statement_timestamp())
        AND (h.state->'jobs'->b.job_key->'fields'->(c->'prepared'->'basis'->>'field_key')->>'locked')::boolean=false
        AND h.state->'jobs'->b.job_key->'fields'->(c->'prepared'->'basis'->>'field_key')->>'work_state' IN ('resolved','waiting_human','nonblocking_exception')
        AND (h.state->'jobs'->b.job_key->'fields'->(c->'prepared'->'basis'->>'field_key')->>'revision')::integer
          =(c->'prepared'->'basis'->>'field_revision')::integer
        AND h.state->'outbox'->(c->'prepared'->'basis'->>'publication_outbox_key')
          =jsonb_build_object('kind','canonical_publication_required','guard',c->'native_guard','delivered',false)
        AND NOT EXISTS (SELECT 1 FROM jsonb_each(h.state->'effects') e WHERE e.value->>'job_key'=b.job_key
          AND e.value->>'status' IN ('sending','held_unknown','reserved'))
        AND (c->>'next_state_json')::jsonb=c->'next_state'
        AND c->'next_state'=jsonb_set(jsonb_set(jsonb_set(h.state,
          ARRAY['outbox',c->'prepared'->'basis'->>'publication_outbox_key','delivered'],'true'::jsonb),
          ARRAY['outbox',c->'prepared'->'basis'->>'checkpoint_outbox_key','delivered'],'true'::jsonb),
          ARRAY['outbox',c->'prepared'->'basis'->>'publication_outbox_key','canonical_commit'],c->'receipt')
        AND c->'policy_materialization'->>'contract_version'='canonical-policy-materialization/v2'
        AND c->'policy_materialization'->'progress_receipt'=c->'causal'->'progress_receipt'
        AND c->'policy_materialization'->>'progress_receipt_digest'=c->'causal'->>'progress_receipt_digest'
        AND c->'policy_materialization'->'progress_receipt'->>'binding_id'=b.binding_id::text
        AND c->'policy_materialization'->'progress_receipt'->>'job_key'=b.job_key
        AND (c->'policy_materialization'->'progress_receipt'->>'generation')::integer=b.generation
        AND c->'policy_materialization'->'progress_receipt'->>'result_digest'=c->'policy_materialization'->>'result_digest'
        AND c->'policy_materialization'->'progress_receipt'->>'wire_status'=c->>'state'
        AND c->'policy_materialization'->'progress_receipt'->>'run_stage'=c->'snapshot'->'run'->>'stage'
        AND c->'policy_materialization'->'progress_receipt'->'disposition'=c->'record'->'disposition'
        AND c->'policy_materialization'->'progress_receipt'->>'target_canonical_field'=c->>'changed_field'
        AND c->'policy_materialization'->'progress_receipt'->>'target_research_field'=c->'prepared'->'basis'->>'field_key'
        AND (SELECT jsonb_object_agg(f.key,f.value->'work_state') FROM jsonb_each(h.state->'jobs'->b.job_key->'fields') f)
          =c->'policy_materialization'->'progress_receipt'->'research_field_work'
        AND (SELECT jsonb_object_agg(b.semantic_mapping->'field_mapping'->>f.key,f.value->'work_state')
          FROM jsonb_each(h.state->'jobs'->b.job_key->'fields') f)
          =c->'policy_materialization'->'progress_receipt'->'canonical_field_work'
        AND (SELECT count(*) FROM jsonb_each(h.state->'jobs'->b.job_key->'fields'))=20
        AND NOT EXISTS (SELECT 1 FROM jsonb_each(h.state->'jobs'->b.job_key->'fields') f
          WHERE jsonb_typeof(f.value->'work_state') IS DISTINCT FROM 'string' OR f.value->>'work_state' NOT IN
            ('pending','researching','resolved','waiting_source','waiting_policy','retry_scheduled','operational_failed','waiting_human','nonblocking_exception','cancelled'))
        AND jsonb_typeof(c->'policy_materialization'->'progress_receipt'->'exportable')='boolean'
        AND c->'policy_materialization'->'progress_receipt'->'exportable'
          =to_jsonb(COALESCE(c->'record'->>'disposition'='cleared',false))
        AND (CASE WHEN EXISTS (SELECT 1 FROM jsonb_each(h.state->'jobs'->b.job_key->'fields') f
          WHERE f.value->>'work_state' IN ('waiting_source','waiting_policy','operational_failed','retry_scheduled','cancelled')
            AND NOT (f.value->>'work_state'='waiting_policy'
              AND c->'policy_materialization'->'progress_receipt'->'human_reason_codes'
                @> jsonb_build_array('mandatory_unresolved:'||(b.semantic_mapping->'field_mapping'->>f.key))
              AND EXISTS (SELECT 1 FROM jsonb_array_elements(h.state->'jobs'->b.job_key->'pins'->'profile'->'fields') p
                WHERE p->>'field_key'=f.key AND jsonb_typeof(p->'missing_policy')='string')))
          OR jsonb_array_length(c->'policy_materialization'->'progress_receipt'->'operational_reason_codes')>0 THEN
            c->>'state'='processing_blocked' AND c->'record'->'disposition'='null'::jsonb
            AND c->'snapshot'->'run'->>'stage'='processing_blocked'
          WHEN EXISTS (SELECT 1 FROM jsonb_each(h.state->'jobs'->b.job_key->'fields') f
            WHERE f.value->>'work_state' IN ('pending','researching')) THEN c->>'state'='running'
            AND c->'record'->'disposition'='null'::jsonb AND c->'snapshot'->'run'->>'stage'='research_in_progress'
          WHEN EXISTS (SELECT 1 FROM jsonb_each(h.state->'jobs'->b.job_key->'fields') f
            WHERE f.value->>'work_state' IN ('waiting_human','waiting_policy'))
            OR jsonb_array_length(c->'policy_materialization'->'progress_receipt'->'human_reason_codes')>0 THEN
              c->>'state'='completed' AND c->'record'->>'disposition'='needs_human_review'
          ELSE c->>'state'='completed' AND c->'record'->>'disposition' IN ('cleared','needs_human_review') END)
        AND c->'policy_materialization'->>'policy_digest'=b.policy_digest
        AND c->'policy_materialization'->>'semantic_mapping_digest'=b.semantic_mapping_digest
        AND c->'policy_materialization'->'policy_receipt'->>'status'='computed'
        AND c->'policy_materialization'->'policy_receipt'->>'publication_digest'=c->'receipt'->>'publicationDigest'
        AND c->'policy_materialization'->'policy_receipt'->>'result_digest'=c->'policy_materialization'->>'result_digest'
        AND h.state->'jobs'->b.job_key->'fields'->(c->'prepared'->'basis'->>'field_key')->'checkpoint'->>'id'
          =c->'prepared'->'basis'->>'checkpoint_id'
        AND (h.state->'jobs'->b.job_key->'lease'->>'fence')::integer=(c->'prepared'->'basis'->'lease'->>'fence')::integer
        AND h.state->'jobs'->b.job_key->'lease'->>'owner'=c->'prepared'->'basis'->'lease'->>'owner'
        AND NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'prepared'->'basis'->'dependencies') d WHERE
          (h.state->'jobs'->b.job_key->'fields'->(d->>'field_key')->>'revision')::integer IS DISTINCT FROM (d->>'revision')::integer
          OR h.state->'jobs'->b.job_key->'fields'->(d->>'field_key')->'checkpoint'->>'id' IS DISTINCT FROM d->>'checkpoint_id')
        AND c->'capture_scope'=c->'prepared'->'basis'->'original_scope'
        AND (CASE WHEN (c->'prepared'->'basis'->>'reused')::boolean THEN
          c->'reuse_history' IS NOT NULL AND c->'reuse_history'<>'null'::jsonb
          AND h.state->'jobs'->b.job_key->'history' @> jsonb_build_array(c->'reuse_history')
          AND c->'reuse_history'->'scope'=jsonb_build_object('organization_id',$1::text,'collection_id',$2::text,
            'specimen_id',$3::text,'job_id',b.job_id,'generation',(c->'capture_scope'->>'generation')::integer)
          AND (c->'capture_scope'->>'generation')::integer<b.generation
          AND c->'reuse_history'->'pins'=h.state->'jobs'->b.job_key->'pins'
          AND c->'reuse_history'->>'binding_digest'=c->'prepared'->'basis'->>'source_binding_digest'
          AND c->'reuse_history'->'fields'->(c->'prepared'->'basis'->>'field_key')->'checkpoint'
            =h.state->'jobs'->b.job_key->'fields'->(c->'prepared'->'basis'->>'field_key')->'checkpoint'
          AND h.state->'jobs'->b.job_key->'fields'->(c->'prepared'->'basis'->>'field_key')->'reuse'->>'source_binding_digest'
            =c->'prepared'->'basis'->>'source_binding_digest'
          AND h.state->'jobs'->b.job_key->'fields'->(c->'prepared'->'basis'->>'field_key')->'reuse'->>'target_binding_digest'=b.runtime_binding_digest
          ELSE c->'reuse_history'='null'::jsonb AND c->'capture_scope'=c->'prepared'->'basis'->'scope' END)
        AND c->'capture_scope'->>'input_digest'=b.input_digest AND c->'capture_scope'->>'profile_digest'=b.profile_digest
        AND NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'prepared'->'basis'->'receipts') r WHERE
          h.state->'effects'->(r->>'effect_id')->'scope' IS DISTINCT FROM jsonb_build_object('organization_id',$1::text,
            'collection_id',$2::text,'specimen_id',$3::text,'job_id',b.job_id,'generation',(c->'capture_scope'->>'generation')::integer)
          OR h.state->'effects'->(r->>'effect_id')->>'binding_digest' IS DISTINCT FROM c->'prepared'->'basis'->>'source_binding_digest'
          OR
          h.state->'effects'->(r->>'effect_id')->>'status' IS DISTINCT FROM 'completed'
          OR h.state->'effects'->(r->>'effect_id')->>'request_digest' IS DISTINCT FROM r->>'request_digest'
          OR h.state->'effects'->(r->>'effect_id')->'receipt'->>'attempt_id' IS DISTINCT FROM r->>'attempt_id'
          OR h.state->'effects'->(r->>'effect_id')->'receipt'->'capture' IS DISTINCT FROM r->'capture')
      FOR UPDATE OF s,b,h
    ), native_facts AS (
      SELECT l.*,jsonb_build_object('record_versions',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'runId',r.run_id,'predecessorId',r.predecessor_id,'disposition',r.disposition,'policyVersion',r.policy_version,'reasonCodes',r.reason_codes,'summary',r.summary,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.record_version r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.run_id=l.canonical_run_id ORDER BY r.id LIMIT 4097) r),
        'resolved_fields',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'recordVersionId',r.record_version_id,'candidateId',r.candidate_id,'fieldKey',r.field_key,'state',r.state,'fieldGroup',r.field_group,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.resolved_field r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.record_version_id IN (SELECT v.id FROM public.record_version v WHERE v.organization_id=$1 AND v.collection_id=$2 AND v.run_id=l.canonical_run_id) ORDER BY r.id LIMIT 4097) r),
        'candidates',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'runId',r.run_id,'fieldKey',r.field_key,'state',r.state,'literalValue',r.literal_value,'parsedValue',r.parsed_value,'normalizedValue',r.normalized_value,'authorityId',r.authority_id,'derivation',r.derivation,'inputSource',r.input_source,'sourceTranscriptionId',r.source_transcription_id,'sourceObservationId',r.source_observation_id,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.field_candidate r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.run_id=l.canonical_run_id ORDER BY r.id LIMIT 4097) r),
        'candidate_evidence',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'candidateId',r.candidate_id,'evidenceId',r.evidence_id,'relation',r.relation,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.candidate_evidence r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.candidate_id IN (SELECT fc.id FROM public.field_candidate fc WHERE fc.organization_id=$1 AND fc.collection_id=$2 AND fc.run_id=l.canonical_run_id) ORDER BY r.id LIMIT 4097) r),
        'evidence',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'runId',r.run_id,'source',r.source,'sourceVersion',r.source_version,'adapterVersion',r.adapter_version,'query',r.query,'outcome',r.outcome,'locator',r.locator,'responseSha256',r.response_sha256,'capturedAt',r.captured_at,'rawAssetId',r.raw_asset_id,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.evidence_item r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.run_id=l.canonical_run_id ORDER BY r.id LIMIT 4097) r),
        'tool_calls',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'runId',r.run_id,'callKey',r.call_key,'phase',r.phase,'tool',r.tool,'toolVersion',r.tool_version,'source',r.source,'fieldKeys',r.field_keys,'inputSource',r.input_source,'transcriptionVersionId',r.transcription_version_id,'observationId',r.observation_id,'attempt',r.attempt,'arguments',r.arguments,'outcome',r.outcome,'result',r.result,'evidenceId',r.evidence_id,'startedAt',r.started_at,'completedAt',r.completed_at,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.tool_call r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.run_id=l.canonical_run_id ORDER BY r.id LIMIT 4097) r),
        'findings',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'recordVersionId',r.record_version_id,'ruleId',r.rule_id,'ruleVersion',r.rule_version,'severity',r.severity,'outcome',r.outcome,'fieldKey',r.field_key,'reasonCode',r.reason_code,'evidenceIds',r.evidence_ids,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.validation_finding r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.record_version_id IN (SELECT v.id FROM public.record_version v WHERE v.organization_id=$1 AND v.collection_id=$2 AND v.run_id=l.canonical_run_id) ORDER BY r.id LIMIT 4097) r)) AS fresh_projection_rows,
        jsonb_build_object('observations',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'runId',r.run_id,'regionId',r.region_id,'rawAssetId',r.raw_asset_id,'stepKey',r.step_key,'provider',r.provider,'modelVersion',r.model_version,'promptVersion',r.prompt_version,'inputSha256',r.input_sha256,'parameters',r.parameters,'literalText',r.literal_text,'outcome',r.outcome,'independent',r.independent,'routeId',r.route_id,'unreadableSpans',r.unreadable_spans,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.model_observation r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.run_id IN (SELECT pr.id FROM public.pipeline_run pr WHERE pr.organization_id=$1 AND pr.collection_id=$2 AND pr.specimen_id=$3) ORDER BY r.id LIMIT 4097) r),
