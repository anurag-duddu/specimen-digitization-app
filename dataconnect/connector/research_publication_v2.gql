        'handoffs',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'runId',r.run_id,'transcriptionVersionId',r.transcription_version_id,'observationId',r.observation_id,'role',r.role,'handedText',r.handed_text,'note',r.note,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.harness_input r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.run_id IN (SELECT pr.id FROM public.pipeline_run pr WHERE pr.organization_id=$1 AND pr.collection_id=$2 AND pr.specimen_id=$3) ORDER BY r.id LIMIT 4097) r),
