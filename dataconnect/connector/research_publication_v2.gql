      SELECT $1,$2,(v->>'id')::uuid,(v->>'lineageId')::uuid,(v->>'evidenceId')::uuid,(v->>'researchEvidenceId'),(v->>'associationKind'),(v->>'originalRelation'),statement_timestamp()
      FROM admissible l CROSS JOIN LATERAL jsonb_array_elements(c->'delta'->'value_evidence') v
      WHERE (SELECT count(*) FROM value_dependencies)=jsonb_array_length(c->'delta'->'value_dependencies') RETURNING id
    ), tool_input_lineage AS (
      INSERT INTO public.tool_input_lineage_v2(organization_id,collection_id,id,contract_version,specimen_id,run_id,evidence_id,native_checkpoint_id,native_checkpoint_digest,original_request_digest,original_scope,original_request,query_digest,query,effect_id,attempt_id,receipt_digest,receipt_binding_digest,source_policy_digest,capture_policy_digest,source_registry_digest,canonical_mapping_digest,source_capture_proof,fragments,fragment_digests,observation_ids,region_ids,input_sources,native_inputs,native_transcription_proofs,selected_observation_id,legacy_producer_digest,created_at)
      SELECT $1,$2,(v->>'id')::uuid,(v->>'contractVersion'),(v->>'specimenId')::uuid,(v->>'runId')::uuid,(v->>'evidenceId')::uuid,(v->>'nativeCheckpointId'),(v->>'nativeCheckpointDigest'),(v->>'originalRequestDigest'),v->'originalScope',v->'originalRequest',(v->>'queryDigest'),v->'query',(v->>'effectId'),(v->>'attemptId'),(v->>'receiptDigest'),(v->>'receiptBindingDigest'),(v->>'sourcePolicyDigest'),(v->>'capturePolicyDigest'),(v->>'sourceRegistryDigest'),(v->>'canonicalMappingDigest'),v->'sourceCaptureProof',v->'fragments',ARRAY(SELECT x FROM jsonb_array_elements_text(v->'fragmentDigests') x),ARRAY(SELECT x::uuid FROM jsonb_array_elements_text(v->'observationIds') x),ARRAY(SELECT x::uuid FROM jsonb_array_elements_text(v->'regionIds') x),ARRAY(SELECT x FROM jsonb_array_elements_text(v->'inputSources') x),v->'nativeInputs',v->'nativeTranscriptionProofs',(v->>'selectedObservationId')::uuid,(v->>'legacyProducerDigest'),statement_timestamp()
      FROM admissible l CROSS JOIN LATERAL jsonb_array_elements(c->'delta'->'tool_input_lineage') v
      WHERE (SELECT count(*) FROM value_evidence)=jsonb_array_length(c->'delta'->'value_evidence') RETURNING id
    ), captured_tool_executions AS (
      INSERT INTO public.captured_tool_execution_v2(organization_id,collection_id,id,contract_version,lineage_id,run_id,evidence_id,execution,execution_digest,effect_id,attempt_id,created_at)
      SELECT $1,$2,(v->>'id')::uuid,(v->>'contractVersion'),(v->>'lineageId')::uuid,(v->>'runId')::uuid,(v->>'evidenceId')::uuid,v->'execution',(v->>'executionDigest'),(v->>'effectId'),(v->>'attemptId'),statement_timestamp()
      FROM admissible l CROSS JOIN LATERAL jsonb_array_elements(c->'delta'->'captured_tool_executions') v
      WHERE (SELECT count(*) FROM tool_input_lineage)=jsonb_array_length(c->'delta'->'tool_input_lineage') RETURNING id
    ), specimen_commit AS (
      UPDATE public.specimen s SET revision=l.revision+1,state=c->>'state',disposition=c->'record'->>'disposition',
        active_run_id=canonical_run_id,work_available_at=CASE WHEN c->>'state'='running' THEN statement_timestamp() ELSE NULL END,
        updated_at=statement_timestamp()
      FROM admissible l WHERE (SELECT count(*) FROM captured_tool_executions)=jsonb_array_length(c->'delta'->'captured_tool_executions')
        AND s.organization_id=$1 AND s.collection_id=$2 AND s.id=$3 AND s.revision=l.revision
        AND (SELECT count(*) FROM fields)=20 AND (SELECT count(DISTINCT field_key) FROM fields)=20
        AND (SELECT count(*) FROM findings)=jsonb_array_length(c->'delta'->'findings') RETURNING s.revision
    ), snapshot AS (
      INSERT INTO public.specimen_snapshot(organization_id,collection_id,specimen_id,revision,contract_version,snapshot,sha256,created_at)
      SELECT $1,$2,$3,l.revision+1,c->>'snapshot_contract',c->'snapshot',c->'receipt'->>'snapshotSha256',statement_timestamp()
      FROM admissible l WHERE (SELECT count(*) FROM specimen_commit)=1 RETURNING revision
    ), request AS (
      INSERT INTO public.request_receipt(organization_id,collection_id,actor_uid,operation,idempotency_key,request_sha256,specimen_id,revision,created_at)
      SELECT $1,$2,$4,'research-publication/v2',c->'receipt'->>'idempotencyKey',c->'receipt'->>'operationDigest',$3,l.revision+1,statement_timestamp()
      FROM admissible l WHERE (SELECT count(*) FROM snapshot)=1 RETURNING revision
    ), audit AS (
      INSERT INTO public.audit_event(organization_id,collection_id,id,specimen_id,actor_uid,action,revision,request_sha256,created_at)
      SELECT $1,$2,(c->>'audit_id')::uuid,$3,$4,'research_publication',l.revision+1,c->'receipt'->>'operationDigest',statement_timestamp()
      FROM admissible l WHERE (SELECT count(*) FROM request)=1 RETURNING id
    ), outbox AS (
      INSERT INTO public.outbox_event(organization_id,collection_id,id,specimen_id,aggregate_revision,event_type,deduplication_key,payload_references,created_at)
      SELECT $1,$2,(c->>'outbox_id')::uuid,$3,l.revision+1,'research_publication_committed',c->'receipt'->>'operationDigest',
        jsonb_build_object('receipt_id',c->'receipt'->>'id','record_version_id',c->'record'->>'id'),statement_timestamp()
      FROM admissible l WHERE (SELECT count(*) FROM audit)=1 RETURNING id
    ), state_commit AS (
      UPDATE public.research_harness_state h SET revision=h.revision+1,state=c->'next_state',state_json=c->>'next_state_json',updated_at=statement_timestamp()
      FROM admissible l WHERE h.organization_id=$1 AND h.program_key=l.program_key AND h.revision=l.state_revision
        AND (SELECT count(*) FROM outbox)=1 RETURNING h.revision
    ), pointer AS (
      UPDATE public.canonical_research_binding_v2 b SET registration_revision=b.registration_revision+1,
        current_canonical_revision=l.revision+1,current_record_version_id=(c->'receipt'->>'nativeRecordVersionId')::uuid,
        current_snapshot_sha256=c->'receipt'->>'snapshotSha256',current_host_record_version_id=c->'receipt'->>'hostRecordVersionId',
        current_receipt_id=(c->'receipt'->>'id')::uuid,current_chain_digest=c->'causal'->>'chain_digest'
      FROM admissible l WHERE b.organization_id=$1 AND b.collection_id=$2 AND b.specimen_id=$3
        AND b.registration_revision=l.registration_revision AND (SELECT count(*) FROM state_commit)=1 RETURNING b.binding_id
    )
    INSERT INTO public.research_publication_receipt_v2(organization_id,collection_id,actor_uid,idempotency_key,id,specimen_id,
      operation_digest,publication_digest,prepared_digest,intent_id,binding_id,job_id,job_key,generation,input_digest,profile_digest,runtime_binding_digest,
      used_canonical_revision,used_record_version_id,used_host_record_version_id,used_snapshot_sha256,resulting_canonical_revision,
      native_record_version_id,canonical_run_id,host_record_version_id,snapshot_sha256,projection_digest,projection_count,audit_id,outbox_id,policy_receipt_digest,lineage_digest,sensitive,winning_preparation_id,causal_proof,chain_digest,prepack_proof,prepack_proof_digest,created_at)
    SELECT $1,$2,$4,c->'receipt'->>'idempotencyKey',(c->'receipt'->>'id')::uuid,$3,c->'receipt'->>'operationDigest',
      c->'receipt'->>'publicationDigest',c->'receipt'->>'preparedDigest',(c->>'intent_id')::uuid,binding_id,job_id,job_key,generation,input_digest,profile_digest,runtime_binding_digest,
      l.revision,current_record_version_id,current_host_record_version_id,current_snapshot_sha256,l.revision+1,
      (c->'receipt'->>'nativeRecordVersionId')::uuid,canonical_run_id,c->'receipt'->>'hostRecordVersionId',c->'receipt'->>'snapshotSha256',
      c->'receipt'->>'projectionDigest',20,(c->>'audit_id')::uuid,(c->>'outbox_id')::uuid,
      c->'policy_materialization'->>'policy_receipt_digest',c->'policy_materialization'->>'lineage_digest',false,
      (c->'causal'->>'winning_preparation_id')::uuid,c->'causal',c->'causal'->>'chain_digest',c->'prepack_proof',c->'receipt'->>'prepackProofDigest',statement_timestamp()
    FROM admissible l WHERE (SELECT count(*) FROM pointer)=1
    """, params: [$organizationId,$collectionId,$specimenId,$actorUid,$commitJson]) @check(expr: "this == 1", message: "native research publication unavailable")
}


# Read immutable original intent and all bounded preparations before mutable
# discovery. An existing attempt without a complete receipt is unknown/HOLD.
query GetResearchPublicationIntentV2($organizationId: UUID!, $collectionId: UUID!, $specimenId: UUID!, $actorUid: String!, $idempotencyKey: String!, $requestIdentityDigest: String!) @auth(level: NO_ACCESS) {
  organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) { active }
  collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) { active role canViewSensitive }
  specimen(key: {organizationId: $organizationId, collectionId: $collectionId, id: $specimenId}) { sensitive }
  intent: _selectFirst(sql: """
    SELECT row_to_json(native_exact)::text AS exact_json FROM (

    SELECT CASE WHEN i.payload_json::jsonb=i.payload THEN i.payload_json::json END AS original,
      (SELECT count(*) FROM public.research_publication_preparation_v2 p WHERE p.organization_id=$1
        AND p.collection_id=$2 AND p.intent_id=i.id) AS preparation_count,
      CASE WHEN (SELECT count(*) FROM public.research_publication_preparation_v2 p WHERE p.organization_id=$1
        AND p.collection_id=$2 AND p.intent_id=i.id)<=20 THEN
        (SELECT COALESCE(json_agg(CASE WHEN (SELECT count(*) FROM json_each(p.payload_json::json) e WHERE e.key='preparation_digest')=1
          AND p.payload_json::jsonb->'preparation_digest'=to_jsonb(p.preparation_digest)
          AND (p.payload_json::jsonb-'preparation_digest')=p.payload
        THEN (SELECT json_object_agg(e.key,e.value) FROM json_each(p.payload_json::json) e
          WHERE e.key<>'preparation_digest') END ORDER BY p.ordinal),'[]'::json) FROM public.research_publication_preparation_v2 p
          WHERE p.organization_id=$1 AND p.collection_id=$2 AND p.intent_id=i.id) ELSE NULL END AS preparations,
      CASE WHEN a.id IS NULL THEN NULL ELSE jsonb_build_object('id',a.id,'preparation_id',a.preparation_id,
        'operation_digest',a.operation_digest,'preparation_digest',a.preparation_digest,'admission_digest',a.admission_digest) END AS attempt
    FROM public.research_publication_intent_v2 i
    JOIN public.specimen s ON s.organization_id=i.organization_id AND s.collection_id=i.collection_id AND s.id=i.specimen_id
    JOIN public.organization_member om ON om.organization_id=i.organization_id AND om.uid=$4 AND om.active
    JOIN public.collection_member cm ON cm.organization_id=i.organization_id AND cm.collection_id=i.collection_id
      AND cm.uid=$4 AND cm.active AND (NOT s.sensitive OR cm.can_view_sensitive)
    LEFT JOIN public.research_publication_attempt_v2 a ON a.organization_id=i.organization_id
      AND a.collection_id=i.collection_id AND a.intent_id=i.id
    WHERE i.organization_id=$1 AND i.collection_id=$2 AND i.specimen_id=$3
      AND i.actor_uid=$4 AND i.idempotency_key=$5 AND $6<>''

    ) native_exact
    """, params: [$organizationId,$collectionId,$specimenId,$actorUid,$idempotencyKey,$requestIdentityDigest])
}

mutation RetainResearchPublicationIntentV2($organizationId: UUID!, $collectionId: UUID!, $specimenId: UUID!, $actorUid: String!, $intentJson: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active == true") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active == true && response.query.organizationMember.active == true && this.role in ['operator','reviewer','manager','admin']") { active role canViewSensitive }
  }
  retainedIntent: _execute(sql: """
    WITH args AS (SELECT $5::jsonb AS i), admitted AS (
      SELECT i FROM args JOIN public.specimen s ON s.organization_id=$1 AND s.collection_id=$2 AND s.id=$3
      JOIN public.canonical_research_binding_v2 b ON b.organization_id=$1 AND b.collection_id=$2 AND b.specimen_id=$3
      JOIN public.research_harness_state h ON h.organization_id=$1 AND h.program_key=b.program_key
      JOIN public.organization_member om ON om.organization_id=$1 AND om.uid=$4 AND om.active
      JOIN public.collection_member cm ON cm.organization_id=$1 AND cm.collection_id=$2 AND cm.uid=$4 AND cm.active
        AND cm.role IN ('operator','reviewer','manager','admin') AND (NOT s.sensitive OR cm.can_view_sensitive)
      WHERE NOT s.sensitive AND b.active AND b.publication_version='research-publication/v2'
        AND i->>'contract_version'='research-publication-intent/v2' AND i->>'actor_uid'=$4
        AND i->>'binding_id'=b.binding_id::text AND i->>'job_key'=b.job_key AND i->>'program_key'=b.program_key
        AND i->>'authority_digest'=b.authority_digest AND i->>'import_proof_id'=b.import_proof_id::text
        AND i->>'import_proof_digest'=b.import_proof_digest
        AND i->'original_base'->>'record_version_id'=b.base_record_version_id::text
        AND (i->'original_base'->>'record_revision')::integer=b.base_canonical_revision
        AND i->'original_base'->>'snapshot_sha256'=b.base_snapshot_sha256
        AND i->'original_base'->>'canonical_run_id'=b.canonical_run_id::text
        AND i->'original_base'->>'host_record_version_id'=b.base_host_record_version_id
        AND i->'original_prepared'->'basis'->'scope'->>'organization_id'=$1::text
        AND i->'original_prepared'->'basis'->'scope'->>'collection_id'=$2::text
        AND i->'original_prepared'->'basis'->'scope'->>'specimen_id'=$3::text
        AND i->'original_prepared'->'basis'->'scope'->>'job_id'=b.job_id
        AND (i->'original_prepared'->'basis'->'scope'->>'generation')::integer=b.generation
        AND i->'original_prepared'->'basis'->>'binding_digest'=b.runtime_binding_digest
        AND h.revision=(i->'original_prepared'->'basis'->>'state_revision')::integer
      FOR UPDATE OF s,b,h
    ) INSERT INTO public.research_publication_intent_v2(organization_id,collection_id,actor_uid,idempotency_key,id,specimen_id,
      operation_digest,scientific_intent_digest,request_identity_digest,payload,payload_json,created_at)
    SELECT $1,$2,$4,i->>'idempotency_key',(i->>'id')::uuid,$3,i->>'operation_digest',i->>'scientific_intent_digest',
      i->>'server_request_identity_digest',i,$5,statement_timestamp() FROM admitted
    """, params: [$organizationId,$collectionId,$specimenId,$actorUid,$intentJson]) @check(expr: "this == 1", message: "native v2 intent unavailable")
}

# Append-only admission; a fresh preparation cannot replace unknown attempted
# work. It changes no canonical/journal/ledger/lease/outbox state or paid effect.
mutation RetainResearchPublicationPreparationV2($organizationId: UUID!, $collectionId: UUID!, $specimenId: UUID!, $actorUid: String!, $preparationJson: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active == true") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active == true && response.query.organizationMember.active == true && this.role in ['operator','reviewer','manager','admin']") { active role canViewSensitive }
  }
  retainedPreparation: _execute(sql: """
    WITH args AS (SELECT $5::jsonb AS p), admitted AS (
      SELECT p FROM args JOIN public.research_publication_intent_v2 i ON i.organization_id=$1 AND i.collection_id=$2
        AND i.specimen_id=$3 AND i.actor_uid=$4 AND i.id=(p->>'intent_id')::uuid
      JOIN public.specimen s ON s.organization_id=$1 AND s.collection_id=$2 AND s.id=$3 AND NOT s.sensitive
      JOIN public.canonical_research_binding_v2 b ON b.organization_id=$1 AND b.collection_id=$2 AND b.specimen_id=$3
        AND b.binding_id=(i.payload->>'binding_id')::uuid AND b.active AND b.publication_version='research-publication/v2'
      JOIN public.research_harness_state h ON h.organization_id=$1 AND h.program_key=b.program_key
      WHERE p->>'contract_version'='research-publication-preparation/v2'
        AND p->>'scientific_intent_digest'=i.scientific_intent_digest AND p->>'authority_digest'=b.authority_digest
        AND h.revision=(p->>'state_revision')::integer AND h.state=p->'expected_state'
        AND b.current_record_version_id=(p->'anchor'->>'record_version_id')::uuid
        AND b.current_canonical_revision=(p->'anchor'->>'record_revision')::integer
        AND b.current_snapshot_sha256=p->'anchor'->>'snapshot_sha256'
        AND b.current_host_record_version_id=p->'anchor'->>'host_record_version_id'
        AND b.current_chain_digest=p->>'anchor_chain_digest'
        AND b.current_receipt_id IS NOT DISTINCT FROM (p->>'anchor_receipt_id')::uuid
        AND b.registration_revision=(p->>'anchor_registration_revision')::integer
        AND h.state->'jobs'->b.job_key->'lease'=p->'prepared'->'basis'->'lease'
        AND (h.state->'jobs'->b.job_key->'lease'->>'expires_at')::numeric>extract(epoch FROM statement_timestamp())
        AND NOT EXISTS (SELECT 1 FROM public.research_publication_attempt_v2 a WHERE a.organization_id=$1
          AND a.collection_id=$2 AND a.intent_id=i.id)
        AND (p->>'ordinal')::integer BETWEEN 1 AND 20
        AND (p->>'ordinal')::integer=(SELECT COALESCE(max(ordinal),0)+1 FROM public.research_publication_preparation_v2 x
          WHERE x.organization_id=$1 AND x.collection_id=$2 AND x.intent_id=i.id)
        AND ((p->>'ordinal')::integer=1 OR EXISTS (SELECT 1 FROM public.research_publication_preparation_v2 x
          WHERE x.organization_id=$1 AND x.collection_id=$2 AND x.intent_id=i.id
            AND x.id=(p->>'prior_preparation_id')::uuid AND x.ordinal=(p->>'ordinal')::integer-1
            AND x.preparation_digest=p->>'prior_preparation_digest'))
      FOR UPDATE OF i,s,b,h
    ) INSERT INTO public.research_publication_preparation_v2(organization_id,collection_id,id,intent_id,ordinal,
      prior_preparation_id,preparation_digest,admission_digest,payload,payload_json,created_at)
    SELECT $1,$2,(p->>'id')::uuid,(p->>'intent_id')::uuid,(p->>'ordinal')::integer,(p->>'prior_preparation_id')::uuid,
      p->>'preparation_digest',p->>'admission_digest',p- 'preparation_digest',$5,statement_timestamp() FROM admitted
    """, params: [$organizationId,$collectionId,$specimenId,$actorUid,$preparationJson]) @check(expr: "this == 1", message: "native v2 preparation unavailable")
}

# Exactly one durable pre-call marker. No reset, retry flag or mutable completion
# updater. Its absence is unexecuted; presence without complete receipt is HOLD.
mutation MarkResearchPublicationAttemptV2($organizationId: UUID!, $collectionId: UUID!, $specimenId: UUID!, $actorUid: String!, $admissionJson: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active == true") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active == true && response.query.organizationMember.active == true && this.role in ['operator','reviewer','manager','admin']") { active role canViewSensitive }
  }
  markedAttempt: _execute(sql: """
    WITH args AS (SELECT $5::jsonb AS a), admitted AS (
      SELECT a,p FROM args JOIN public.research_publication_intent_v2 i ON i.organization_id=$1 AND i.collection_id=$2
        AND i.specimen_id=$3 AND i.actor_uid=$4 AND i.id=(a->>'intent_id')::uuid AND i.operation_digest=a->>'operation_digest'
      JOIN public.research_publication_preparation_v2 p ON p.organization_id=$1 AND p.collection_id=$2
        AND p.intent_id=i.id AND p.id=(a->>'preparation_id')::uuid AND p.preparation_digest=a->>'preparation_digest'
        AND p.admission_digest=a->>'admission_digest'
      JOIN public.specimen s ON s.organization_id=$1 AND s.collection_id=$2 AND s.id=$3 AND NOT s.sensitive
      JOIN public.canonical_research_binding_v2 b ON b.organization_id=$1 AND b.collection_id=$2 AND b.specimen_id=$3
        AND b.active AND b.binding_id=(i.payload->>'binding_id')::uuid AND b.publication_version='research-publication/v2'
      JOIN public.research_harness_state h ON h.organization_id=$1 AND h.program_key=b.program_key
      WHERE h.revision=(a->>'state_revision')::integer AND h.state=a->'expected_state'
        AND b.current_record_version_id=(a->>'used_record_version_id')::uuid
        AND b.registration_revision=(a->>'registration_revision')::integer
        AND NOT EXISTS (SELECT 1 FROM public.research_publication_attempt_v2 x WHERE x.organization_id=$1
          AND x.collection_id=$2 AND x.intent_id=i.id)
      FOR UPDATE OF i,p,s,b,h
    ) INSERT INTO public.research_publication_attempt_v2(organization_id,collection_id,intent_id,id,preparation_id,
      operation_digest,preparation_digest,admission_digest,created_at)
    SELECT $1,$2,(a->>'intent_id')::uuid,(a->>'id')::uuid,(a->>'preparation_id')::uuid,a->>'operation_digest',
      a->>'preparation_digest',a->>'admission_digest',statement_timestamp() FROM admitted
    """, params: [$organizationId,$collectionId,$specimenId,$actorUid,$admissionJson]) @check(expr: "this == 1", message: "native v2 attempt unavailable")
}


# Specimen-ID restart discovery reads immutable actor-scoped intents of the
# specimen's active binding only, so intents left by a replaced registration are
# never replayed or counted. A complete <=20 inventory is required; overflow
# returns NULL and HOLDs. It never picks a latest row, lease, budget or mutable job.
query GetRetainedResearchPublicationLocatorsV2($organizationId: UUID!, $collectionId: UUID!, $specimenId: UUID!, $actorUid: String!) @auth(level: NO_ACCESS) {
  organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) { active }
  collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) { active role canViewSensitive }
  specimen(key: {organizationId: $organizationId, collectionId: $collectionId, id: $specimenId}) { sensitive }
  inventory: _selectFirst(sql: """
    WITH permitted AS (
      SELECT s.id FROM public.specimen s
      JOIN public.organization_member om ON om.organization_id=s.organization_id AND om.uid=$4 AND om.active
      JOIN public.collection_member cm ON cm.organization_id=s.organization_id AND cm.collection_id=s.collection_id
        AND cm.uid=$4 AND cm.active AND (NOT s.sensitive OR cm.can_view_sensitive)
      WHERE s.organization_id=$1 AND s.collection_id=$2 AND s.id=$3
    ), complete AS (
      SELECT i.* FROM public.research_publication_intent_v2 i JOIN permitted s ON s.id=i.specimen_id
      JOIN public.canonical_research_binding_v2 b ON b.organization_id=$1 AND b.collection_id=$2
        AND b.specimen_id=$3 AND b.active AND i.payload->>'binding_id'=b.binding_id::text
      WHERE i.organization_id=$1 AND i.collection_id=$2 AND i.specimen_id=$3 AND i.actor_uid=$4
    ) SELECT count(*) AS locator_count, CASE WHEN count(*)<=20 THEN
      COALESCE(jsonb_agg(jsonb_build_object('contract_version','retained-publication-locator/v2',
        'intent_id',i.id,'original_scope',i.payload->'original_prepared'->'basis'->'scope',
        'program_key',i.payload->'original_prepared'->'basis'->>'program_key',
        'idempotency_key',i.idempotency_key,'request_identity_digest',i.request_identity_digest,
        'receipt_present',EXISTS (SELECT 1 FROM public.research_publication_receipt_v2 p
          WHERE p.organization_id=$1 AND p.collection_id=$2 AND p.specimen_id=$3 AND p.actor_uid=$4 AND p.intent_id=i.id),
        'attempt_present',EXISTS (SELECT 1 FROM public.research_publication_attempt_v2 a
          WHERE a.organization_id=$1 AND a.collection_id=$2 AND a.intent_id=i.id)) ORDER BY i.id),'[]'::jsonb)
      ELSE NULL END AS locators FROM complete i
    """, params: [$organizationId,$collectionId,$specimenId,$actorUid])
}
