      SELECT $1,$2,(v->>'id')::uuid,(v->>'lineageId')::uuid,(v->>'ordinal')::int,(v->>'researchFieldKey'),(v->>'canonicalFieldKey'),(v->>'sourceRevision')::int,(v->>'dependencyResolutionDigest'),(v->>'sourceCheckpointId'),(v->>'sourceCheckpointDigest'),(v->>'sourceTypedCheckpointDigest'),(v->>'sourceRunId')::uuid,(v->>'sourceCandidateId')::uuid,(v->>'sourceRecordVersionId')::uuid,(v->>'sourceCandidateDigest'),(v->>'sourceRecordDigest'),(v->>'sourcePublicationLineageDigest'),(v->>'sourceRecordFieldsDigest'),v->'sourceRecordFields',statement_timestamp()
      FROM admissible l CROSS JOIN LATERAL jsonb_array_elements(c->'delta'->'value_dependencies') v
