        'regions',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'runId',r.run_id,'domainRegionId',r.domain_region_id,'sourceAssetId',r.source_asset_id,'cropAssetId',r.crop_asset_id,'geometry',r.geometry,'ordinal',r.ordinal,'regionType',r.region_type,'segmentationVersion',r.segmentation_version,'supersedesRegionId',r.supersedes_region_id,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.label_region r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.run_id IN (SELECT pr.id FROM public.pipeline_run pr WHERE pr.organization_id=$1 AND pr.collection_id=$2 AND pr.specimen_id=$3) ORDER BY r.id LIMIT 4097) r),
        'runs',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'specimenId',r.specimen_id,'profileVersionId',r.profile_version_id,'supersedesRunId',r.supersedes_run_id,'pinnedVersions',r.pinned_versions,'inputSha256',r.input_sha256,'traceId',r.trace_id,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.pipeline_run r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.specimen_id=$3 ORDER BY r.id LIMIT 4097) r)) AS fresh_native_input_rows,
        jsonb_build_object('value_lineages',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'contractVersion',r.contract_version,'specimenId',r.specimen_id,'runId',r.run_id,'candidateId',r.candidate_id,'recordVersionId',r.record_version_id,'predecessorId',r.predecessor_id,'priorRevision',r.prior_revision,'resultRevision',r.result_revision,'priorNativeSnapshotDigest',r.prior_native_snapshot_digest,'priorGraphSnapshotDigest',r.prior_graph_snapshot_digest,'priorActiveGraphDigest',r.prior_active_graph_digest,'fieldKey',r.field_key,'researchFieldKey',r.research_field_key,'layer',r.layer,'resolutionDigest',r.resolution_digest,'typedCheckpointDigest',r.typed_checkpoint_digest,'nativeCheckpointId',r.native_checkpoint_id,'nativeCheckpointDigest',r.native_checkpoint_digest,'originalRequestDigest',r.original_request_digest,'originalScope',r.original_scope,'derivation',r.derivation,'derivationDigest',r.derivation_digest,'scientificSourceDigest',r.scientific_source_digest,'precision',r.precision,'centuryRule',r.century_rule,'readingSources',r.reading_sources,'literalGrounding',r.literal_grounding,'selectedObservationId',r.selected_observation_id,'selectedTranscriptionId',r.selected_transcription_id,'settledObservationIds',r.settled_observation_ids,'evidenceIds',r.evidence_ids,'evidenceRelations',r.evidence_relations,'consumedDependencies',r.consumed_dependencies,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.canonical_value_lineage_v2 r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.specimen_id=$3 ORDER BY r.id LIMIT 4097) r),
        'value_dependencies',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'lineageId',r.lineage_id,'ordinal',r.ordinal,'researchFieldKey',r.research_field_key,'canonicalFieldKey',r.canonical_field_key,'sourceRevision',r.source_revision,'dependencyResolutionDigest',r.dependency_resolution_digest,'sourceCheckpointId',r.source_checkpoint_id,'sourceCheckpointDigest',r.source_checkpoint_digest,'sourceTypedCheckpointDigest',r.source_typed_checkpoint_digest,'sourceRunId',r.source_run_id,'sourceCandidateId',r.source_candidate_id,'sourceRecordVersionId',r.source_record_version_id,'sourceCandidateDigest',r.source_candidate_digest,'sourceRecordDigest',r.source_record_digest,'sourcePublicationLineageDigest',r.source_publication_lineage_digest,'sourceRecordFieldsDigest',r.source_record_fields_digest,'sourceRecordFields',r.source_record_fields,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.canonical_value_dependency_v2 r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.lineage_id IN (SELECT cl.id FROM public.canonical_value_lineage_v2 cl WHERE cl.organization_id=$1 AND cl.collection_id=$2 AND cl.specimen_id=$3) ORDER BY r.id LIMIT 4097) r),
        'value_evidence',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'lineageId',r.lineage_id,'evidenceId',r.evidence_id,'researchEvidenceId',r.research_evidence_id,'associationKind',r.association_kind,'originalRelation',r.original_relation,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.canonical_value_evidence_v2 r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.lineage_id IN (SELECT cl.id FROM public.canonical_value_lineage_v2 cl WHERE cl.organization_id=$1 AND cl.collection_id=$2 AND cl.specimen_id=$3) ORDER BY r.id LIMIT 4097) r),
        'tool_input_lineage',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'contractVersion',r.contract_version,'specimenId',r.specimen_id,'runId',r.run_id,'evidenceId',r.evidence_id,'nativeCheckpointId',r.native_checkpoint_id,'nativeCheckpointDigest',r.native_checkpoint_digest,'originalRequestDigest',r.original_request_digest,'originalScope',r.original_scope,'originalRequest',r.original_request,'queryDigest',r.query_digest,'query',r.query,'effectId',r.effect_id,'attemptId',r.attempt_id,'receiptDigest',r.receipt_digest,'receiptBindingDigest',r.receipt_binding_digest,'sourcePolicyDigest',r.source_policy_digest,'capturePolicyDigest',r.capture_policy_digest,'sourceRegistryDigest',r.source_registry_digest,'canonicalMappingDigest',r.canonical_mapping_digest,'sourceCaptureProof',r.source_capture_proof,'fragments',r.fragments,'fragmentDigests',r.fragment_digests,'observationIds',r.observation_ids,'regionIds',r.region_ids,'inputSources',r.input_sources,'nativeInputs',r.native_inputs,'nativeTranscriptionProofs',r.native_transcription_proofs,'selectedObservationId',r.selected_observation_id,'legacyProducerDigest',r.legacy_producer_digest,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.tool_input_lineage_v2 r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.specimen_id=$3 ORDER BY r.id LIMIT 4097) r),
        'captured_tool_executions',(SELECT COALESCE(jsonb_agg(jsonb_build_object('organizationId',r.organization_id,'collectionId',r.collection_id,'id',r.id,'contractVersion',r.contract_version,'lineageId',r.lineage_id,'runId',r.run_id,'evidenceId',r.evidence_id,'execution',r.execution,'executionDigest',r.execution_digest,'effectId',r.effect_id,'attemptId',r.attempt_id,'createdAt',r.created_at) ORDER BY r.id),'[]'::jsonb) FROM (SELECT * FROM public.captured_tool_execution_v2 r WHERE r.organization_id=$1 AND r.collection_id=$2 AND r.run_id=l.canonical_run_id ORDER BY r.id LIMIT 4097) r)) AS fresh_lineage_rows
      FROM locked l
    ), prior_fields AS (
      SELECT f.* FROM public.resolved_field f JOIN locked l ON f.organization_id=$1 AND f.collection_id=$2
        AND f.record_version_id=l.current_record_version_id
    ), admissible AS (
      SELECT l.* FROM native_facts l WHERE
        c->'materialization_input_guard'->>'contract_version'='native-materialization-guard/v2'
        AND c->'materialization_input_guard'->>'binding_id'=l.binding_id::text
        AND (c->'materialization_input_guard'->>'registration_revision')::int=l.registration_revision
        AND (c->'materialization_input_guard'->>'state_revision')::int=l.state_revision
        AND c->'materialization_input_guard'->'projection_rows'=fresh_projection_rows
        AND c->'materialization_input_guard'->'native_input_rows'=fresh_native_input_rows
        AND c->'materialization_input_guard'->'lineage_rows'=fresh_lineage_rows
        AND c->'prepack_proof'->>'contract_version'='research-prepack-proof/v2'
        AND c->'receipt'->>'prepackProofDigest'=c->'causal'->'native_commit'->>'prepackProofDigest'
        AND c->'prepack_proof'->>'policy_graph_digest'=c->'policy_materialization'->>'result_digest'
        AND c->'prepack_proof'->>'packed_snapshot_digest'=c->'receipt'->>'snapshotSha256'
        AND c->'prepack_proof'->'packing_metadata'=c->'snapshot'->'active_graph'
        AND jsonb_typeof(c->'prepack_proof'->'policy_graph_json')='string'
        AND jsonb_typeof(c->'prepack_proof'->'post_audit_graph_json')='string'
        AND ((c->'prepack_proof'->>'post_audit_graph_json')::jsonb-'audit')=((c->'prepack_proof'->>'policy_graph_json')::jsonb-'audit')
        AND jsonb_array_length((c->'prepack_proof'->>'post_audit_graph_json')::jsonb->'audit')
          =jsonb_array_length((c->'prepack_proof'->>'policy_graph_json')::jsonb->'audit')+1
        AND ((c->'prepack_proof'->>'post_audit_graph_json')::jsonb->'audit')-(-1)
          =(c->'prepack_proof'->>'policy_graph_json')::jsonb->'audit'
        AND (c->'prepack_proof'->>'post_audit_graph_json')::jsonb->'audit'->-1->>'id'=c->>'audit_id'
        AND (c->'prepack_proof'->>'post_audit_graph_json')::jsonb->'audit'->-1->>'actor'=$4
        AND (c->'prepack_proof'->>'post_audit_graph_json')::jsonb->'audit'->-1->>'reason'=c->'receipt'->>'operationDigest'
        AND jsonb_typeof(c->'delta'->'value_lineages')='array'
        AND jsonb_array_length(c->'delta'->'value_lineages')=(CASE WHEN c->'fields' @> jsonb_build_array(jsonb_build_object('fieldKey',c->>'changed_field','state','supported')) THEN 1 ELSE 0 END)
        AND NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'delta'->'value_lineages') v WHERE COALESCE((
          v->>'contractVersion'<>'canonical-value-lineage/v2' OR v->>'specimenId'<>$3::text
          OR v->>'runId'<>canonical_run_id::text OR v->>'fieldKey'<>c->>'changed_field'
          OR v->>'researchFieldKey'<>c->'prepared'->'basis'->>'field_key'
          OR v->>'recordVersionId'<>c->'record'->>'id' OR v->>'predecessorId'<>current_record_version_id::text
          OR jsonb_typeof(v->'priorRevision')<>'number' OR jsonb_typeof(v->'resultRevision')<>'number'
          OR (v->>'priorRevision')::int<>l.revision OR (v->>'resultRevision')::int<>l.revision+1
          OR v->>'priorNativeSnapshotDigest'<>current_snapshot_sha256
          OR v->>'nativeCheckpointId'<>c->'prepared'->'basis'->>'checkpoint_id'
          OR v->>'nativeCheckpointDigest'<>c->'prepared'->'basis'->>'checkpoint_digest'
          OR v->'originalScope'<>c->'capture_scope'
          OR v->>'originalRequestDigest' IS DISTINCT FROM old_state->'jobs'->job_key->'fields'->(v->>'researchFieldKey')->'checkpoint'->'accepted_output_proof'->>'request_digest'
          OR v->'derivation' IS DISTINCT FROM old_state->'jobs'->job_key->'fields'->(v->>'researchFieldKey')->'checkpoint'->'payload'->'resolution'->'derivation'
          OR v->>'scientificSourceDigest' IS DISTINCT FROM v->'derivation'->>'source_digest'
          OR NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'delta'->'candidates') candidate
            WHERE candidate->>'id'=v->>'candidateId' AND candidate->>'fieldKey'=v->>'fieldKey')),true))

        AND jsonb_typeof(c->'delta'->'value_dependencies')='array'
        AND jsonb_typeof(c->'delta'->'value_evidence')='array'
        AND jsonb_typeof(c->'delta'->'tool_input_lineage')='array'
        AND jsonb_typeof(c->'delta'->'captured_tool_executions')='array'
        AND jsonb_array_length(c->'delta'->'value_dependencies')=COALESCE((SELECT sum(jsonb_array_length(v->'consumedDependencies'))
          FROM jsonb_array_elements(c->'delta'->'value_lineages') v),0)
        AND jsonb_array_length(c->'delta'->'value_evidence')=COALESCE((SELECT sum(jsonb_array_length(v->'evidenceIds'))
          FROM jsonb_array_elements(c->'delta'->'value_lineages') v),0)
        AND NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'delta'->'value_lineages') v WHERE COALESCE((
          jsonb_array_length(v->'consumedDependencies')<>jsonb_array_length(c->'prepared'->'basis'->'dependencies')
          OR EXISTS (SELECT 1 FROM jsonb_array_elements(v->'evidenceIds') e
            WHERE (SELECT count(*) FROM jsonb_array_elements(c->'delta'->'value_evidence') proof
              WHERE proof->>'lineageId'=v->>'id' AND proof->>'evidenceId'=e#>>'{}')<>1)
          OR EXISTS (SELECT 1 FROM jsonb_array_elements(v->'consumedDependencies') WITH ORDINALITY dep(value,ordinal)
            WHERE (SELECT count(*) FROM jsonb_array_elements(c->'delta'->'value_dependencies') proof
              WHERE proof->>'lineageId'=v->>'id' AND (proof->>'ordinal')::int=dep.ordinal-1
                AND proof-'id'-'lineageId'=dep.value)<>1)),true))
        AND jsonb_array_length(c->'delta'->'captured_tool_executions')=jsonb_array_length(c->'delta'->'tool_input_lineage')

        AND NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'delta'->'value_dependencies') d WHERE COALESCE((
          NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'prepared'->'basis'->'dependencies') pin
            WHERE pin->>'field_key'=d->>'researchFieldKey' AND pin->>'checkpoint_id'=d->>'sourceCheckpointId'
              AND pin->>'checkpoint_digest'=d->>'sourceCheckpointDigest'
              AND pin->>'resolution_digest'=d->>'dependencyResolutionDigest' AND (pin->>'revision')::int=(d->>'sourceRevision')::int)
          OR NOT EXISTS (SELECT 1 FROM public.field_candidate candidate JOIN public.resolved_field f
            ON f.organization_id=candidate.organization_id AND f.collection_id=candidate.collection_id AND f.candidate_id=candidate.id
            WHERE candidate.organization_id=$1 AND candidate.collection_id=$2 AND candidate.run_id=canonical_run_id
              AND candidate.id=(d->>'sourceCandidateId')::uuid AND candidate.field_key=d->>'canonicalFieldKey'
              AND f.record_version_id=(d->>'sourceRecordVersionId')::uuid AND f.field_key=d->>'canonicalFieldKey')
          OR NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'delta'->'value_lineages') lineage WHERE lineage->>'id'=d->>'lineageId')),true))

        AND NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'delta'->'tool_input_lineage') t WHERE COALESCE((
          t->>'contractVersion'<>'research-tool-input-lineage/v2' OR t->>'specimenId'<>$3::text
          OR t->>'runId'<>canonical_run_id::text OR t->'originalScope'<>c->'capture_scope'
          OR t->'originalRequest'->'scope'<>t->'originalScope'
          OR t->>'nativeCheckpointId'<>c->'prepared'->'basis'->>'checkpoint_id'
          OR t->>'nativeCheckpointDigest'<>c->'prepared'->'basis'->>'checkpoint_digest'
          OR t->>'originalRequestDigest' IS DISTINCT FROM old_state->'jobs'->job_key->'fields'->(c->'prepared'->'basis'->>'field_key')->'checkpoint'->'accepted_output_proof'->>'request_digest'
          OR old_state->'effects'->(t->>'effectId')->>'status' IS DISTINCT FROM 'completed'
          OR old_state->'effects'->(t->>'effectId')->>'job_key' IS DISTINCT FROM job_key
          OR old_state->'effects'->(t->>'effectId')->'scope' IS DISTINCT FROM jsonb_build_object('organization_id',$1::text,'collection_id',$2::text,'specimen_id',$3::text,'job_id',job_id,'generation',(t->'originalScope'->>'generation')::int)
          OR old_state->'effects'->(t->>'effectId')->'receipt'->>'attempt_id' IS DISTINCT FROM t->>'attemptId'
          OR NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'prepared'->'basis'->'receipts') receipt
            WHERE receipt->>'effect_id'=t->>'effectId' AND receipt=t->'sourceCaptureProof'->'receipt')
          OR t->>'canonicalMappingDigest'<>semantic_mapping_digest OR t->>'sourceRegistryDigest'<>c->'prepared'->'publication'->'checkpoints'->0->>'source_registry_digest'
          OR NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'delta'->'captured_tool_executions') execution
            WHERE execution->>'lineageId'=t->>'id' AND execution->>'effectId'=t->>'effectId'
              AND execution->>'attemptId'=t->>'attemptId' AND execution->>'evidenceId'=t->>'evidenceId')),true))

        AND NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'delta'->'captured_tool_executions') x WHERE COALESCE((
          x->>'contractVersion'<>'research-tool-execution/v2' OR x->>'runId'<>canonical_run_id::text
          OR x->'execution'->>'effect_id'<>x->>'effectId' OR x->'execution'->>'attempt_id'<>x->>'attemptId'
          OR NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'delta'->'tool_input_lineage') t
            WHERE t->>'id'=x->>'lineageId' AND t->>'evidenceId'=x->>'evidenceId')),true))
        AND NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'delta'->'value_evidence') e WHERE COALESCE((
          NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'delta'->'value_lineages') lineage
            WHERE lineage->>'id'=e->>'lineageId' AND lineage->'evidenceIds' @> jsonb_build_array(e->>'evidenceId'))
          OR c->'policy_materialization'->'evidence_id_mapping'->> (e->>'researchEvidenceId') IS DISTINCT FROM e->>'evidenceId'
          OR e->>'associationKind' IS DISTINCT FROM (CASE WHEN
            old_state->'jobs'->job_key->'fields'->(c->'prepared'->'basis'->>'field_key')->'checkpoint'->'payload'->'resolution'->'derivation'->'evidence_ids' @> jsonb_build_array(e->>'researchEvidenceId')
            THEN 'original_derivation_record' ELSE 'original_value_evidence' END)
          OR e->>'originalRelation' IS DISTINCT FROM old_state->'jobs'->job_key->'fields'->(c->'prepared'->'basis'->>'field_key')->'checkpoint'->'payload'->'resolution'->'value'->'evidence_relations'->>(e->>'researchEvidenceId')
        ),true))
        AND (SELECT count(*) FROM prior_fields)=20 AND (SELECT count(DISTINCT field_key) FROM prior_fields)=20
        AND (SELECT jsonb_agg(jsonb_build_object('id',f.id,'recordVersionId',f.record_version_id,
          'candidateId',f.candidate_id,'fieldKey',f.field_key,'state',f.state,'fieldGroup',f.field_group) ORDER BY f.field_key)
          FROM prior_fields f)=c->'prior_fields'
        AND (SELECT array_agg(field_key ORDER BY field_key) FROM prior_fields)=ARRAY['city','collection_code','collection_method','collectors','country','county','date_identified','date_visited_from','date_visited_to','elevation_from_ft','elevation_from_m','elevation_to_ft','elevation_to_m','fmnh_ins_number','habitat','identified_by_irn','precise_location','province_state','taxon','verbatim_dts']
        AND jsonb_array_length(c->'fields')=20
        AND (SELECT count(DISTINCT v->>'fieldKey') FROM jsonb_array_elements(c->'fields') v)=20
        AND (SELECT jsonb_agg(v->>'fieldKey' ORDER BY v->>'fieldKey') FROM jsonb_array_elements(c->'fields') v)
          =c->'policy_materialization'->'policy_receipt'->'exact_field_keys'
        AND NOT EXISTS (SELECT 1 FROM prior_fields f JOIN LATERAL jsonb_array_elements(c->'fields') v ON v->>'fieldKey'=f.field_key
          WHERE f.field_key<>c->>'changed_field' AND (v->>'candidateId' IS DISTINCT FROM f.candidate_id::text
            OR v->>'state' IS DISTINCT FROM f.state OR v->>'fieldGroup' IS DISTINCT FROM f.field_group))
        AND NOT EXISTS (SELECT 1 FROM jsonb_array_elements(c->'fields') v WHERE
          (v->>'recordVersionId')::uuid<>(c->'receipt'->>'nativeRecordVersionId')::uuid
          OR v->>'fieldGroup' NOT IN ('mandatory','optional'))
        AND NOT EXISTS (SELECT 1 FROM prior_fields f LEFT JOIN public.field_candidate candidate
          ON candidate.organization_id=$1 AND candidate.collection_id=$2 AND candidate.id=f.candidate_id
          WHERE (f.candidate_id IS NOT NULL AND (candidate.id IS NULL OR candidate.run_id<>canonical_run_id OR candidate.field_key<>f.field_key))
            OR (f.state='supported' AND f.candidate_id IS NULL))
        AND c->>'changed_field'=semantic_mapping->'field_mapping'->>(c->'prepared'->'basis'->>'field_key')
        AND COALESCE((c->'snapshot'->'run'->>'human_approved')::boolean,false)=false
        AND c->'record'->>'runId'=canonical_run_id::text
        AND c->'record'->>'predecessorId'=current_record_version_id::text
        AND c->'record'->>'id'=c->'receipt'->>'nativeRecordVersionId'
        AND (c->'record'->'disposition'='null'::jsonb OR c->'record'->>'disposition' IN ('cleared','needs_human_review'))
        AND c->'snapshot'->>'id'=$3::text AND (c->'snapshot'->>'version')::integer=revision+1
        AND c->'snapshot'->'asset'->>'sha256'=source_sha256
        AND COALESCE((c->'snapshot'->'asset'->>'sensitive')::boolean,true)=false
        AND c->'snapshot'->'scope'=jsonb_build_object('organization_id',$1::text,'collection_id',$2::text)
        AND c->'snapshot'->'run'->>'id'=canonical_run_id::text
        AND c->'snapshot'->'run'->'disposition'=c->'record'->'disposition'
    ), assets AS (
      INSERT INTO public.source_asset(organization_id,collection_id,id,specimen_id,kind,parent_asset_id,bucket,object_name,
        generation,sha256,mime_type,byte_size,width,height,acquisition_method,uploader_uid,created_at)
      SELECT $1,$2,(v->>'id')::uuid,$3,v->>'kind',(v->>'parentAssetId')::uuid,v->>'bucket',v->>'objectName',v->>'generation',
        v->>'sha256',v->>'mimeType',(v->>'byteSize')::bigint,(v->>'width')::integer,(v->>'height')::integer,
        v->>'acquisitionMethod',v->>'uploaderUid',statement_timestamp()
      FROM admissible l CROSS JOIN LATERAL jsonb_array_elements(c->'delta'->'assets') v RETURNING id
    ), evidence AS (
      INSERT INTO public.evidence_item(organization_id,collection_id,id,run_id,source,source_version,adapter_version,query,
        outcome,locator,response_sha256,captured_at,raw_asset_id,created_at)
      SELECT $1,$2,(v->>'id')::uuid,canonical_run_id,v->>'source',v->>'sourceVersion',v->>'adapterVersion',v->'query',
        v->>'outcome',v->>'locator',v->>'responseSha256',(v->>'capturedAt')::timestamptz,(v->>'rawAssetId')::uuid,statement_timestamp()
      FROM admissible l CROSS JOIN LATERAL jsonb_array_elements(c->'delta'->'evidence') v
      WHERE (SELECT count(*) FROM assets)=jsonb_array_length(c->'delta'->'assets') RETURNING id,run_id,outcome,source,locator
    ), calls AS (
      INSERT INTO public.tool_call(organization_id,collection_id,id,run_id,call_key,phase,tool,tool_version,source,field_keys,
        input_source,transcription_version_id,observation_id,attempt,arguments,outcome,result,evidence_id,started_at,completed_at,created_at)
      SELECT $1,$2,(v->>'id')::uuid,canonical_run_id,v->>'callKey',v->>'phase',v->>'tool',v->>'toolVersion',v->>'source',
        ARRAY(SELECT jsonb_array_elements_text(v->'fieldKeys')),v->>'inputSource',(v->>'transcriptionVersionId')::uuid,
        (v->>'observationId')::uuid,(v->>'attempt')::integer,v->'arguments',v->>'outcome',v->'result',
        (v->>'evidenceId')::uuid,(v->>'startedAt')::timestamptz,(v->>'completedAt')::timestamptz,statement_timestamp()
      FROM admissible l CROSS JOIN LATERAL jsonb_array_elements(c->'delta'->'tool_calls') v
      WHERE (SELECT count(*) FROM evidence)=jsonb_array_length(c->'delta'->'evidence') RETURNING id
    ), candidates AS (
      INSERT INTO public.field_candidate(organization_id,collection_id,id,run_id,field_key,state,literal_value,parsed_value,
        normalized_value,authority_id,derivation,input_source,source_transcription_id,source_observation_id,created_at)
      SELECT $1,$2,(v->>'id')::uuid,canonical_run_id,v->>'fieldKey',v->>'state',v->>'literalValue',v->'parsedValue',
        v->'normalizedValue',v->>'authorityId',v->>'derivation',v->>'inputSource',(v->>'sourceTranscriptionId')::uuid,
        (v->>'sourceObservationId')::uuid,statement_timestamp()
      FROM admissible l CROSS JOIN LATERAL jsonb_array_elements(c->'delta'->'candidates') v
      WHERE v->>'fieldKey'=c->>'changed_field'
        AND (v->>'sourceObservationId' IS NULL OR EXISTS (SELECT 1 FROM public.model_observation m
          WHERE m.organization_id=$1 AND m.collection_id=$2 AND m.id=(v->>'sourceObservationId')::uuid AND m.run_id=canonical_run_id AND m.independent))
        AND (v->>'sourceTranscriptionId' IS NULL OR EXISTS (SELECT 1 FROM public.transcription_version t
          WHERE t.organization_id=$1 AND t.collection_id=$2 AND t.id=(v->>'sourceTranscriptionId')::uuid AND t.run_id=canonical_run_id))
        AND (SELECT count(*) FROM calls)=jsonb_array_length(c->'delta'->'tool_calls')
      RETURNING id,run_id,field_key,authority_id
    ), links AS (
      INSERT INTO public.candidate_evidence(organization_id,collection_id,id,candidate_id,evidence_id,relation,created_at)
      SELECT $1,$2,(v->>'id')::uuid,(v->>'candidateId')::uuid,(v->>'evidenceId')::uuid,v->>'relation',statement_timestamp()
      FROM admissible l CROSS JOIN LATERAL jsonb_array_elements(c->'delta'->'links') v
      JOIN candidates candidate ON candidate.id=(v->>'candidateId')::uuid
      JOIN (SELECT id,run_id,outcome,source,locator FROM evidence UNION ALL
        SELECT e.id,e.run_id,e.outcome,e.source,e.locator FROM public.evidence_item e WHERE e.organization_id=$1 AND e.collection_id=$2) e
        ON e.id=(v->>'evidenceId')::uuid AND e.run_id=canonical_run_id AND e.outcome IN ('success','recorded')
      WHERE v->>'relation' IN ('decides','supports','contradicts')
        AND (e.source<>'google-maps-geocoding' OR (v->>'relation'<>'decides'
          AND (candidate.authority_id IS NULL OR e.locator='place/'||candidate.authority_id))) RETURNING id
    ), record AS (
      INSERT INTO public.record_version(organization_id,collection_id,id,run_id,predecessor_id,disposition,policy_version,reason_codes,summary,created_at)
      SELECT $1,$2,(c->'record'->>'id')::uuid,canonical_run_id,current_record_version_id,c->'record'->>'disposition',
        c->'record'->>'policyVersion',ARRAY(SELECT jsonb_array_elements_text(c->'record'->'reasonCodes')),
        c->'record'->>'summary',statement_timestamp()
      FROM admissible WHERE (SELECT count(*) FROM candidates)=jsonb_array_length(c->'delta'->'candidates')
        AND (SELECT count(*) FROM links)=jsonb_array_length(c->'delta'->'links') RETURNING id
    ), fields AS (
      INSERT INTO public.resolved_field(organization_id,collection_id,id,record_version_id,candidate_id,field_key,state,field_group,created_at)
      SELECT $1,$2,(v->>'id')::uuid,(c->'record'->>'id')::uuid,
        CASE WHEN f.field_key<>c->>'changed_field' THEN f.candidate_id ELSE (v->>'candidateId')::uuid END,
        f.field_key,CASE WHEN f.field_key<>c->>'changed_field' THEN f.state ELSE v->>'state' END,
        CASE WHEN f.field_key<>c->>'changed_field' THEN f.field_group ELSE v->>'fieldGroup' END,statement_timestamp()
      FROM admissible l JOIN prior_fields f ON true
      JOIN LATERAL jsonb_array_elements(c->'fields') v ON v->>'fieldKey'=f.field_key
      WHERE (SELECT count(*) FROM record)=1 RETURNING id,field_key
    ), findings AS (
      INSERT INTO public.validation_finding(organization_id,collection_id,id,record_version_id,rule_id,rule_version,severity,outcome,field_key,reason_code,evidence_ids,created_at)
      SELECT $1,$2,(v->>'id')::uuid,(c->'record'->>'id')::uuid,v->>'ruleId',v->>'ruleVersion',v->>'severity',v->>'outcome',
        v->>'fieldKey',v->>'reasonCode',CASE WHEN v->'evidenceIds'='null'::jsonb THEN NULL ELSE
        ARRAY(SELECT jsonb_array_elements_text(v->'evidenceIds'))::uuid[] END,statement_timestamp()
      FROM admissible l CROSS JOIN LATERAL jsonb_array_elements(c->'delta'->'findings') v
      WHERE (SELECT count(*) FROM fields)=20 RETURNING id
    ), value_lineages AS (
      INSERT INTO public.canonical_value_lineage_v2(organization_id,collection_id,id,contract_version,specimen_id,run_id,candidate_id,record_version_id,predecessor_id,prior_revision,result_revision,prior_native_snapshot_digest,prior_graph_snapshot_digest,prior_active_graph_digest,field_key,research_field_key,layer,resolution_digest,typed_checkpoint_digest,native_checkpoint_id,native_checkpoint_digest,original_request_digest,original_scope,derivation,derivation_digest,scientific_source_digest,precision,century_rule,reading_sources,literal_grounding,selected_observation_id,selected_transcription_id,settled_observation_ids,evidence_ids,evidence_relations,consumed_dependencies,created_at)
