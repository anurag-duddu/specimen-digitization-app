# Default-sensitive legacy records remain protected. False is explicit on new
# metadata only; promotion requires privilege, and downgrade is never allowed.
query GetDocumentV2($organizationId: UUID!, $collectionId: UUID!, $actorUid: String!, $kind: String!, $id: UUID!) @auth(level: NO_ACCESS) {
  organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
  collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active") { active canViewSensitive }
  auxiliaryDocument(key: {organizationId: $organizationId, collectionId: $collectionId, kind: $kind, id: $id}) @check(expr: "this == null || ((!this.sensitive || response.collectionMember.canViewSensitive) && (!(vars.kind in ['worker_cursor', 'pilot_launch']) || this.createdBy == vars.actorUid))") { id kind revision sensitive payload createdBy }
}
query GetDocumentVersionV2($organizationId: UUID!, $collectionId: UUID!, $actorUid: String!, $kind: String!, $id: UUID!, $revision: Int!) @auth(level: NO_ACCESS) {
  organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
  collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active") { active canViewSensitive }
  auxiliaryVersion(key: {organizationId: $organizationId, collectionId: $collectionId, kind: $kind, documentId: $id, revision: $revision}) { revision payload document @check(optional: true, expr: "(!this.sensitive || response.collectionMember.canViewSensitive) && (!(vars.kind in ['worker_cursor', 'pilot_launch']) || this.createdBy == vars.actorUid)") { createdBy sensitive } }
}
query GetDocumentReceiptV2($organizationId: UUID!, $collectionId: UUID!, $actorUid: String!, $operation: String!, $idempotencyKey: String!) @auth(level: NO_ACCESS) {
  organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
  collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active") { active canViewSensitive }
  auxiliaryReceipt(key: {organizationId: $organizationId, collectionId: $collectionId, actorUid: $actorUid, operation: $operation, idempotencyKey: $idempotencyKey}) { kind documentId revision requestSha256 document @check(optional: true, expr: "(!this.sensitive || response.collectionMember.canViewSensitive) && (!(this.kind in ['worker_cursor', 'pilot_launch']) || this.createdBy == vars.actorUid)") { kind createdBy sensitive } }
}
mutation CreateDocumentV2($organizationId: UUID!, $collectionId: UUID!, $actorUid: String!, $kind: String!, $id: UUID!, $sensitive: Boolean!, $payload: Any!, $operation: String!, $idempotencyKey: String!, $requestSha256: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && (!vars.sensitive || this.canViewSensitive) && vars.kind in ['upload', 'batch', 'worker_cursor', 'pilot_launch'] && (('sensitive' in vars.payload) ? vars.payload.sensitive == vars.sensitive : vars.sensitive)") { active role canViewSensitive }
  }
  auxiliaryDocument_insert(data: {organizationId: $organizationId, collectionId: $collectionId, kind: $kind, id: $id, revision: 1, sensitive: $sensitive, payload: $payload, createdBy: $actorUid})
  auxiliaryVersion_insert(data: {organizationId: $organizationId, collectionId: $collectionId, kind: $kind, documentId: $id, revision: 1, payload: $payload})
  auxiliaryReceipt_insert(data: {organizationId: $organizationId, collectionId: $collectionId, kind: $kind, documentId: $id, revision: 1, actorUid: $actorUid, operation: $operation, idempotencyKey: $idempotencyKey, requestSha256: $requestSha256})
}
mutation SaveDocumentV2($organizationId: UUID!, $collectionId: UUID!, $actorUid: String!, $kind: String!, $id: UUID!, $sensitive: Boolean!, $payload: Any!, $operation: String!, $idempotencyKey: String!, $requestSha256: String!, $expectedRevision: Int!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && (!vars.sensitive || this.canViewSensitive) && vars.kind in ['upload', 'batch', 'worker_cursor', 'pilot_launch'] && (('sensitive' in vars.payload) ? vars.payload.sensitive == vars.sensitive : vars.sensitive)") { active role canViewSensitive }
  }
  current: query @redact {
    auxiliaryDocument(key: {organizationId: $organizationId, collectionId: $collectionId, kind: $kind, id: $id}) @check(expr: "this.revision == vars.expectedRevision && (!this.sensitive || response.query.collectionMember.canViewSensitive) && (!this.sensitive || vars.sensitive) && (!(vars.kind in ['worker_cursor', 'pilot_launch']) || this.createdBy == vars.actorUid)") { revision sensitive createdBy }
  }
  auxiliaryDocument_updateMany(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, kind: {eq: $kind}, id: {eq: $id}, revision: {eq: $expectedRevision}}, data: {revision_expr: "vars.expectedRevision + 1", sensitive: $sensitive, payload: $payload, updatedAt_expr: "request.time"}) @check(expr: "this == 1", message: "revision conflict")
  auxiliaryVersion_insert(data: {organizationId: $organizationId, collectionId: $collectionId, kind: $kind, documentId: $id, revision_expr: "vars.expectedRevision + 1", payload: $payload})
  auxiliaryReceipt_insert(data: {organizationId: $organizationId, collectionId: $collectionId, kind: $kind, documentId: $id, revision_expr: "vars.expectedRevision + 1", actorUid: $actorUid, operation: $operation, idempotencyKey: $idempotencyKey, requestSha256: $requestSha256})
}
query ListDocumentsV2($organizationId: UUID!, $collectionId: UUID!, $actorUid: String!, $kind: String!, $includeSensitive: Boolean!, $limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
  collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && (!vars.includeSensitive || this.canViewSensitive) && vars.limit > 0 && vars.limit <= 100 && vars.offset >= 0 && vars.kind in ['upload', 'batch']") { active canViewSensitive }
  auxiliaryDocuments(where: {_and: [{organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, kind: {eq: $kind}}, {_or: [{sensitive: {eq: false}}, {sensitive: {eq: $includeSensitive}}]}]}, orderBy: [{createdAt: DESC}, {id: ASC}], limit: $limit, offset: $offset) { id kind revision sensitive payload createdBy }
}
query ListDocumentPageV2($organizationId: UUID!, $collectionId: UUID!, $actorUid: String!, $kind: String!, $includeSensitive: Boolean!, $cutoff: Timestamp!, $afterId: String!, $limit: Int!) @auth(level: NO_ACCESS) {
  organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
  collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && (!vars.includeSensitive || this.canViewSensitive) && vars.limit > 0 && vars.limit <= 100 && (vars.afterId == '' || vars.afterId.matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')) && vars.cutoff <= request.time && vars.kind in ['upload', 'batch']") { active canViewSensitive }
  auxiliaryDocuments: documentListings(where: {_and: [{organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, kind: {eq: $kind}, createdAt: {le: $cutoff}, id: {gt: $afterId}}, {_or: [{sensitive: {eq: false}}, {sensitive: {eq: $includeSensitive}}]}]}, orderBy: {id: ASC}, limit: $limit) { id kind revision sensitive createdBy createdAt updatedAt }
}
