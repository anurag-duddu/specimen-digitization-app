# Human review decisions come only from reviewers, as the API's decision route requires.
mutation AppendReviewDecisionV1($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $specimenId: UUID!, $baseRevision: Int!, $resultingRevision: Int!, $reason: String!, $correction: Any!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['reviewer', 'manager', 'admin'] && vars.resultingRevision > vars.baseRevision") { active role canViewSensitive }
  }
  scope: query @redact {
    specimen(key: {organizationId: $organizationId, collectionId: $collectionId, id: $specimenId}) @check(expr: "this != null && (!this.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { sensitive }
  }
  reviewDecision_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, specimenId: $specimenId, actorUid: $actorUid, baseRevision: $baseRevision, resultingRevision: $resultingRevision, reason: $reason, correction: $correction})
}
