  }
  profileVersion_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, profileKey: $profileKey, version: $version, configObject: $configObject, configSha256: $configSha256, approvedBy: $approvedBy})
}
mutation AppendPipelineRunV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $specimenId: UUID!, $profileVersionId: UUID!, $supersedesRunId: UUID, $pinnedVersions: Any!, $inputSha256: String!, $traceId: String, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && (vars.traceId == null || (vars.traceId.matches('^[0-9a-f]{32}$') && !vars.traceId.matches('^0+$')))") { active role canViewSensitive }
  }
  scope: query @redact {
    specimen(key: {organizationId: $organizationId, collectionId: $collectionId, id: $specimenId}) @check(expr: "this != null && (!this.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { sensitive }
  }
  pipelineRun_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, specimenId: $specimenId, profileVersionId: $profileVersionId, supersedesRunId: $supersedesRunId, pinnedVersions: $pinnedVersions, inputSha256: $inputSha256, traceId: $traceId})
}
# The run row can exist before its trace starts; the trace id is set once, and repeating it is a no-op.
mutation RecordRunTraceV1($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $traceId: String!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && vars.traceId.matches('^[0-9a-f]{32}$') && !vars.traceId.matches('^0+$')") { active role canViewSensitive }
  }
  current: query @redact {
    pipelineRun(key: {organizationId: $organizationId, collectionId: $collectionId, id: $id}) @check(expr: "this != null && (!this.specimen.sensitive || response.query.collectionMember.canViewSensitive) && (this.traceId == null || this.traceId == vars.traceId)", message: "run not found, access denied or trace already recorded") { traceId specimen { sensitive } }
  }
  pipelineRun_update(key: {organizationId: $organizationId, collectionId: $collectionId, id: $id}, data: {traceId: $traceId})
}
