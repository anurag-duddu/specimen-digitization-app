# Projection writes for the go-live data contract (docs/execution/golive/DATA_CONTRACT.md).
# One row per operation; every write is an insert except RecordRunTraceV1's set-once update.
# Authorization matches SaveSpecimenV3 for the same data: an active member with a writing role,
# and the anchor's specimen is not sensitive or the member can view sensitive records. The
# anchor (the row's run, candidate, record version or specimen) is read from the database, and
# every parent a row names must belong to the anchor's run, or to its specimen for assets.
mutation AppendSourceAssetV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $specimenId: UUID!, $kind: String!, $parentAssetId: UUID, $bucket: String!, $objectName: String!, $generation: String!, $sha256: String!, $mimeType: String!, $byteSize: Int64!, $width: Int, $height: Int, $acquisitionMethod: String!, $uploaderUid: String!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && vars.sha256.matches('^[a-f0-9]{64}$') && vars.kind in ['original', 'crop', 'mask', 'raw_response', 'lookup_response', 'evidence_record'] && (!(vars.kind in ['original', 'crop', 'mask']) || (vars.width != null && vars.height != null && vars.width > 0 && vars.height > 0))") { active role canViewSensitive }
  }
  scope: query @redact {
    specimen(key: {organizationId: $organizationId, collectionId: $collectionId, id: $specimenId}) @check(expr: "this != null && (!this.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { id sensitive }
  }
  parents: query @redact {
    parentAssets: sourceAssets(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $parentAssetId}}, limit: 2) @check(expr: "vars.parentAssetId == null || (this.size() == 1 && this[0].specimenId == response.scope.specimen.id)", message: "parent asset of another specimen") { specimenId }
    originals: specimens(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $specimenId}, sourceChecksum: {eq: $sha256}}, limit: 1) @check(expr: "vars.kind != 'original' || this.size() == 1", message: "original of another image") { id }
  }
  sourceAsset_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, specimenId: $specimenId, kind: $kind, parentAssetId: $parentAssetId, bucket: $bucket, objectName: $objectName, generation: $generation, sha256: $sha256, mimeType: $mimeType, byteSize: $byteSize, width: $width, height: $height, acquisitionMethod: $acquisitionMethod, uploaderUid: $uploaderUid})
}
# The worker writes the profile snapshot each run used, with no approval claim. An approval
# claim needs main's rule for it: a reviewer or above with sensitive access. No client-facing
# API path passes user input into approvedBy.
mutation AppendProfileVersionV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $profileKey: String!, $version: String!, $configObject: String!, $configSha256: String!, $approvedBy: String, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && vars.configSha256.matches('^[a-f0-9]{64}$') && (vars.approvedBy == null || (this.role in ['reviewer', 'manager', 'admin'] && this.canViewSensitive))") { active role canViewSensitive }
  }
  profileVersion_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, profileKey: $profileKey, version: $version, configObject: $configObject, configSha256: $configSha256, approvedBy: $approvedBy})
}
mutation AppendPipelineRunV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $specimenId: UUID!, $profileVersionId: UUID!, $supersedesRunId: UUID, $pinnedVersions: Any!, $inputSha256: String!, $traceId: String, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && (vars.traceId == null || (vars.traceId.matches('^[0-9a-f]{32}$') && !vars.traceId.matches('^0+$')))") { active role canViewSensitive }
  }
  scope: query @redact {
    specimen(key: {organizationId: $organizationId, collectionId: $collectionId, id: $specimenId}) @check(expr: "this != null && (!this.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { id sensitive }
  }
  parents: query @redact {
    supersededRuns: pipelineRuns(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $supersedesRunId}}, limit: 2) @check(expr: "vars.supersedesRunId == null || (this.size() == 1 && this[0].specimenId == response.scope.specimen.id)", message: "superseded run of another specimen") { specimenId }
  }
  pipelineRun_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, specimenId: $specimenId, profileVersionId: $profileVersionId, supersedesRunId: $supersedesRunId, pinnedVersions: $pinnedVersions, inputSha256: $inputSha256, traceId: $traceId})
}
# The run row can exist before its trace starts. The update applies only while the trace is
# unset or already this one, so of two concurrent ids exactly one is recorded.
mutation RecordRunTraceV1($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $traceId: String!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && vars.traceId.matches('^[0-9a-f]{32}$') && !vars.traceId.matches('^0+$')") { active role canViewSensitive }
  }
  scope: query @redact {
    pipelineRun(key: {organizationId: $organizationId, collectionId: $collectionId, id: $id}) @check(expr: "this != null && (!this.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "run not found or access denied") { specimen { sensitive } }
  }
  pipelineRun_updateMany(where: {_and: [{organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $id}}, {_or: [{traceId: {isNull: true}}, {traceId: {eq: $traceId}}]}]}, data: {traceId: $traceId}) @check(expr: "this == 1", message: "trace already recorded")
}
# A region row belongs to one run; the domain's region id repeats across runs and is kept as
# domainRegionId. A correction in a new run supersedes the run, not the region.
mutation AppendLabelRegionV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $runId: UUID!, $domainRegionId: String!, $sourceAssetId: UUID!, $cropAssetId: UUID, $geometry: Any!, $ordinal: Int!, $regionType: String!, $segmentationVersion: String!, $supersedesRegionId: UUID, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin']") { active role canViewSensitive }
  }
  scope: query @redact {
    pipelineRun(key: {organizationId: $organizationId, collectionId: $collectionId, id: $runId}) @check(expr: "this != null && (!this.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { specimenId specimen { sensitive } }
  }
  parents: query @redact {
    sourceAsset(key: {organizationId: $organizationId, collectionId: $collectionId, id: $sourceAssetId}) @check(expr: "this != null && this.specimenId == response.scope.pipelineRun.specimenId", message: "source asset of another specimen") { specimenId }
    cropAssets: sourceAssets(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $cropAssetId}}, limit: 2) @check(expr: "vars.cropAssetId == null || (this.size() == 1 && this[0].specimenId == response.scope.pipelineRun.specimenId)", message: "crop asset of another specimen") { specimenId }
    supersededRegions: labelRegions(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $supersedesRegionId}, runId: {eq: $runId}}, limit: 2) @check(expr: "vars.supersedesRegionId == null || this.size() == 1", message: "superseded region of another run") { id }
  }
  labelRegion_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, runId: $runId, domainRegionId: $domainRegionId, sourceAssetId: $sourceAssetId, cropAssetId: $cropAssetId, geometry: $geometry, ordinal: $ordinal, regionType: $regionType, segmentationVersion: $segmentationVersion, supersedesRegionId: $supersedesRegionId})
}
# Readings (independent) and the first pass's model call (not independent) share this table.
mutation AppendModelObservationV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $runId: UUID!, $regionId: UUID!, $rawAssetId: UUID!, $stepKey: String!, $provider: String!, $modelVersion: String!, $promptVersion: String!, $inputSha256: String!, $parameters: Any!, $literalText: String!, $outcome: String!, $independent: Boolean!, $routeId: String, $unreadableSpans: [String!], $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin']") { active role canViewSensitive }
  }
  scope: query @redact {
    pipelineRun(key: {organizationId: $organizationId, collectionId: $collectionId, id: $runId}) @check(expr: "this != null && (!this.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { specimenId specimen { sensitive } }
  }
  parents: query @redact {
    regions: labelRegions(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $regionId}, runId: {eq: $runId}}, limit: 1) @check(expr: "this.size() == 1", message: "region of another run") { id }
    sourceAsset(key: {organizationId: $organizationId, collectionId: $collectionId, id: $rawAssetId}) @check(expr: "this != null && this.specimenId == response.scope.pipelineRun.specimenId", message: "raw asset of another specimen") { specimenId }
  }
  modelObservation_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, runId: $runId, regionId: $regionId, rawAssetId: $rawAssetId, stepKey: $stepKey, provider: $provider, modelVersion: $modelVersion, promptVersion: $promptVersion, inputSha256: $inputSha256, parameters: $parameters, literalText: $literalText, outcome: $outcome, independent: $independent, routeId: $routeId, unreadableSpans: $unreadableSpans})
}
# Both readings are independent readings of the row's region, in the fixed order: the left id
# sorts first. A UUID variable is lowercase hex without dashes inside a @check, so the order
# does not depend on how the caller wrote it, and the unique constraint refuses a duplicate.
mutation AppendReadingComparisonV1($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $runId: UUID!, $regionId: UUID!, $leftObservationId: UUID!, $rightObservationId: UUID!, $algorithm: String!, $ratio: Float, $editDistance: Int, $lengthBasis: Int, $status: String!, $reasons: [String!]!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && vars.leftObservationId < vars.rightObservationId && (vars.ratio == null || (vars.ratio >= 0.0 && vars.ratio <= 1.0)) && (vars.editDistance == null || vars.editDistance >= 0) && (vars.lengthBasis == null || vars.lengthBasis >= 1)") { active role canViewSensitive }
  }
  scope: query @redact {
    pipelineRun(key: {organizationId: $organizationId, collectionId: $collectionId, id: $runId}) @check(expr: "this != null && (!this.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { specimen { sensitive } }
  }
  parents: query @redact {
    regions: labelRegions(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $regionId}, runId: {eq: $runId}}, limit: 1) @check(expr: "this.size() == 1", message: "region of another run") { id }
    left: modelObservations(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $leftObservationId}, runId: {eq: $runId}, regionId: {eq: $regionId}, independent: {eq: true}}, limit: 1) @check(expr: "this.size() == 1", message: "left reading not of this region") { id }
    right: modelObservations(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $rightObservationId}, runId: {eq: $runId}, regionId: {eq: $regionId}, independent: {eq: true}}, limit: 1) @check(expr: "this.size() == 1", message: "right reading not of this region") { id }
  }
  readingComparison_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, runId: $runId, regionId: $regionId, leftObservationId: $leftObservationId, rightObservationId: $rightObservationId, algorithm: $algorithm, ratio: $ratio, editDistance: $editDistance, lengthBasis: $lengthBasis, status: $status, reasons: $reasons})
}
# A decision other than a reviewer's is unresolved exactly when it selects no reading (G19).
# Only a first-pass decision names a model call, and it must. A reviewer's decision needs a
# reviewer or above, as the API's decision route does. Every reading named is of the row's region.
mutation AppendTranscriptionVersionV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $runId: UUID!, $literalText: String!, $spans: Any!, $alternatives: Any!, $unresolved: Boolean!, $regionId: UUID!, $decisionKind: String!, $selectedObservationId: UUID, $firstPassObservationId: UUID, $rationale: String, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && vars.decisionKind in ['identical_readings', 'first_pass', 'human'] && ((vars.decisionKind == 'first_pass') == (vars.firstPassObservationId != null)) && (vars.decisionKind == 'human' || vars.unresolved == (vars.selectedObservationId == null)) && (vars.decisionKind != 'human' || this.role in ['reviewer', 'manager', 'admin'])") { active role canViewSensitive }
  }
  scope: query @redact {
    pipelineRun(key: {organizationId: $organizationId, collectionId: $collectionId, id: $runId}) @check(expr: "this != null && (!this.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { specimen { sensitive } }
  }
  parents: query @redact {
    regions: labelRegions(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $regionId}, runId: {eq: $runId}}, limit: 1) @check(expr: "this.size() == 1", message: "region of another run") { id }
    selected: modelObservations(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $selectedObservationId}, runId: {eq: $runId}, regionId: {eq: $regionId}, independent: {eq: true}}, limit: 2) @check(expr: "vars.selectedObservationId == null || this.size() == 1", message: "selected reading not of this region") { id }
    firstPass: modelObservations(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $firstPassObservationId}, runId: {eq: $runId}, regionId: {eq: $regionId}, independent: {eq: false}}, limit: 2) @check(expr: "vars.firstPassObservationId == null || this.size() == 1", message: "first-pass call not of this region") { id }
  }
  transcriptionVersion_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, runId: $runId, literalText: $literalText, spans: $spans, alternatives: $alternatives, unresolved: $unresolved, regionId: $regionId, decisionKind: $decisionKind, selectedObservationId: $selectedObservationId, firstPassObservationId: $firstPassObservationId, rationale: $rationale})
}
# A handoff joins a decision and one of its region's readings, in the row's run. A decided
# transcript is the decision's selected reading; raw readings are handed only without one (G19).
mutation AppendHarnessInputV1($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $runId: UUID!, $transcriptionVersionId: UUID!, $observationId: UUID!, $role: String!, $handedText: String!, $note: String, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && vars.role in ['decided_transcript', 'raw_reading']") { active role canViewSensitive }
  }
  scope: query @redact {
    pipelineRun(key: {organizationId: $organizationId, collectionId: $collectionId, id: $runId}) @check(expr: "this != null && (!this.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { specimen { sensitive } }
  }
  parents: query @redact {
    decisions: transcriptionVersions(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $transcriptionVersionId}, runId: {eq: $runId}}, limit: 1) @check(expr: "this.size() == 1", message: "decision of another run") { regionId }
    picked: transcriptionVersions(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $transcriptionVersionId}, runId: {eq: $runId}, selectedObservationId: {eq: $observationId}}, limit: 1) @check(expr: "vars.role != 'decided_transcript' || this.size() == 1", message: "a decided transcript is the selected reading") { id }
    unpicked: transcriptionVersions(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $transcriptionVersionId}, runId: {eq: $runId}, selectedObservationId: {isNull: true}}, limit: 1) @check(expr: "vars.role != 'raw_reading' || this.size() == 1", message: "raw readings are handed only without a selection") { id }
  }
  readings: query @redact {
    readings: modelObservations(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $observationId}, runId: {eq: $runId}, independent: {eq: true}}, limit: 1) @check(expr: "this.size() == 1 && this[0].regionId == response.parents.decisions[0].regionId", message: "reading not of the decision's region") { regionId }
  }
  harnessInput_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, runId: $runId, transcriptionVersionId: $transcriptionVersionId, observationId: $observationId, role: $role, handedText: $handedText, note: $note})
}
# G26: a source naming Google is exactly google-maps-geocoding, its locator is place/{place id}
# exactly for a single match, and its stored record is an evidence record, never the response.
mutation AppendEvidenceItemV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $runId: UUID!, $source: String!, $sourceVersion: String!, $adapterVersion: String!, $query: Any!, $outcome: String!, $locator: String, $responseSha256: String!, $capturedAt: Timestamp!, $rawAssetId: UUID!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && vars.outcome in ['success', 'no_match', 'ambiguous', 'empty_response', 'rate_limited', 'timeout', 'authentication_error', 'authorization_error', 'provider_error', 'malformed_response', 'policy_blocked', 'recorded'] && (!vars.source.matches('(?i)google') || vars.source == 'google-maps-geocoding') && (vars.source != 'google-maps-geocoding' || (vars.outcome == 'success' ? (vars.locator != null && vars.locator.matches('^place/[A-Za-z0-9_-]+$')) : vars.locator == null))") { active role canViewSensitive }
  }
  scope: query @redact {
    pipelineRun(key: {organizationId: $organizationId, collectionId: $collectionId, id: $runId}) @check(expr: "this != null && (!this.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { specimenId specimen { sensitive } }
  }
  parents: query @redact {
    sourceAsset(key: {organizationId: $organizationId, collectionId: $collectionId, id: $rawAssetId}) @check(expr: "this != null && this.specimenId == response.scope.pipelineRun.specimenId", message: "raw asset of another specimen") { specimenId }
    record: sourceAsset(key: {organizationId: $organizationId, collectionId: $collectionId, id: $rawAssetId}) @check(expr: "vars.source != 'google-maps-geocoding' || this.kind == 'evidence_record'", message: "Google evidence is an evidence record") { kind }
  }
  evidenceItem_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, runId: $runId, source: $source, sourceVersion: $sourceVersion, adapterVersion: $adapterVersion, query: $query, outcome: $outcome, locator: $locator, responseSha256: $responseSha256, capturedAt: $capturedAt, rawAssetId: $rawAssetId})
}
# A call on the decided transcript names no reading, and a call on a raw reading names no
# decision; whatever it names is in the row's run.
mutation AppendToolCallV1($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $runId: UUID!, $callKey: String!, $phase: String!, $tool: String!, $toolVersion: String!, $source: String, $fieldKeys: [String!]!, $inputSource: String!, $transcriptionVersionId: UUID, $observationId: UUID, $attempt: Int!, $arguments: Any!, $outcome: String!, $result: Any, $evidenceId: UUID, $startedAt: Timestamp, $completedAt: Timestamp, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && vars.phase in ['parse', 'plan', 'lookup', 'resolve', 'normalize', 'validate', 'finalize'] && vars.inputSource in ['decided_transcript', 'raw_reading'] && (vars.inputSource == 'decided_transcript' ? vars.observationId == null : vars.transcriptionVersionId == null) && vars.attempt >= 1 && vars.outcome in ['success', 'no_match', 'ambiguous', 'empty_response', 'rate_limited', 'timeout', 'authentication_error', 'authorization_error', 'provider_error', 'malformed_response', 'policy_blocked']") { active role canViewSensitive }
  }
  scope: query @redact {
    pipelineRun(key: {organizationId: $organizationId, collectionId: $collectionId, id: $runId}) @check(expr: "this != null && (!this.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { specimen { sensitive } }
  }
  parents: query @redact {
    decisions: transcriptionVersions(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $transcriptionVersionId}, runId: {eq: $runId}}, limit: 2) @check(expr: "vars.transcriptionVersionId == null || this.size() == 1", message: "decision of another run") { id }
    readings: modelObservations(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $observationId}, runId: {eq: $runId}, independent: {eq: true}}, limit: 2) @check(expr: "vars.observationId == null || this.size() == 1", message: "reading of another run") { id }
    evidence: evidenceItems(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $evidenceId}, runId: {eq: $runId}}, limit: 2) @check(expr: "vars.evidenceId == null || this.size() == 1", message: "evidence of another run") { id }
  }
  toolCall_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, runId: $runId, callKey: $callKey, phase: $phase, tool: $tool, toolVersion: $toolVersion, source: $source, fieldKeys: $fieldKeys, inputSource: $inputSource, transcriptionVersionId: $transcriptionVersionId, observationId: $observationId, attempt: $attempt, arguments: $arguments, outcome: $outcome, result: $result, evidenceId: $evidenceId, startedAt: $startedAt, completedAt: $completedAt})
}
mutation AppendFieldCandidateV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $runId: UUID!, $fieldKey: String!, $state: String!, $literalValue: String, $parsedValue: Any, $normalizedValue: Any, $authorityId: String, $derivation: String!, $inputSource: String, $sourceTranscriptionId: UUID, $sourceObservationId: UUID, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && (vars.inputSource == null || vars.inputSource in ['decided_transcript', 'raw_reading']) && (vars.inputSource != 'decided_transcript' || vars.sourceObservationId == null) && (vars.inputSource != 'raw_reading' || vars.sourceTranscriptionId == null)") { active role canViewSensitive }
  }
  scope: query @redact {
    pipelineRun(key: {organizationId: $organizationId, collectionId: $collectionId, id: $runId}) @check(expr: "this != null && (!this.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { specimen { sensitive } }
  }
  parents: query @redact {
    decisions: transcriptionVersions(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $sourceTranscriptionId}, runId: {eq: $runId}}, limit: 2) @check(expr: "vars.sourceTranscriptionId == null || this.size() == 1", message: "decision of another run") { id }
    readings: modelObservations(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $sourceObservationId}, runId: {eq: $runId}, independent: {eq: true}}, limit: 2) @check(expr: "vars.sourceObservationId == null || this.size() == 1", message: "reading of another run") { id }
  }
  fieldCandidate_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, runId: $runId, fieldKey: $fieldKey, state: $state, literalValue: $literalValue, parsedValue: $parsedValue, normalizedValue: $normalizedValue, authorityId: $authorityId, derivation: $derivation, inputSource: $inputSource, sourceTranscriptionId: $sourceTranscriptionId, sourceObservationId: $sourceObservationId})
}
# G23: the source that decides a value, one that supports it, or one that contradicts it. Only
# evidence of a successful call, or recorded evidence that is not a lookup, is linked. Google
# never decides, and the candidate's authority id is at most the place id in its locator (G26).
mutation AppendCandidateEvidenceV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $candidateId: UUID!, $evidenceId: UUID!, $relation: String!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && vars.relation in ['decides', 'supports', 'contradicts']") { active role canViewSensitive }
  }
  scope: query @redact {
    fieldCandidate(key: {organizationId: $organizationId, collectionId: $collectionId, id: $candidateId}) @check(expr: "this != null && (!this.run.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { runId authorityId run { specimen { sensitive } } }
  }
  parents: query @redact {
    evidenceItem(key: {organizationId: $organizationId, collectionId: $collectionId, id: $evidenceId}) @check(expr: "this != null && this.runId == response.scope.fieldCandidate.runId", message: "evidence of another run") { runId }
    linked: evidenceItem(key: {organizationId: $organizationId, collectionId: $collectionId, id: $evidenceId}) @check(expr: "this.outcome in ['success', 'recorded']", message: "only successful or recorded evidence is linked") { outcome }
    google: evidenceItem(key: {organizationId: $organizationId, collectionId: $collectionId, id: $evidenceId}) @check(expr: "this.source != 'google-maps-geocoding' || (vars.relation != 'decides' && (response.scope.fieldCandidate.authorityId == null || this.locator == 'place/' + response.scope.fieldCandidate.authorityId))", message: "Google supports a place id only") { source locator }
  }
  candidateEvidence_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, candidateId: $candidateId, evidenceId: $evidenceId, relation: $relation})
}
mutation AppendRecordVersionV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $runId: UUID!, $predecessorId: UUID, $disposition: String, $policyVersion: String!, $reasonCodes: [String!]!, $summary: String!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && (vars.disposition == null || vars.disposition in ['cleared', 'needs_human_review', 'deferred'])") { active role canViewSensitive }
  }
  scope: query @redact {
    pipelineRun(key: {organizationId: $organizationId, collectionId: $collectionId, id: $runId}) @check(expr: "this != null && (!this.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { specimen { sensitive } }
  }
  parents: query @redact {
    predecessors: recordVersions(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $predecessorId}, runId: {eq: $runId}}, limit: 2) @check(expr: "vars.predecessorId == null || this.size() == 1", message: "predecessor of another run") { id }
  }
  recordVersion_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, runId: $runId, predecessorId: $predecessorId, disposition: $disposition, policyVersion: $policyVersion, reasonCodes: $reasonCodes, summary: $summary})
}
mutation AppendResolvedFieldV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $recordVersionId: UUID!, $candidateId: UUID, $fieldKey: String!, $state: String!, $fieldGroup: String!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && vars.fieldGroup in ['mandatory', 'optional']") { active role canViewSensitive }
  }
  scope: query @redact {
    recordVersion(key: {organizationId: $organizationId, collectionId: $collectionId, id: $recordVersionId}) @check(expr: "this != null && (!this.run.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { runId run { specimen { sensitive } } }
  }
  parents: query @redact {
    candidates: fieldCandidates(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $candidateId}}, limit: 2) @check(expr: "vars.candidateId == null || (this.size() == 1 && this[0].runId == response.scope.recordVersion.runId && this[0].fieldKey == vars.fieldKey)", message: "candidate of another run or field") { runId fieldKey }
  }
  resolvedField_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, recordVersionId: $recordVersionId, candidateId: $candidateId, fieldKey: $fieldKey, state: $state, fieldGroup: $fieldGroup})
}
# CONTRACTS.md 190: severity hard, warning or info; a warning never routes the record to review.
mutation AppendValidationFindingV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $recordVersionId: UUID!, $runId: UUID!, $evidenceIds: [UUID!], $ruleId: String!, $ruleVersion: String!, $severity: String!, $outcome: String!, $fieldKey: String, $reasonCode: String!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin'] && vars.severity in ['hard', 'warning', 'info'] && vars.outcome in ['pass', 'fail', 'unresolved', 'not_applicable'] && (vars.evidenceIds == null || size(vars.evidenceIds) <= 64)") { active role canViewSensitive }
  }
  scope: query @redact {
    recordVersion(key: {organizationId: $organizationId, collectionId: $collectionId, id: $recordVersionId}) @check(expr: "this != null && (!this.run.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { run { specimen { sensitive } } }
  }
  parents: query @redact {
    records: recordVersions(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {eq: $recordVersionId}, runId: {eq: $runId}}, limit: 1) @check(expr: "this.size() == 1", message: "record version of another run") { id }
    evidence: evidenceItems(where: {organizationId: {eq: $organizationId}, collectionId: {eq: $collectionId}, id: {in: $evidenceIds}, runId: {eq: $runId}}, limit: 65) @check(expr: "vars.evidenceIds == null || this.size() == size(vars.evidenceIds)", message: "evidence of another run") { id }
  }
  validationFinding_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, recordVersionId: $recordVersionId, ruleId: $ruleId, ruleVersion: $ruleVersion, severity: $severity, outcome: $outcome, fieldKey: $fieldKey, reasonCode: $reasonCode, evidenceIds: $evidenceIds})
}
mutation AppendCheckpointV2($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $runId: UUID!, $stepKey: String!, $inputSha256: String!, $state: String!, $attempt: Int!, $nextRetryAt: Timestamp, $blockerCode: String, $outputReferences: Any!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['operator', 'reviewer', 'manager', 'admin']") { active role canViewSensitive }
  }
  scope: query @redact {
    pipelineRun(key: {organizationId: $organizationId, collectionId: $collectionId, id: $runId}) @check(expr: "this != null && (!this.specimen.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { specimen { sensitive } }
  }
  checkpoint_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, runId: $runId, stepKey: $stepKey, inputSha256: $inputSha256, state: $state, attempt: $attempt, nextRetryAt: $nextRetryAt, blockerCode: $blockerCode, outputReferences: $outputReferences})
}
# Human review decisions come only from reviewers, as the API's decision route requires, and
# record revisions the specimen has reached.
mutation AppendReviewDecisionV1($organizationId: UUID!, $collectionId: UUID!, $id: UUID!, $specimenId: UUID!, $baseRevision: Int!, $resultingRevision: Int!, $reason: String!, $correction: Any!, $actorUid: String!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    organizationMember(key: {organizationId: $organizationId, uid: $actorUid}) @check(expr: "this.active") { active }
    collectionMember(key: {organizationId: $organizationId, collectionId: $collectionId, uid: $actorUid}) @check(expr: "this.active && this.role in ['reviewer', 'manager', 'admin'] && vars.resultingRevision > vars.baseRevision") { active role canViewSensitive }
  }
  scope: query @redact {
    specimen(key: {organizationId: $organizationId, collectionId: $collectionId, id: $specimenId}) @check(expr: "this != null && (!this.sensitive || response.query.collectionMember.canViewSensitive)", message: "access denied") { sensitive }
  }
  parents: query @redact {
    current: specimen(key: {organizationId: $organizationId, collectionId: $collectionId, id: $specimenId}) @check(expr: "this.revision >= vars.resultingRevision", message: "revision the specimen has not reached") { revision }
  }
  reviewDecision_insert(data: {organizationId: $organizationId, collectionId: $collectionId, id: $id, specimenId: $specimenId, actorUid: $actorUid, baseRevision: $baseRevision, resultingRevision: $resultingRevision, reason: $reason, correction: $correction})
}
