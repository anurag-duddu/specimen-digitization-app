# Composite scope keys make cross-organization/collection references invalid.
# Only named server operations are exposed; no client generated SDK.
type Organization @table(key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  name: String!
}
type OrganizationMember @table(key: ["organizationId", "uid"]) {
  organizationId: UUID!
  organization: Organization!
  uid: String!
  active: Boolean!
}
type Collection @table(key: ["organizationId", "id"]) {
  organizationId: UUID!
  organization: Organization!
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  parentId: UUID
  parent: Collection @ref(constraintName: "scope_ref_1", fields: ["organizationId", "parentId"])
}
type CollectionMember @table(key: ["organizationId", "collectionId", "uid"]) {
  organizationId: UUID!
  collectionId: UUID!
  collection: Collection! @ref(constraintName: "scope_ref_2", fields: ["organizationId", "collectionId"])
  uid: String!
  active: Boolean!
  role: String!
  canViewSensitive: Boolean!
}
type Specimen @table(key: ["organizationId", "collectionId", "id"])
  @index(fields: ["organizationId", "collectionId", "updatedAt"]) {
  organizationId: UUID!
  collectionId: UUID!
  collection: Collection! @ref(constraintName: "scope_ref_3", fields: ["organizationId", "collectionId"])
  id: UUID! @default(expr: "uuidV4()")
  revision: Int!
  state: String!
  disposition: String
  activeRunId: UUID
  sensitive: Boolean!
  createdBy: String!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}
type SpecimenSnapshot @table(key: ["organizationId", "collectionId", "specimenId", "revision"]) {
  organizationId: UUID!
  collectionId: UUID!
  specimenId: UUID!
  specimen: Specimen! @ref(constraintName: "scope_ref_4", fields: ["organizationId", "collectionId", "specimenId"])
  revision: Int!
  contractVersion: String!
  snapshot: Any!
  sha256: String!
  createdAt: Timestamp! @default(expr: "request.time")
}
type RequestReceipt @table(key: ["organizationId", "collectionId", "actorUid", "operation", "idempotencyKey"]) {
  organizationId: UUID!
  collectionId: UUID!
  actorUid: String!
  operation: String!
  idempotencyKey: String!
  requestSha256: String!
  specimenId: UUID!
  specimen: Specimen! @ref(constraintName: "scope_ref_5", fields: ["organizationId", "collectionId", "specimenId"])
  revision: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

type ProfileVersion @table(key: ["organizationId", "collectionId", "id"]) {
  organizationId: UUID!
  collectionId: UUID!
  collection: Collection! @ref(constraintName: "scope_ref_6", fields: ["organizationId", "collectionId"])
  id: UUID! @default(expr: "uuidV4()")
  profileKey: String!
  version: String!
  configObject: String!
  configSha256: String!
  approvedBy: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type SourceAsset @table(key: ["organizationId", "collectionId", "id"]) @unique(indexName: "specimen_unique_1", fields: ["bucket", "objectName", "generation"]) {
  organizationId: UUID!
  collectionId: UUID!
  collection: Collection! @ref(constraintName: "scope_ref_7", fields: ["organizationId", "collectionId"])
  id: UUID! @default(expr: "uuidV4()")
  specimenId: UUID!
  specimen: Specimen! @ref(constraintName: "scope_ref_8", fields: ["organizationId", "collectionId", "specimenId"])
  kind: String!
  parentAssetId: UUID
  parentAsset: SourceAsset @ref(constraintName: "scope_ref_9", fields: ["organizationId", "collectionId", "parentAssetId"])
  bucket: String!
  objectName: String!
  generation: String!
  sha256: String!
  mimeType: String!
  byteSize: Int64!
  width: Int!
  height: Int!
  acquisitionMethod: String!
  uploaderUid: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

type PipelineRun @table(key: ["organizationId", "collectionId", "id"]) {
  organizationId: UUID!
