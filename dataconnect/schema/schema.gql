# Bounded upload-session and batch metadata; never bytes or bearer session URLs.
type AuxiliaryDocument @table(key: ["organizationId", "collectionId", "kind", "id"]) {
  organizationId: UUID!
  collectionId: UUID!
  collection: Collection! @ref(fields: ["organizationId", "collectionId"], constraintName: "aux_scope")
  kind: String!
  id: UUID!
  revision: Int!
  payload: Any!
  createdBy: String!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}
type AuxiliaryVersion @table(key: ["organizationId", "collectionId", "kind", "documentId", "revision"]) {
  organizationId: UUID!
  collectionId: UUID!
  kind: String!
  documentId: UUID!
  document: AuxiliaryDocument! @ref(fields: ["organizationId", "collectionId", "kind", "documentId"], constraintName: "aux_version_parent")
  revision: Int!
  payload: Any!
  createdAt: Timestamp! @default(expr: "request.time")
}
type AuxiliaryReceipt @table(key: ["organizationId", "collectionId", "actorUid", "operation", "idempotencyKey"]) {
  organizationId: UUID!
  collectionId: UUID!
  actorUid: String!
  operation: String!
  idempotencyKey: String!
  kind: String!
  documentId: UUID!
  document: AuxiliaryDocument! @ref(fields: ["organizationId", "collectionId", "kind", "documentId"], constraintName: "aux_receipt_parent")
  revision: Int!
  requestSha256: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

