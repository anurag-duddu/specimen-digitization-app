# The code's own notation tables (plan WP 2.2: one source of notations). Each
# stays in the module that reads it, so the old path reads what it read before,
# and tests/test_ontology.py pins each equal to its entry here: a change on
# either side fails that test until the other follows. No rendered text carries
# them; the experts' brief renders its unit and range lines from the code's
# tables (field_research/prompts/__init__.py).
tables:
  place_unit_words:
    means: >-
      the unit words of a place's name, folded, that the Google geocoding tool
      drops as whole words before it compares a result with a label's place
      ("Davao Prov." compares as "davao")
    words: [
      "prov", "province", "provincia", "estado", "state", "region", "dept", "department",
      "depto", "co", "county", "mun", "municipio", "municipality"]
    source:
      - src/specimen_digitization/application/geography_tool.py:59-66
      - src/specimen_digitization/application/geography_tool.py:112-122
  elevation_units:
    means: >-
      an elevation's units by unit, folded, periods and spaces dropped, as the
      elevation checks read them after or before a number
    units:
      m: [
        "m", "mts", "mtr", "mtrs", "metre", "metres", "meter", "meters", "metro", "metros",
        "metri", "msnm", "msm", "masl", "mamsl", "msl", "mslm", "mum", "mudm", "munn", "mnn",
        "manm", "malt", "melev"]
      ft: [
        "ft", "feet", "foot", "pies", "pie", "pes", "fuss", "fu\u00df", "pieds", "pied",
        "piedi", "piede", "voet", "ftasl", "ftamsl", "psnm", "piessnm", "ftalt", "'"]
    source:
      - src/specimen_digitization/field_research/written.py:126-152
  range_joiners:
    means: >-
      the words, by language, and the signs that join two numbers or dates
      into a range, besides a dash
    words:
      English: ["to", "till", "until", "thru", "through", "and"]
      Spanish: ["a", "al", "hasta", "hasta el", "y"]
      Portuguese: ["a", "ao", "at\u00e9", "e"]
      French: ["\u00e0", "au", "jusqu'\u00e0", "jusqu'au", "et"]
      German: ["bis", "bis zum", "und"]
      Italian: ["a", "al", "fino", "e"]
      Dutch: ["tot", "tot en met", "en", "t/m"]
      Latin: ["ad", "usque"]
    signs: ["&", "/", "~"]
    source:
      - src/specimen_digitization/field_research/written.py:104-124
  date_notations:
    means: >-
      the notations a date literal is read by, in the order they are tried,
      each by its name in the code's table and an example the notation reads
      first; a name selects how the literal is read, not always the order
      recorded on a reading: "numeric" gives readings ordered month-day-year
      and day-month-year, and "year-numeric" year-month-day and year-day-month
    notations:
      - {order: month-day-year, example: "IX-6-46"}
      - {order: month-day, example: "IX-6"}
      - {order: month-year, example: "IX.'46"}
      - {order: day-month-year, example: "6 IX 1946"}
      - {order: day-month-year, example: "6.ix.1946"}
      - {order: year-month-day, example: "1946 IX 6"}
      - {order: year-month-day, example: "1946.ix.6"}
      - {order: year-month, example: "1946.IX"}
      - {order: day-month, example: "6 IX"}
      - {order: day-month, example: "6.ix"}
      - {order: numeric, example: "4-5-48"}
      - {order: year-numeric, example: "1946-04-05"}
      - {order: day-monthname-year, example: "6 Sept. 1946"}
      - {order: monthname-day-year, example: "Sept. 6, 1946"}
      - {order: monthname-year, example: "Sept. 1946"}
      - {order: monthname-day, example: "Sept. 6"}
      - {order: day-monthname, example: "6 Sept."}
      - {order: year-monthname-day, example: "1946 Sept. 6"}
      - {order: year-monthname, example: "1946 Sept."}
      - {order: year, example: "1946"}
      - {order: year, example: "'46"}
    source:
      - src/specimen_digitization/application/date_notations.py:62-85
      - src/specimen_digitization/application/field_validators.py:274-281
