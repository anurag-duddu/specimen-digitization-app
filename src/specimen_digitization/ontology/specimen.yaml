# The rules (version 2.0): the relations and checks of the spec's sections 4
# and 5. `check` says how each is checked today: `code` (its statement is an
# invariant today's code guarantees, and tests/test_ontology.py names the tests
# that pin it, one to one), `model`, or `not yet`, with `when` naming the work
# package that builds it. A rule WP 2.3 builds is checked by
# code from then, and WP 2.3 changes its `check` and that test list.
#
# WP 2.2 puts the rules into the models' instructions on the units path, each
# as its `instruction`: what a model does under the rule, never how the code
# decides. A model receives only the rules that concern it
# (Ontology.render_instructions), so the units path's expert request stays
# under its input bound: each field's expert the rules whose `fields` name its
# field; the readers and the first pass the rules marked `reading`, those about
# reading a label; the organiser, which proposes every field, every rule.
rules:
  - id: one_collecting_event
    statement: >-
      A specimen has one collecting event. When two of its labels write two
      different collecting dates, or two place names (letter case, accents,
      punctuation and unit words such as "Dept." aside) that no source the
      answer cites confirms as one place, an answer that settles the field on
      one label's text is refused.
    instruction: >-
      A specimen has one collecting event: where two labels write two different
      collecting dates, or two place names no source confirms as one place, give both
      texts, never one label's alone.
    fields: [country, province_state, county, city, precise_location, date_visited_from, date_visited_to]
    check: code
    darwin_core: "Event: eventDate; dcterms:Location: locality"
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:336-337
      - src/specimen_digitization/field_research/agreement.py:289
      - src/specimen_digitization/field_research/agreement.py:952-959
      - src/specimen_digitization/field_research/agreement.py:2405-2423
  - id: place_within_settled_places
    statement: >-
      The apply-time refusal stays as today: it checks a candidate against the
      settled country and province, but a city against a settled county only
      for a near spelling. On the units path the check stage marks for a
      person a place below the country, settled on a source record that names
      its parents, whose record and the settled country's record name two
      different nations by an identity both carry: the record's country (its
      last parent) and the settled country carry different ISO 3166-1 codes,
      or both are Getty TGN records and the place's chain ends at another TGN
      nation's record the stage knows to be a nation. The country Georgia
      settled on Wikidata's nation (GE), a county Fulton on NGA's record in the
      US state Georgia (US), is marked. Below the country it marks nothing: a
      place is inside a settled province when that province's record is among
      its record's parents, and otherwise the check abstains. A person's value
      is never marked.
    instruction: >-
      A place below the country lies inside the country and province its label writes.
    fields: [province_state, county, city]
    note: >-
      Moved to `not yet` in WP 2.1's review round 4 (the coordinator's ruling),
      as today's check broke it on one input: lies_in matches a parent by name
      (agreement.py:2637-2641), so a county Fulton in the US state Georgia
      passes under the country Georgia. WP 2.3a's check stage
      (field_research/ontology_checks.py) marks it, on the units path only,
      and the case today's check already met stays refused, as today: the
      country United States settled, a province written "Cook" and unsettled,
      a settled county Cook and an exact city Gary in Indiana (NO_PROVINCE).
      Without an identity both records carry the check abstains and marks
      nothing (the coordinator's rulings of WP 2.3a's review rounds 1 and 2: a
      place check marks only a certain conflict). Below the country it never
      marks: Getty TGN places a place under several parents (Aurora,
      tgn:2015136, under Arapahoe County and also Adams County), and the
      records the stage reads give the preferred chain alone (georef_tgn), so
      a province or a county missing from it is not shown to be outside; such
      a check decides only when the record's whole parent set is known, which
      today's reader does not give. At the country it abstains on a TGN chain
      not known to reach its nation (sources._place drops a parent whose name
      another parent has, as Guatemala City's department Guatemala keeps out
      the nation Guatemala; georef_tgn._place stops at an ancestor its
      response lacks), on two gazetteers' records with no ISO code on both, on
      NGA's and Wikidata's parents but by code, on a parent of the settled
      place's name but another record (no name is ever a place), on a place
      settled on GEOLocate, which the stage never reads (its parents are the
      places the expert's query named, with no record:
      sources.geolocate_parents), and on a place an earlier attempt settled
      whose record cannot be read again from the record's own stored
      responses (ontology_checks.stored_answers).
    check: code
    darwin_core: country, stateProvince, county, municipality
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:242-246
      - docs/execution/units/PLAN.md:127
      - src/specimen_digitization/field_research/agreement.py:2637-2641
      - src/specimen_digitization/field_research/agreement.py:2772-2796
      - src/specimen_digitization/field_research/ontology_checks.py:154-201
      - src/specimen_digitization/field_research/ontology_checks.py:320-362
  - id: place_chain
    statement: >-
      The places form one chain, country > province or state > county > city.
      On the units path the check stage marks for a person a place settled on
      a source record whose record and a place settled above it name two
      different nations by an identity both carry (the test of the rule
      place_within_settled_places); a derived country is marked by the rule
      place_parents_derived. Below the country a place is in the
      chain when the settled place's record is among its record's parents,
      and otherwise the check abstains: a settled Coles County, then an exact
      "Chicago" whose TGN preferred chain is Cook County, Illinois and the
      United States, is not marked, and is marked only when the record's
      whole parent set is known. A place an earlier attempt settled is checked
      on its record read again from the record's own stored responses. A
      person's value is never marked.
    instruction: >-
      The places form one chain, country > province or state > county > city, each
      inside the one above it.
    fields: [country, province_state, county, city]
    note: >-
      Without an identity both records carry the check abstains and marks
      nothing (the coordinator's rulings of WP 2.3a's review rounds 1 and 2: a
      place check marks only a certain conflict). Below the country it never
      marks: Getty TGN places a place under several parents (Aurora,
      tgn:2015136, under Arapahoe County and also Adams County), and the
      records the stage reads give the preferred chain alone (georef_tgn), so
      a province or a county missing from it is not shown to be outside; such
      a check decides only when the record's whole parent set is known, which
      today's reader does not give. At the country it abstains on a TGN chain
      not known to reach its nation (sources._place drops a parent whose name
      another parent has, as Guatemala City's department Guatemala keeps out
      the nation Guatemala; georef_tgn._place stops at an ancestor its
      response lacks), on two gazetteers' records with no ISO code on both, on
      NGA's and Wikidata's parents but by code, on a parent of the settled
      place's name but another record (no name is ever a place), on a place
      settled on GEOLocate, which the stage never reads (its parents are the
      places the expert's query named, with no record:
      sources.geolocate_parents), and on a place an earlier attempt settled
      whose record cannot be read again from the record's own stored
      responses (ontology_checks.stored_answers).
    check: code
    darwin_core: country, stateProvince, county, municipality
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:242-246
      - docs/execution/units/PLAN.md:127
      - src/specimen_digitization/field_research/ontology_checks.py:154-201
      - src/specimen_digitization/field_research/ontology_checks.py:320-362
      - src/specimen_digitization/field_research/ontology_checks.py:232-303
  - id: date_order
    statement: >-
      The collecting date is on or before the determination date; the same day
      is allowed. Dates written at different precisions compare on the parts
      both have ("1946" and "1946-09-06" agree). On the units path a settled
      determination dated before the settled collecting date is marked for a
      person by the check stage, both dates listed, and the run's date_order
      reason compares the two dates the same way.
    instruction: >-
      The collecting date is on or before the determination date, the same day
      allowed; dates written at different precisions agree on the parts both write.
    fields: [date_visited_from, date_visited_to, date_identified]
    check: code
    darwin_core: eventDate, dateIdentified
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:247-249
      - docs/execution/units/PLAN.md:127
      - src/specimen_digitization/field_research/ontology_checks.py:115-119
      - src/specimen_digitization/field_research/ontology_checks.py:126-140
      - src/specimen_digitization/field_research/step.py:4158-4169
  - id: day_month_order
    statement: >-
      A numeric date whose two orders, day-month and month-day, give two
      different dates is never settled on either reading by the date check.
    instruction: >-
      A numeric date whose day-month and month-day orders give two different dates is
      either until evidence decides: never read it one way alone.
    fields: [date_visited_from, date_visited_to, date_identified]
    reading: true
    check: code
    darwin_core: eventDate, dateIdentified
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:249-250
      - src/specimen_digitization/application/field_validators.py:129-141
  - id: code_is_no_date
    statement: >-
      Codes are never dates nor any part of them: a slide code such as
      "IV-29-68-4" beside the collecting date "IV-23-48" is no date. On the
      units path the date check gives no date for a literal that any reading
      writes inside a slide code, a match of the file's slide-code forms that
      holds the literal, even where that reading glues a letter to it: the
      literal "I-23-48", reading A "Guatemala I-23-48", reading B "Guatemala
      VI-23-48-4". A date that punctuation separates from a code beside it
      ("IV-23-48;IV-29-68-4") is still a date. Each occurrence of the literal
      in each reading counts: one inside a code makes it no date.
    instruction: >-
      A code is never a date nor part of one: a slide code such as "IV-29-68-4" beside
      the collecting date "IV-23-48" is no date.
    fields: [date_visited_from, date_visited_to, date_identified]
    reading: true
    note: >-
      Moved to `not yet` in WP 2.1's review round 5 (the coordinator's
      ruling), as today's date check broke it on one input: with the literal
      "I-23-48", reading A "Guatemala I-23-48" and reading B "Guatemala
      VI-23-48-4", the check settled 1948-01-23, because date_lines.places
      drops B, where the literal's "I" follows "V", so the code veto never saw
      B's code. WP 2.3a gives no date there on the units path
      (checks.in_a_code); the old path keeps its result. As the statement's
      "any reading" says, the veto reaches across the specimen's labels: a
      slide label writing "IV-23-48-4" and a locality label writing
      "IV-23-48" give no date on the units path, as does "IV-23-48-4
      IV-23-48" on one line, where main gives 1948-04-23 (G51's review of
      round 1, not blocking).
    check: code
    darwin_core: "ours: no Darwin Core term fits a code; eventDate"
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:338-339
      - docs/execution/units/PLAN.md:127
      - src/specimen_digitization/field_research/checks.py:236-237
      - src/specimen_digitization/field_research/checks.py:259-269
      - src/specimen_digitization/field_research/prompts/common.txt:48
  - id: label_type_routing
    statement: >-
      A label's type (locality, determination, code) and a unit's fields, the
      file's routing advice, name the experts a unit is for and never keep a
      field's expert from a unit: every expert's request carries every label's
      readings whole and, on the units path, every unit with its fields, so a
      determination label that writes a locality reaches the locality expert.
    instruction: >-
      A label's type (locality, determination, code) never limits what its text holds:
      a determination label may write a locality.
    fields: []
    reading: true
    check: code
    darwin_core: "ours: no Darwin Core term fits a label"
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:321
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:339-340
      - docs/execution/units/PLAN.md:127
      - src/specimen_digitization/field_research/experts.py:190-224
      - src/specimen_digitization/field_research/experts.py:336-370
  - id: elevation_unit_feet
    statement: >-
      On the units path an elevation whose text writes no unit is read as feet
      only when (a) at the elevation's own unit at least one reader wrote the
      foot mark or "ft" right after its number, unquoted and with no other
      unit after it, and another reader wrote no unit, no reading writes
      another elevation, and the expert's options name no other number; (b)
      the number read as metres is above the highest point of the specimen's
      country, which is cleared, not marked (the highest-point table); and
      (c) the number read as feet is possible (16000 with a mark is not, in
      the Philippines). When all hold, Elevation From (ft) settles to that
      number, cleared, its reason "Basis: inferred, rule elevation_unit_feet",
      and derivation fills the other elevation fields.
      Otherwise the field is unresolved: magnitude alone never decides.
      Terrain takes no part while the owner's decision D5 is held.
    instruction: >-
      Keep an elevation's foot mark (') or "ft" wherever it is written; a
      number's size alone never makes it feet.
    fields: [elevation_from_m, elevation_to_m, elevation_from_ft, elevation_to_ft]
    reading: true
    note: >-
      Checked by code from WP 2.3b, on the units path only
      (field_research/ontology_checks.infer_feet, run by step.apply_outcomes
      after each label's settlement is recorded): Elevation From (ft), held
      with no literal or a bare number while every other elevation field is
      open, is inferred only on its own unit (ontology_checks.foot_number):
      one the first pass routes to an elevation field, or whose readers each
      write the number right after an elevation's heading, by the headings
      field_research/written.py's HEADINGS lists ("alt", "altitude", "elev",
      "elevation" and others, periods dropped) and "el." (this notation
      file's elevation_heading lists only "alt." and "el.");
      the held field's cited label rows bind no unit (Codex's round 2 on PR
      #437). No reader writes a quotation
      mark right before the number; one or more write the foot mark
      (straight, curly or a prime) glued to it or "ft" after it, with no
      other unit after that, and one or more write no unit; none writes
      another unit or a distance. No reading of any label writes another
      elevation, and the expert's options, where it gave some, name no other
      number. These follow the coordinator's rulings on Codex's and G51's
      round 1 on PR #437, whose inputs "Trap '6400", "No. 3456'", "Camp at
      5000 ft." beside "Elev.6400'", "Camp '6400'" and "Elev. 6400' m" are
      named cases that stay unresolved. The country is cleared (a label's
      cleared finding) and has no marked finding, and the table's row of its
      Wikidata item, else the one row named as the country is (its
      normalized value, else its parsed value, else its literal), gives (b)
      and (c). Derivation then fills the other elevation fields. Any other
      case is left as on main: unresolved.
    check: code
    darwin_core: verbatimElevation, minimumElevationInMeters, maximumElevationInMeters
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:251-258
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:260-267
      - docs/execution/units/PLAN.md:127
  - id: elevation_needs_a_unit
    statement: >-
      An answer that settles an elevation field on a number that one of its
      readings writes with no unit anywhere in that reading is refused: a unit
      is never guessed from the magnitude, the place or a map.
    instruction: >-
      Never give an elevation a unit its label does not write: not from its size, the
      place or a map.
    fields: [elevation_from_m, elevation_to_m, elevation_from_ft, elevation_to_ft]
    check: code
    darwin_core: verbatimElevation, minimumElevationInMeters, maximumElevationInMeters
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:255-256
      - src/specimen_digitization/field_research/agreement.py:310
      - src/specimen_digitization/field_research/agreement.py:832-836
  - id: elevation_unit_decides_field
    statement: >-
      An answer that settles an elevation field on a number that one of its
      readings writes in the other unit is refused.
    instruction: >-
      An elevation's written unit decides its field: metres go to the metre fields,
      feet to the foot fields.
    fields: [elevation_from_m, elevation_to_m, elevation_from_ft, elevation_to_ft]
    check: code
    darwin_core: verbatimElevation, minimumElevationInMeters, maximumElevationInMeters
    source:
      - src/specimen_digitization/field_research/agreement.py:309
      - src/specimen_digitization/field_research/agreement.py:824-831
      - docs/execution/units/PLAN.md:127
  - id: place_parents_derived
    statement: >-
      Upward derivation (a country from a settled province) stays as today and
      fills only open fields; a province derived from a county is the county's
      province-level parent, the first of the two or more its record names,
      never the country. The place chains that derivation fills are checked
      against the place chain on the units path: a derived country is marked
      for a person when a place settled below it, on a source record that
      names its parents, names another nation by an identity both carry (the
      test of the rule place_within_settled_places), unless a person kept it,
      when the place below it is marked instead. A derived province or county
      is never marked: below the country the check abstains. A province "Cook"
      unresolved, a settled county Cook in Illinois and a settled city Gary in
      Indiana: the province is derived as Illinois, and is not marked on
      TGN's preferred chain alone.
    instruction: >-
      Leave a larger place the label does not write empty: never take it from a
      smaller place's parents.
    fields: [country, province_state, county]
    derives: true
    note: >-
      Moved to `not yet` in WP 2.1's review round 4 (the coordinator's
      ruling): with the province's text "Cook" unresolved, a settled county
      Cook in Illinois and a settled city Gary in Indiana, the province is
      derived as Illinois from the county alone (derive._can_derive_place), a
      chain that fails the place chain; and no test pinned that a province
      derived from a county is the county's province-level parent, never the
      country. Derivation is unchanged in WP 2.3a, and a test pins the parent
      derived. Its check stage does not mark that province: below the country
      the check abstains on TGN's preferred chain alone (the coordinator's
      ruling of WP 2.3a's review round 2), and it marks a derived country only,
      when a place below it names another nation by an identity both carry.
      Without such an identity the check abstains, as for the rule
      place_within_settled_places.
    check: code
    darwin_core: country, stateProvince, county
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:268-269
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:242-246
      - docs/execution/units/PLAN.md:127
      - src/specimen_digitization/field_research/derive.py:43-50
      - src/specimen_digitization/field_research/derive.py:95-146
      - src/specimen_digitization/field_research/ontology_checks.py:320-362
  - id: elevation_conversion
    statement: >-
      A derived elevation is a stated one copied to the other end of its unit,
      or its exact conversion (1 ft = 0.3048 m) rounded to the hundredth; a
      derived elevation never replaces a stated one; and no elevation is
      derived while an elevation field is neither settled nor open (one the
      readings disagree on goes to a person first). On the units path an
      elevation field is never settled absent while another elevation field
      is ambiguous, unresolved or unknown and a reading writes an elevation:
      it waits, unknown, its reason naming that field, with no review reason
      of its own; it is derived once that field settles, after the experts
      or after a person's decision, and where it then cannot be derived it
      is not present again, with its own review reason.
    instruction: >-
      Never convert an elevation to the other unit: give it in the unit the label
      writes.
    fields: [elevation_from_m, elevation_to_m, elevation_from_ft, elevation_to_ft]
    derives: true
    check: code
    darwin_core: verbatimElevation, minimumElevationInMeters, maximumElevationInMeters
    source:
      - src/specimen_digitization/field_research/derive.py:4-7
      - src/specimen_digitization/field_research/derive.py:168-186
      - src/specimen_digitization/application/derivations.py:29-30
      - src/specimen_digitization/application/derivations.py:97-122
  - id: end_date_from_one_date
    statement: >-
      A derived Date Visited To is the date of a settled Date Visited From, at
      its precision, and is never derived from a written range. On the units
      path Date Visited To is never settled absent while Date Visited From is
      ambiguous, unresolved or unknown with a text: it waits, unknown, its
      reason naming Date Visited From, with no review reason of its own; it
      is derived once that date settles, after the experts or after a
      person's decision, and where it then cannot be derived it is not
      present again, with its own review reason.
    instruction: >-
      Give Date Visited To only from an end date the label writes, never from a single
      collecting date.
    fields: [date_visited_to]
    derives: true
    check: code
    darwin_core: eventDate
    source:
      - src/specimen_digitization/field_research/derive.py:42
      - src/specimen_digitization/field_research/derive.py:84-91
  # Resolved in version 2.0 (the spec's section 5, its line dated 2026-11-14):
  # the extent of Precise Location (WP 1.5's gap report: "CNHM. E Slope Mt."
  # cleared where the truth holds the whole locality) and O2 (a label whose
  # only locality text is the town's, "Yepocapa, 4800 ft."). Settled by the PRD
  # (the verbatim locality, as written, at the root of the place tree) and its
  # georeferencing document (verbatimLocality "Yepocapa, 4800 ft. / Chimaltenago,
  # / Guatemala" for slide 105526329), and confirmed by the reference truth,
  # whose ten pilot rows each hold the label's whole locality lines.
  - id: precise_location_extent
    statement: >-
      On the units path, a precise location whose literal writes no settled
      province or country and, in every reading of its label, ends a line
      before a line that continues the locality with a settled province or
      country outside every other settled field's text (nothing else on
      that line but other settled fields' texts, place unit words and
      punctuation) is marked for a person as cut short, unless a person
      decided it, when it is never marked;
      a precise location that names nothing finer than its town, or than its
      country, is never cleared as not on the label; and one that holds an
      elevation settles only when its elevation text is the literal an
      elevation field settled from that label.
    instruction: >-
      Precise Location is the label's locality as written: every line of its locality
      text, with its line breaks, the higher places and an elevation written on those
      lines, never a collector or a date; never only its first line, and a locality
      naming nothing finer than its town has one too.
    fields: [precise_location]
    reading: true
    note: >-
      The rule's meaning, which the instruction carries to the models:
      Precise Location is the label's locality as written, every line of its
      locality text, with its line breaks, the higher places and an
      elevation written among those lines included; it is never cut to the
      first line, and a label whose locality names nothing finer than its
      town, or than its country, still has one: those lines as written. Code
      guarantees the statement above, on the units path only (the
      coordinator's ruling on G51's round 1 on PR #437, as WP 2.3a restated
      its place rules), and a model the rest. Checked by code on the units
      path from WP 2.3b, and by a model there from WP 2.2: the instruction
      above is in the readers', the first
      pass's, the organiser's and the precise location expert's
      instructions, and that expert's brief takes the whole locality
      (prompts/units.txt, its precise_location.txt texts). The code's parts:
      a town-only locality is never cleared as not on the label
      (step._no_finer_place, step._repeats_a_place, step.mark_not_on_label,
      step.not_on_label); a precise location that holds an elevation, by
      candidate or read from the transcript, settles only when
      agreement.elevation_kept keeps that elevation (one elevation, ending
      its line, a locality besides it, no date) and its text is the literal
      an elevation field settles from the same label
      (agreement.literal_refusal, step._taken), an elevation the guard on
      another field's text takes not counting; and the check stage marks one
      cut short (ontology_checks._extent_marks), only where its label's next
      line is the locality going on ("Davao Prov." after "E. slope Mt.
      McKinley"; never "University of the Philippines" after "Los Banos,
      Philippines", "Guatemala Exped. 1948" after "Yepocapa, Chimaltenango,
      Guatemala", or a reading that writes "Mt" with no period: Codex's and
      G51's round 1 on PR #437). The old path keeps main's: a
      town-only locality is cleared as not on the label, a precise location
      read from the transcript that holds an elevation is refused, and an
      organiser candidate that holds one can settle. A label whose only
      locality text is its country settles that text as its precise location
      on the units path: the PRD's verbatim locality as written, at the root
      of the place tree, and the georeferencing document's verbatimLocality,
      whose example keeps the country's line. Code does not see a precise
      location cut short within a line, before a line that writes a name no
      field settled ("Mindanao, P.I."), with a literal that writes the
      province while the next line adds the country, or where its label's
      readers write the literal differently; the model's instruction covers
      those.
    check: code
    darwin_core: verbatimLocality
    source:
      - docs/product-requirements/PRD.md:519
      - docs/product-requirements/PRD.md:689-690
      - docs/product-requirements/PRD.md:774
      - docs/product-requirements/GEOREFERENCING.md:258
      - docs/product-requirements/GEOREFERENCING.md:276
      - tests/fixtures/field_model_pilot_rows.json:30
      - tests/fixtures/field_model_pilot_rows.json:79
      - tests/fixtures/field_model_pilot_rows.json:152
      - tests/fixtures/field_model_pilot_rows.json:289
      - tests/fixtures/field_model_pilot_rows.json:325
      - https://dwc.tdwg.org/terms/#dwc:verbatimLocality
  # WP 2.T, the coordinator's re-plan of 2026-11-14 (its item 4), after the owner's
  # "4 shouldn't be flagged. It should be caught and handled. Goal isn't to throw
  # everything at the user it is to help by being in in autonomy as much as
  # possible." and "Harness needs to work and do its magic".
  - id: taxon_in_collection_scope
    statement: >-
      Field research settles a taxon only inside the collection's higher taxon,
      class Insecta, the class of the Insects collection whose profile the
      slides follow, which GBIF is asked with: it settles a name only on GBIF's
      decision, and GBIF's decision for a name is a record in Insecta at the
      label's rank, the name's exact accepted record or the accepted record of
      its exact synonym, with no other exact record of the name in Insecta
      under another authorship, whatever that record's status. So a name every
      exact record of which lies outside Insecta ("Cynomys", "Citellus" and
      "Thomomys", genera of Mammalia) is never settled as the specimen's taxon,
      and "Epipsocus", whose exact records in Insecta are the accepted
      Epipsocus Hagen, 1866 and Epipsocus Badonnel, 1955, a synonym of another
      genus, Epipsocopsis, has no decision. A person reviewing the record may
      still choose any of GBIF's candidates.
    instruction: >-
      A name GBIF finds only outside class Insecta, the collection's higher taxon, such as
      a mammal's or a bird's genus written with no host marker, is never the specimen's
      taxon; when the labels write no other name, the specimen's taxon is not on the label.
    fields: [taxon]
    note: >-
      An invariant of the code before WP 2.T, on both paths: GBIF's answer is a
      success only by row one or a cleared exact synonym, each in class Insecta
      with no homonym conflict in Insecta. WP 2.T adds the instruction the
      taxon expert and the organiser receive on the units path and pins the
      invariant on GBIF's stored answers of the units-wp15c runs.
    check: code
    darwin_core: "scientificName; class"
    source:
      - src/specimen_digitization/application/profiles/published.json:8-12
      - src/specimen_digitization/application/profiles/published.json:93-95
      - src/specimen_digitization/application/lookup.py:574-604
      - src/specimen_digitization/application/lookup.py:607-642
      - src/specimen_digitization/application/lookup.py:856-863
      - docs/GBIF.md:126-130
      - docs/execution/golive/HARNESS.md:1044-1062
      - https://dwc.tdwg.org/terms/#dwc:class
  - id: host_is_no_taxon
    statement: >-
      A name a label writes after a host marker (the notation host_marker, a
      whole word anywhere before the name on its line, letter case and a final
      period aside: "Host Thomomys", "Ex. Canis familiaris", "ex Peromyscus
      leucopus", "from nest of Formica rufa") is the host the specimen was
      taken from or a taxon associated with it, Darwin Core's associatedTaxa,
      and is not taken as the specimen's scientificName. On the units path an
      answer whose literal any reading writes so, as whole name tokens, or
      whose first word is such a marker, does not settle the taxon, whatever
      GBIF finds for it. A word that only ends in a marker ("Mex.", "Upon") is
      no marker, and a name before the marker ("Aus bus" in "Aus bus on
      Quercus") or written only inside a longer word ("Musca" in "Host
      Muscardinus") is no host.
    instruction: >-
      A name after a host marker on its line ("Host Thomomys", "Ex. Canis familiaris",
      "from nest of Formica rufa") is never the specimen's taxon; when the labels write
      no other name, the specimen's taxon is not on the label.
    fields: [taxon]
    check: code
    darwin_core: "associatedTaxa; scientificName"
    source:
      - https://dwc.tdwg.org/terms/#dwc:associatedTaxa
      - https://dwc.tdwg.org/terms/#dwc:scientificName
      - src/specimen_digitization/field_research/taxon_host.py:20-71
      - src/specimen_digitization/field_research/agreement.py:1037-1052

