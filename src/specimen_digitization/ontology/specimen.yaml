# The specimen ontology: the conceptual model of this collection's labels, one
# file read by people and by code (docs/product-requirements/
# FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md section 5; docs/execution/units/
# PLAN.md, WP 1.0). The loader, ontology/__init__.py, refuses a key it does not
# know, a field that is not one of the profile's 20, and an entry with no
# source, and renders the file to the text a model's instructions carry.
#
# Version 1.0 holds no meaning the engineer invented: the things of the spec's
# section 5 table, the profile's 20 fields with their Darwin Core terms, the
# label notations moved from the Insects harness knowledge (its NOTATIONS,
# PLACE_ALIASES and RULES; the module and its test are deleted with this
# version) and from the label notations of field_research/prompts/common.txt,
# the fields a unit could belong to, and the units whose meaning waits for the
# owner's reading in WP 2.1. Every entry names its source. A source
# "<path>:<lines>" is a file of this repository at the commit that adds this
# file, its path from the repository's root; "insects.py:<lines> at 7a09445a2"
# is the deleted module, at main 7a09445a2, where the plan's WP 1.0 row gives
# its path (docs/execution/units/PLAN.md:98).
#
# A notation's or a question's `written` forms are matched in a unit's text by
# code (ontology.Ontology.advice): letter case aside, except in a word in angle
# brackets; a space in a form matches any white space, a line break too, or
# none; a form's final period is optional only where `periods_optional` is
# true (common.txt:40, "with or without periods"); a form that begins or ends
# with a letter, a digit or a word in angle brackets matches only at a word's
# edge. A word in angle brackets stands for what the label writes there
# (common.txt:4): <n> a number; <d>, <dd>, <d1>, <d2>, <mm>, <a>, <b> a day's
# or a month's one or two digits; <yy> a two-digit year; <yyyy> a four-digit
# year; <Roman month> a Roman numeral I to XII in capitals; <letter> one
# letter. A match inside a longer match is dropped, so no part of a slide code
# is read as a date (common.txt:48), and a unit holding an open question
# carries no field and no reading.

version: "1.0"

frame:
  name: Darwin Core conceptual model of specimen data
  reference: https://dwc.tdwg.org/cm/, version 2026-10-13
  source:
    - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:298-302

things:
  - id: specimen
    name: Specimen
    examples: the slide, its catalogue number, the institution that holds it
    darwin_core: MaterialEntity; catalogNumber, institutionCode
    source: [docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:306]
  - id: collecting_event
    name: Collecting event
    examples: "one act of collecting: where, when, how, in what habitat"
    darwin_core: "Event: eventDate, samplingProtocol, habitat; the collectors as recordedBy"
    source: [docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:307]
  - id: locality
    name: Locality
    examples: the place of the event, in a chain country > province > county > city, with an elevation
    darwin_core: "dcterms:Location: locality, municipality, county, stateProvince, country, minimumElevationInMeters"
    source: [docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:308]
  - id: agent
    name: Agent
    examples: a collector, an identifier
    darwin_core: Agent; recordedBy, identifiedBy
    source: [docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:309]
  - id: determination
    name: Determination
    examples: a taxon name given to the specimen by a person on a date
    darwin_core: "Identification: identifiedBy, dateIdentified; the name as Taxon: scientificName"
    source: [docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:310]
  - id: taxon
    name: Taxon
    examples: the name, its rank, its accepted name
    darwin_core: Taxon
    source: [docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:311]
  - id: code
    name: Code
    examples: a slide or preparation code, a species number
    darwin_core: "no term fits them; the thing is this file's own"
    source: [docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:312]
  - id: label
    name: Label
    examples: a physical label; it carries attributes of the things above and has a type (locality, determination, code)
    darwin_core: "no term; the thing is this file's own"
    source: [docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:313]

# The profile's 20 fields (application/domain.py MANDATORY, the Insects
# profile's mandatory fields), in its order. `label` is the PRD table's display
# name (field_research/prompts/__init__.py FIELD_LABELS); `holds` is the first
# line of the field's brief, except where it says otherwise.
fields:
  - key: fmnh_ins_number
    label: "FMNH-INS#"
    darwin_core: catalogNumber
    holds: >-
      The Field Museum insect catalog number, often printed after "FMNH INS" or
      "FMNHINS", sometimes on a barcode label.
    source:
      - src/specimen_digitization/field_research/prompts/fmnh_ins_number.txt:1
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:306
      - src/specimen_digitization/research_harness/sources.py:45
  - key: collection_code
    label: Collection Code
    darwin_core: collectionCode
    holds: A code the label writes for the collection or the collecting event, copied as written.
    source:
      - src/specimen_digitization/field_research/prompts/collection_code.txt:1
      - src/specimen_digitization/research_harness/sources.py:45
  - key: country
    label: Country
    darwin_core: country
    holds: The country where the specimen was collected, as the labels write it.
    source:
      - src/specimen_digitization/field_research/prompts/country.txt:1
      - docs/product-requirements/GEOREFERENCING.md:259
  - key: province_state
    label: Province/State
    darwin_core: stateProvince
    holds: >-
      The first-level administrative unit (province, state or department) where
      the specimen was collected, as the labels write it.
    source:
      - src/specimen_digitization/field_research/prompts/province_state.txt:1
      - docs/product-requirements/GEOREFERENCING.md:259
  - key: county
    label: County
    darwin_core: county
    holds: >-
      The country's second-level administrative unit where the specimen was
      collected, as the labels write it: a county, or whatever unit the
      country's local government holds at that level instead (a municipio,
      where that is the second level).
    source:
      - src/specimen_digitization/field_research/prompts/county.txt:1
      - docs/product-requirements/GEOREFERENCING.md:259
  - key: city
    label: City
    darwin_core: municipality
    holds: The city, town or municipality the labels name as the collecting place.
    source:
      - src/specimen_digitization/field_research/prompts/city.txt:1
      - docs/product-requirements/GEOREFERENCING.md:259
  - key: precise_location
    label: Precise Location
    darwin_core: verbatimLocality
    holds: >-
      The locality as the label writes it: the most specific place text, such
      as "E. slope Mt. <Mountain>, nr. <Town>".
    note: Darwin Core's locality is its interpretation and may equal it.
    source:
      - src/specimen_digitization/field_research/prompts/precise_location.txt:1
      - docs/product-requirements/GEOREFERENCING.md:258
  - key: elevation_from_m
    label: Elevation From (m)
    darwin_core: minimumElevationInMeters
    holds: The lower, or only, elevation the label writes in metres.
    source:
      - src/specimen_digitization/field_research/prompts/elevation_from_m.txt:1
      - docs/product-requirements/GEOREFERENCING.md:261
  - key: elevation_to_m
    label: Elevation To (m)
    darwin_core: maximumElevationInMeters
    holds: The upper end of an elevation range the label writes in metres.
    source:
      - src/specimen_digitization/field_research/prompts/elevation_to_m.txt:1
      - docs/product-requirements/GEOREFERENCING.md:261
  - key: elevation_from_ft
    label: Elevation From (ft)
    darwin_core: verbatimElevation
    holds: The lower, or only, elevation the label writes in feet.
    note: >-
      The four elevation fields map to verbatimElevation, as written, and to
      minimumElevationInMeters and maximumElevationInMeters; an elevation in
      feet is the verbatimElevation ("4800 ft.").
    source:
      - src/specimen_digitization/field_research/prompts/elevation_from_ft.txt:1
      - docs/product-requirements/GEOREFERENCING.md:261
      - docs/product-requirements/GEOREFERENCING.md:279
  - key: elevation_to_ft
    label: Elevation To (ft)
    darwin_core: verbatimElevation
    holds: The upper end of an elevation range the label writes in feet.
    note: >-
      The four elevation fields map to verbatimElevation, as written, and to
      minimumElevationInMeters and maximumElevationInMeters; an elevation in
      feet is the verbatimElevation ("4800 ft.").
    source:
      - src/specimen_digitization/field_research/prompts/elevation_to_ft.txt:1
      - docs/product-requirements/GEOREFERENCING.md:261
      - docs/product-requirements/GEOREFERENCING.md:279
  - key: habitat
    label: Habitat
    darwin_core: habitat
    holds: >-
      The habitat, host or substrate the label writes, such as "under
      <substrate>", "on <host>" or "<vegetation> forest", copied as written.
    source:
      - src/specimen_digitization/field_research/prompts/habitat.txt:1
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:307
  - key: collection_method
    label: Collection Method
    darwin_core: samplingProtocol
    holds: >-
      How the specimen was collected, as the label writes it, such as
      "Berlese", "light trap", "beating" or "sweeping".
    source:
      - src/specimen_digitization/field_research/prompts/collection_method.txt:1
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:307
  - key: date_visited_from
    label: Date Visited From
    darwin_core: eventDate
    holds: >-
      The date the specimen was collected, or the first date of a written
      collecting range, at the precision written.
    source:
      - src/specimen_digitization/field_research/prompts/date_visited_from.txt:1
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:307
      - src/specimen_digitization/research_harness/sources.py:47
  - key: date_visited_to
    label: Date Visited To
    darwin_core: eventDate
    holds: >-
      The last date of collecting, only when the label writes a range or an
      end date, at the precision written.
    source:
      - src/specimen_digitization/field_research/prompts/date_visited_to.txt:1
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:307
      - src/specimen_digitization/research_harness/sources.py:47
  - key: collectors
    label: Collectors
    darwin_core: recordedBy
    holds: The people who collected the specimen, exactly as the label writes them.
    source:
      - src/specimen_digitization/field_research/prompts/collectors.txt:1
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:307
      - docs/product-requirements/EMU_PARTIES_IRN_RESEARCH.md:23
  - key: verbatim_dts
    label: Verbatim D/T/S
    darwin_core: verbatimEventDate
    holds: >-
      Text transcribed exactly as written: a non-standard collection-event
      date or time expression, such as "Avril 1917", "Summer 1914", "am",
      "pm", "sunrise" or "daylight".
    note: >-
      The brief's first line says the museum has not confirmed what the field
      holds; the PRD records the collection manager's answer of 2026-10-07,
      and WP 1.7 replaces the brief's sentence. No document of this
      repository names its Darwin Core term: verbatimEventDate is Darwin
      Core's term for an event's date and time as written.
    source:
      - src/specimen_digitization/field_research/prompts/verbatim_dts.txt:1
      - docs/product-requirements/PRD.md:1224
      - https://dwc.tdwg.org/terms/#dwc:verbatimEventDate
  - key: taxon
    label: Taxon
    darwin_core: scientificName
    holds: The scientific name the labels give the specimen, at the rank written.
    source:
      - src/specimen_digitization/field_research/prompts/taxon.txt:1
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:310
      - src/specimen_digitization/research_harness/sources.py:48
  - key: identified_by_irn
    label: Identified by IRN
    darwin_core: identifiedBy
    holds: The EMu Parties record number (IRN) of the person who identified the specimen.
    note: >-
      The museum's Darwin Core mapping resolves the identifier's Parties
      reference to the name it publishes as identifiedBy; its public archive
      maps no identifiedByID.
    source:
      - src/specimen_digitization/field_research/prompts/identified_by_irn.txt:1
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:309-310
      - docs/product-requirements/EMU_PARTIES_IRN_RESEARCH.md:23
      - docs/product-requirements/EMU_PARTIES_IRN_RESEARCH.md:28
  - key: date_identified
    label: Date Identified
    darwin_core: dateIdentified
    holds: The date the specimen was identified (determined), at the precision written.
    source:
      - src/specimen_digitization/field_research/prompts/date_identified.txt:1
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:310
      - src/specimen_digitization/research_harness/sources.py:46

# The fields a kind of unit could belong to, where no notation names them.
# Advice only: every expert receives every unit (spec section 3, `fields`).
# The order is the file's, not a likelihood.
routing:
  - id: place_name
    unit: >-
      a place's name the label writes with no notation beside it ("<Town>",
      "<Province>", "<Country>", a mountain's name)
    fields: [country, province_state, county, city, precise_location]
    means: >-
      a place; the sources decide which level it is (a country, a province or
      state, a county or municipio, a city or town, or a place within them),
      never its name; a town and the second-level unit around it often share
      a name, and a mountain, an island, a river or an estate belongs to the
      precise location
    source:
      - src/specimen_digitization/field_research/prompts/county.txt:5-6
      - src/specimen_digitization/field_research/prompts/city.txt:6-7
      - src/specimen_digitization/field_research/prompts/province_state.txt:7
      - src/specimen_digitization/field_research/prompts/country.txt:6
      - src/specimen_digitization/field_research/prompts/precise_location.txt:8
  - id: person_name
    unit: a person's name ("<Initials> <Surname>")
    fields: [collectors, identified_by_irn]
    means: >-
      a person; the marker beside the name says the role ("leg.", "coll.",
      "Coll.": a collector; "det.": the determiner), and capitalisation or
      position alone establishes no role
    source:
      - src/specimen_digitization/field_research/prompts/collectors.txt:4
      - src/specimen_digitization/field_research/prompts/collectors.txt:6-7
      - src/specimen_digitization/field_research/prompts/identified_by_irn.txt:4

# How the readings of a notation are used, moved with the notations
# (insects.py RULES).
notation_rule:
  text: >-
    Copy every literal exactly as the reading has it, character for character;
    a literal that is not in the reading is refused. Never complete, correct or
    translate a literal: readings of a notation are for calling the tools,
    never for the literal itself. Work through every reading a notation allows
    before a field is left for review, and let the tools and the specimen's
    other evidence decide between them. A field the label does not have stays
    empty.
  source:
    - insects.py:99-105 at 7a09445a2

