# Each country's highest point and its elevation, from Wikidata, for the
# elevation unit rule (condition (b)); code reads it (WP 2.3), and no rendered
# text carries it. Every row cites Wikidata through its two items (the country,
# P610 "highest point", and the point, P2044 "elevation above sea level", in
# metres as the query service normalises it), retrieved once with the query
# below. Philippines -> Mount Apo, 2954 m, as the spec states.
highest_points:
  source: Wikidata (https://www.wikidata.org/), CC0
  endpoint: https://query.wikidata.org/sparql
  retrieved: "2026-11-14T14:02:05Z"
  query: |
    SELECT ?country ?countryLabel ?point ?pointLabel ?elevation ?rank WHERE {
      { ?country wdt:P31 wd:Q6256 . } UNION { ?country wdt:P31 wd:Q3624078 . }
      FILTER NOT EXISTS { ?country wdt:P576 ?dissolved . }
      ?country wdt:P610 ?point .
      ?point p:P2044 ?statement .
      ?statement wikibase:rank ?rank .
      FILTER(?rank != wikibase:DeprecatedRank)
      ?statement psn:P2044/wikibase:quantityAmount ?elevation .
      SERVICE wikibase:label { bd:serviceParam wikibase:language "en,mul". }
    }
  selection: >-
    One row per country the query returns: its elevation statements of the
    best rank present (preferred, else normal); of those, the greatest
    elevation in metres; on a tie, the point with the lower Q-number. The
    countries are the items that are an instance of country (Q6256) or of
    sovereign state (Q3624078) and have no dissolution date (P576).
