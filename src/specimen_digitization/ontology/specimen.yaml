  - id: philippine_islands_abbreviation
    written: ["P.I."]
    readings: ["Philippine Islands, the Philippines"]
    fields: [country]
    source:
      - insects.py:28 at 7a09445a2
      - insects.py:94 at 7a09445a2
      - src/specimen_digitization/field_research/prompts/common.txt:36
      - src/specimen_digitization/field_research/prompts/common.txt:27
