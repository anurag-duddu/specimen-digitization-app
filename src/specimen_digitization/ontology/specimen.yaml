    fields: [precise_location]
    source:
      - insects.py:45-49 at 7a09445a2
      - src/specimen_digitization/field_research/prompts/common.txt:38
  - id: collected_by
    written: ["leg.", "coll.", "Coll."]
    readings: ["collected by, marking the collectors"]
    fields: [collectors]
    source:
      - insects.py:50-52 at 7a09445a2
      - src/specimen_digitization/field_research/prompts/common.txt:39
  - id: determined_by
    written: ["det."]
    readings: ["determined by, marking who identified the specimen"]
    fields: [identified_by_irn]
    source:
      - insects.py:53-57 at 7a09445a2
      - src/specimen_digitization/field_research/prompts/common.txt:39
  # field_research/written.py decides the capital "M" exception in code (_a_name,
  # written.py:451-462; _counts_sexes, written.py:465-494; the unit decision,
  # written.py:523-528); WP 2.2 aligns this entry with it.
  - id: metres
    written: ["<n> m"]
    readings: ["metres, the unit of an elevation; not metres when a capital \"M\" stands before a name or in a count of males and females"]
    fields: [elevation_from_m, elevation_to_m]
    note: The unit decides the field.
    source:
      - insects.py:58-62 at 7a09445a2
      - src/specimen_digitization/field_research/prompts/common.txt:44
      - src/specimen_digitization/field_research/prompts/elevation_from_m.txt:8
