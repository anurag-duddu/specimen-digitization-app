    note: The unit decides the field.
    source:
      - insects.py:58-62 at 7a09445a2
      - src/specimen_digitization/field_research/prompts/common.txt:44
      - src/specimen_digitization/field_research/prompts/elevation_from_ft.txt:8
  - id: elevation_heading
    written: ["alt.", "el."]
    readings: ["the heading of an elevation"]
