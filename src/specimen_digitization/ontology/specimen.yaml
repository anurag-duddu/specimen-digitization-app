# The rules (version 2.0): the relations and checks of the spec's sections 4
# and 5. `check` says how each is checked today: `code` (its statement is an
# invariant today's code guarantees, and tests/test_ontology.py names the tests
# that pin it, one to one), `model`, or `not yet`, with `when` naming the work
# package that builds it. A rule WP 2.3 builds is checked by
# code from then, and WP 2.3 changes its `check` and that test list.
rules:
  - id: one_collecting_event
    statement: >-
      A specimen has one collecting event. When two of its labels write two
      different collecting dates, or two place names (letter case, accents,
      punctuation and unit words such as "Dept." aside) that no source the
      answer cites confirms as one place, an answer that settles the field on
      one label's text is refused.
    check: code
    darwin_core: "Event: eventDate; dcterms:Location: locality"
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:336-337
      - src/specimen_digitization/field_research/agreement.py:289
      - src/specimen_digitization/field_research/agreement.py:952-959
      - src/specimen_digitization/field_research/agreement.py:2405-2423
  - id: place_within_settled_places
    statement: >-
      When a place value is applied, the check of its larger places refuses a
      place below the country whose source names no larger place, one whose
      source puts it outside the country settled for its reading, a county or
      a city outside the province settled for its reading, and a county that
      is that province itself.
    check: code
    darwin_core: country, stateProvince, county, municipality
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:242-246
      - src/specimen_digitization/field_research/agreement.py:2772-2796
  - id: place_chain
    statement: >-
      The places form one chain, country > province or state > county > city.
      A settled value outside the chain settled above it is marked for a
      person, including what the refusal at apply time lets pass (a settled
      Coles County, then an exact "Chicago" under Illinois), and so is a chain
      that derivation fills when it breaks the chain.
    check: not yet
    when: WP 2.3
    darwin_core: country, stateProvince, county, municipality
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:242-246
      - docs/execution/units/PLAN.md:127
  - id: date_order
    statement: >-
      The collecting date is on or before the determination date; the same day
      is allowed. Dates written at different precisions compare on the parts
      both have ("1946" and "1946-09-06" agree). A determination dated before
      the collecting date is marked for a person, both dates listed.
    check: not yet
    when: WP 2.3
    darwin_core: eventDate, dateIdentified
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:247-249
      - docs/execution/units/PLAN.md:127
  - id: day_month_order
    statement: >-
      The date check reads a numeric date whose two orders, day-month and
      month-day, give two different dates both ways and settles neither
      reading, a conflict with both readings for a person; a numeric date
      whose two orders give one date (5-5-48) settles on it.
    check: code
    darwin_core: eventDate, dateIdentified
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:249-250
      - src/specimen_digitization/application/field_validators.py:129-141
  - id: code_is_no_date
    statement: >-
      A slide or preparation code is never a date, nor is any part of it: text
      that stands inside a longer hyphen-joined code in any reading is no date.
    check: code
    darwin_core: "ours: no Darwin Core term fits a code; eventDate"
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:338-339
      - src/specimen_digitization/field_research/checks.py:205-207
      - src/specimen_digitization/field_research/prompts/common.txt:48
  - id: label_type_routing
    statement: >-
      A label's type (locality, determination, code) sends its units to the
      experts of its fields first and never keeps a field's expert from a unit:
      a determination label that writes a locality reaches the locality expert.
    check: not yet
    when: WP 2.3
    darwin_core: "ours: no Darwin Core term fits a label"
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:321
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:339-340
      - docs/execution/units/PLAN.md:127
  - id: elevation_unit_feet
    statement: >-
      An elevation whose cleared text writes no unit is read as feet only when
      (a) at least one reader wrote the foot mark or "ft" at this unit, (b) the
      number read as metres is above the highest point of the specimen's
      country, which is cleared, not marked (the highest-point table), and (c)
      the number read as feet is possible (16000 with a mark is not, in the
      Philippines). When all hold, the elevation settles in feet, cleared, its
      reason "Basis: inferred, rule elevation_unit_feet". Without (a) the field
      is unresolved: magnitude alone never decides; so it is when (b) or (c)
      fails or the country is marked. Terrain takes no part while the owner's
      decision D5 is held.
    check: not yet
    when: WP 2.3
    darwin_core: verbatimElevation, minimumElevationInMeters, maximumElevationInMeters
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:251-258
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:260-267
      - docs/execution/units/PLAN.md:127
  - id: elevation_needs_a_unit
    statement: >-
      An answer that settles an elevation field on a number that one of its
      readings writes with no unit is refused: a unit is never guessed from the
      magnitude, the place or a map.
    check: code
    darwin_core: verbatimElevation, minimumElevationInMeters, maximumElevationInMeters
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:255-256
      - src/specimen_digitization/field_research/agreement.py:310
      - src/specimen_digitization/field_research/agreement.py:832-836
  - id: elevation_unit_decides_field
    statement: >-
      An answer that settles an elevation field on a number that one of its
      readings writes in the other unit is refused.
    check: code
    darwin_core: verbatimElevation, minimumElevationInMeters, maximumElevationInMeters
    source:
      - src/specimen_digitization/field_research/agreement.py:309
      - src/specimen_digitization/field_research/agreement.py:824-831
      - docs/execution/units/PLAN.md:127
  - id: place_parents_derived
    statement: >-
      Upward derivation: a derived country, province or state, or county is
      the parent that the source of a settled place below it names at that
      level; it never replaces a value settled from the label; no parent is
      derived where settled places below name different ones there; and a
      county is never derived from a city whose source names fewer than three
      larger places, nor a province from a county whose source names fewer
      than two.
    check: code
    darwin_core: country, stateProvince, county
    source:
      - docs/product-requirements/FIRST_PASS_UNITS_AND_SPECIMEN_ONTOLOGY.md:268-269
      - src/specimen_digitization/field_research/derive.py:43-50
      - src/specimen_digitization/field_research/derive.py:68-74
      - src/specimen_digitization/field_research/derive.py:95-146
  - id: elevation_conversion
    statement: >-
      A derived elevation is a stated one copied to the other end of its unit,
      or its exact conversion (1 ft = 0.3048 m) rounded to the hundredth; a
      derived elevation never replaces a stated one; and no elevation is
      derived while an elevation field is neither settled nor open (one the
      readings disagree on goes to a person first).
    check: code
    darwin_core: verbatimElevation, minimumElevationInMeters, maximumElevationInMeters
    source:
      - src/specimen_digitization/field_research/derive.py:4-7
      - src/specimen_digitization/field_research/derive.py:168-186
      - src/specimen_digitization/application/derivations.py:29-30
      - src/specimen_digitization/application/derivations.py:97-122
  - id: end_date_from_one_date
    statement: >-
      A derived Date Visited To is the date of a settled Date Visited From, at
      its precision, and is never derived from a written range.
    check: code
    darwin_core: eventDate
    source:
      - src/specimen_digitization/field_research/derive.py:42
      - src/specimen_digitization/field_research/derive.py:84-91
  # Resolved in version 2.0 (the spec's section 5, its line dated 2026-11-14):
  # the extent of Precise Location (WP 1.5's gap report: "CNHM. E Slope Mt."
  # cleared where the truth holds the whole locality) and O2 (a label whose
  # only locality text is the town's, "Yepocapa, 4800 ft."). Settled by the PRD
  # (the verbatim locality, as written, at the root of the place tree) and its
  # georeferencing document (verbatimLocality "Yepocapa, 4800 ft. / Chimaltenago,
  # / Guatemala" for slide 105526329), and confirmed by the reference truth,
  # whose ten pilot rows each hold the label's whole locality lines.
  - id: precise_location_extent
    statement: >-
      Precise Location is the label's locality as written: every line of its
      locality text, with its line breaks, the higher places and an elevation
      written among those lines included. It is never cut to the first line,
      and a label whose locality names nothing finer than its town still has a
      Precise Location: those lines as written.
    note: >-
      Today's code disagrees in three places, and WP 2.2 makes each follow this
      rule (the plan's WP 2.2 row, the coordinator's re-plan of 2026-11-14):
      the precise location brief leaves out the higher places and an elevation
      (precise_location.txt:8) and answers label_lacks_value when no reading
      writes anything finer than the other place fields (:12); the step clears
      such a field as not on the label (step.py:3594-3620, owner decision A as
      the schema session applied it to this field); and a precise location read
      from the transcript that holds an elevation is refused
      (agreement.py:323-324, :840-861), so "Yepocapa, 4800 ft." is refused today.
    check: not yet
    when: WP 2.2
    darwin_core: verbatimLocality
    source:
      - docs/product-requirements/PRD.md:519
      - docs/product-requirements/PRD.md:689-690
      - docs/product-requirements/PRD.md:774
      - docs/product-requirements/GEOREFERENCING.md:258
      - docs/product-requirements/GEOREFERENCING.md:276
      - tests/fixtures/field_model_pilot_rows.json:30
      - tests/fixtures/field_model_pilot_rows.json:79
      - tests/fixtures/field_model_pilot_rows.json:152
      - tests/fixtures/field_model_pilot_rows.json:289
      - tests/fixtures/field_model_pilot_rows.json:325
