# The owner's Paper app-icon tile keeps the authentic Obsidian ribbons visible
# on both launch backgrounds. See assets/brand/README.md for regeneration.
flutter_native_splash:
  color: "#FAF9F6"
  color_dark: "#0E0E11"
  image: assets/brand/splash-mark-1024.png
  image_dark: assets/brand/splash-mark-1024.png

  # Android 12 supplies the Paper icon plate itself. The transparent foreground
  # fits within the central two-thirds circle, leaving every ribbon unclipped.
  android_12:
    image: assets/brand/splash-mark-android12-1024.png
    image_dark: assets/brand/splash-mark-android12-1024.png
    icon_background_color: "#FAF9F6"
    icon_background_color_dark: "#FAF9F6"

  android: true
  ios: true
  # The browser's existing Paper/Obsidian HTML background remains the first paint.
  web: false
