<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Specimen Digitization interlocking mark</title>
  <!-- Traced from the owner's selected SD_brand.png primary mark, 2026-10-23.
       This is the canonical geometry for Flutter, launcher and splash assets. -->
  <defs>
    <!-- Muted fold: 40% Iris in Amber, then 60% Obsidian. This is artwork
         shading derived from the seeds, not an additional interface color. -->
    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="145" y1="315" x2="300" y2="137">
      <stop offset="0" stop-color="#7B61FF"/>
      <stop offset="0.4" stop-color="#F5A45B"/>
      <stop offset="0.72" stop-color="#573F49"/>
      <stop offset="1" stop-color="#0E0E11"/>
    </linearGradient>
    <!-- The owner's app-icon crop has the same ribbons with an Amber tip. -->
    <linearGradient id="fold-app-icon" gradientUnits="userSpaceOnUse" x1="145" y1="315" x2="390" y2="115">
      <stop offset="0" stop-color="#7B61FF"/>
      <stop offset="0.28" stop-color="#F5A45B"/>
      <stop offset="0.50" stop-color="#573F49"/>
      <stop offset="0.72" stop-color="#0E0E11"/>
      <stop offset="1" stop-color="#F5A45B"/>
    </linearGradient>
  </defs>
