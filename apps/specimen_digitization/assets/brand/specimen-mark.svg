    <path id="lower" fill="#0E0E11" fill-rule="evenodd" d="M 205 265 Q 205 247 225 237 L 420 150 Q 439 141 450 153 Q 455 159 455 171 L 455 272 Q 455 287 440 295 L 259 371 Q 242 380 225 372 L 214 366 Q 205 359 205 345 Z M 277 279 Q 277 271 286 267 L 383 223 Q 391 219 391 227 L 391 248 Q 391 256 384 260 L 285 304 Q 277 308 277 299 Z"/>
  </g>
</svg>
