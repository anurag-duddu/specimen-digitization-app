<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Review photographs of pinned insect specimens and the readings taken from their labels.">

  <!-- The ground, 09 section 3.1. The browser chrome takes it in both
       modes, the same pair of values flutter_native_splash.yaml gives
       the native splash. -->
  <meta name="theme-color" content="#F6F6F4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0F11">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Specimen Digitization">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Specimen Digitization</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The web splash is this page. Painting the ground here means the
       first frame, before Flutter has booted, is the window background
       rather than a white flash. flutter_native_splash.yaml therefore
       sets web to false. */
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; background-color: #F6F6F4; }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #0E0F11; }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
