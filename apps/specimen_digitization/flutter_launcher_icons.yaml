# The owner's interlocking mark on Paper. The platform supplies its own mask.
# See assets/brand/README.md for the pinned vector-rendering command and order.
flutter_launcher_icons:
  image_path: "assets/brand/icon-1024.png"

  android: true
  # Keep the application's existing minimum supported Android version.
  min_sdk_android: 24
  adaptive_icon_background: "#FAF9F6"
  adaptive_icon_foreground: "assets/brand/icon-foreground-1024.png"
  # The canonical mark is already sized to the central 66 percent safe frame.
  adaptive_icon_foreground_inset: 0

  ios: true
  # The source is opaque Paper; iOS rejects an alpha channel in an app icon.
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/brand/icon-1024.png"
    background_color: "#FAF9F6"
    theme_color: "#FAF9F6"
