# Locally modified 2026-09-30: standalone Android/iOS plugin metadata; see PROVENANCE.md.
name: app_links
description: Android App Links and iOS Universal Links and custom URL schemes for Flutter (local mobile-only registration).
version: 7.0.0
homepage: https://github.com/llfbandit/app_links

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter

  app_links_platform_interface: ^2.0.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.llfbandit.app_links
        pluginClass: AppLinksPlugin
      ios:
        pluginClass: AppLinksIosPlugin

topics:
  - deeplink
  - app-links
  - universal-links
  - custom-url-schemes
  - web-to-app
