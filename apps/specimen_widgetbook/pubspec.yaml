name: specimen_widgetbook
description: Specimen Digitization component documentation and interaction workbench.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  specimen_digitization:
    path: ../specimen_digitization
  go_router: 17.5.0
  file_selector: ^1.0.4
  shared_preferences: ^2.5.5
  specimen_ui:
    path: ../specimen_digitization/packages/specimen_ui
  widgetbook: ^3.23.0

# Match the application compatibility pin for Flutter 3.38.
dependency_overrides:
  firebase_core_web: 3.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/synthetic-label.png
