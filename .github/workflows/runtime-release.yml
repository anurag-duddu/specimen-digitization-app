name: Runtime release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      process_queued:
        description: Warm SAM and drain already queued specimens, then return SAM to zero
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: specimen-runtime-release
  cancel-in-progress: false

jobs:
  data:
    name: Wait for this commit's data release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The only limit on the wait; the script itself has no deadline.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait until the data release of this commit has succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/wait_for_data.sh

  build:
    name: Build and push API, worker and SAM images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: runtime-build-production
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.push.outputs.image }}
      worker: ${{ steps.worker.outputs.image }}
      sam: ${{ steps.sam.outputs.image }}
    steps:
      - name: Check out the merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate as the image builder
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: specimen-digitization
          workload_identity_provider: projects/716045864126/locations/global/workloadIdentityPools/github-actions/providers/specimen-runtime-build # pragma: allowlist secret
          service_account: specimen-runtime-build@specimen-digitization.iam.gserviceaccount.com
      - name: Build the API image from the committed files
        run: scripts/ci/build_runtime_image.sh api
      - name: Push the image and report its digest
        id: push
        run: scripts/release/push_image.sh api
      - name: Build and check the worker image offline
        run: scripts/ci/build_runtime_image.sh worker
      - name: Push the checked worker image
        id: worker
        run: scripts/release/push_image.sh worker
      - name: Build and check the SAM image offline
        run: scripts/ci/build_runtime_image.sh sam
      - name: Push the checked SAM image
        id: sam
        run: scripts/release/push_image.sh sam

  release:
    name: Deploy and verify API, SAM and worker
    if: github.ref == 'refs/heads/main'
    needs: [data, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: runtime-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Authenticate as the runtime releaser
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: specimen-digitization
          workload_identity_provider: projects/716045864126/locations/global/workloadIdentityPools/github-actions/providers/specimen-runtime-release # pragma: allowlist secret
          service_account: specimen-runtime-release@specimen-digitization.iam.gserviceaccount.com
      - name: Deploy the API to Cloud Run
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: uv run python scripts/release/deploy_api.py "$IMAGE"
      - name: Smoke the public API
        run: scripts/release/smoke_api.sh
      - name: Deploy private SAM at minimum zero and define the worker job
        env:
          SAM_IMAGE: ${{ needs.build.outputs.sam }}
          WORKER_IMAGE: ${{ needs.build.outputs.worker }}
        run: uv run python scripts/release/deploy_models.py "$SAM_IMAGE" "$WORKER_IMAGE"
      - name: Warm SAM and process the queued work
        if: github.event_name == 'workflow_dispatch' && inputs.process_queued
        timeout-minutes: 70
        run: uv run python scripts/release/process_worker.py process
      - name: Restore and verify SAM minimum zero
        if: always() && github.event_name == 'workflow_dispatch' && inputs.process_queued
        run: uv run python scripts/release/process_worker.py cool
