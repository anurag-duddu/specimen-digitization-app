name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      engine_cache_mode:
        description: Engine file cache provisioning only
        type: choice
        default: normal
        options:
          - normal
          - cold

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.38.5"
  UV_VERSION: "0.12.5"
  PYTHON_HOSTED_SHARDS: 12

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Run repository safety hooks
        run: uvx --from pre-commit==4.5.1 pre-commit run --all-files

  python-scope:
    name: Classify Python test scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure hosted Python shards
        id: shards
        run: |
          python3 - <<'PY'
          import json
          import os
          from scripts.ci.python_shards import hosted_config

          count = json.loads(os.environ["PYTHON_HOSTED_SHARDS"])
          if type(count) is not int or not 6 <= count <= 16:
              raise SystemExit("hosted Python shard count must be an integer between 6 and 16")
          matrix = hosted_config(count)["matrix"]["index"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"matrix={json.dumps(matrix)}", file=output)
          PY

      - name: Classify changed paths conservatively
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/ci/python_scope.py
          --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"
          --output "$GITHUB_OUTPUT"

  python-shards:
    name: Python shard ${{ matrix.shard }}
    needs: python-scope
    if: needs.python-scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.python-scope.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run Python tests
        run: >-
          uv run python scripts/ci/python_shards.py run
          --index "${{ matrix.shard }}" --count "$PYTHON_HOSTED_SHARDS"
          --output "python-shards/shard-${{ matrix.shard }}.json"

      - name: Upload Python results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: python-shards/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  python-engines:
    name: SQL and Storage engine contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SPECIMEN_TEST_SQL_EMULATOR: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select engine cache mode
        id: engine-cache
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.engine_cache_mode || 'normal' }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              case "$REQUESTED_MODE" in
                normal|cold) mode="$REQUESTED_MODE" ;;
                *) echo 'Unknown engine cache mode' >&2; exit 1 ;;
              esac ;;
            pull_request|push) mode=normal ;;
            *) echo 'Unsupported engine event' >&2; exit 1 ;;
          esac
          if [ "$mode" = cold ]; then
            private_parent="$(mktemp -d "$RUNNER_TEMP/engine-cold.XXXXXXXX")"
            directory="$private_parent/engines"
          else
            directory="$RUNNER_TEMP/engine-tools"
          fi
          test ! -e "$directory"
          test ! -L "$directory"
          {
            echo "mode=$mode"
            echo "directory=$directory"
          } >> "$GITHUB_OUTPUT"
          {
            echo "ENGINE_CACHE_MODE=$mode"
            echo "ENGINE_TOOLS_DIR=$directory"
            echo "ENGINE_PROVISION_REPORT=$RUNNER_TEMP/engine-provision.json"
            echo "DATACONNECT_EMULATOR_BIN=$directory/dataconnect-emulator-3.2.0"
            echo "STORAGE_RULES_RUNTIME_JAR=$directory/cloud-storage-rules-runtime-v1.1.3.jar"
            echo "FIREBASE_CLI_BIN=$directory/firebase-tools-linux"
          } >> "$GITHUB_ENV"

      - name: Select pinned runner tools
        run: |
          # select_node_bin uses RUNNER_TOOL_CACHE and the highest installed Node 22.x.
          node_bin="$(python3 -c 'import os; from scripts.ci.engine_contract_gate import select_node_bin; print(select_node_bin(os.environ))')"
          test -x "$node_bin/node"
          export PATH="$node_bin:$PATH"
          [[ "$(node --version)" =~ ^v22\.[0-9]+\.[0-9]+$ ]]
          test -n "$JAVA_HOME_21_X64"
          test -x "$JAVA_HOME_21_X64/bin/java"
          test -x /usr/lib/postgresql/16/bin/pg_ctl
          echo "$node_bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo 'POSTGRES_BIN=/usr/lib/postgresql/16/bin' >> "$GITHUB_ENV"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: '3.12'

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Cache verified engine files
        id: engine-files
        if: steps.engine-cache.outputs.mode == 'normal'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.engine-cache.outputs.directory }}
          key: engine-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/data/engine-toolchain.json') }}

      - name: Provision verified engine files
        env:
          CACHE_HIT: ${{ steps.engine-files.outputs.cache-hit }}
        run: |
          case "$ENGINE_CACHE_MODE" in
            cold)
              case "$CACHE_HIT" in
                ''|false) restore=bypassed ;;
                *) echo 'Cold engine cache was restored' >&2; exit 1 ;;
              esac ;;
            normal)
              case "$CACHE_HIT" in
                true) restore=hit ;;
                ''|false) restore=miss ;;
                *) echo 'Unknown engine cache hit status' >&2; exit 1 ;;
              esac ;;
            *) echo 'Unknown engine cache mode' >&2; exit 1 ;;
          esac
          python3 scripts/data/provision-engine-tools.py --download \
            --directory "$ENGINE_TOOLS_DIR" --mode "$ENGINE_CACHE_MODE" \
            --restore "$restore" --output "$ENGINE_PROVISION_REPORT"

      - name: Run mandatory engine contracts
        run: >-
          uv run python scripts/ci/engine_contract_gate.py record
          --selection scripts/data/engine-contract-selection.json --results python-engines
          -- bash -euo pipefail -c 'scripts/data/test-postgres.sh; scripts/data/test-storage.sh'

      - name: Upload engine result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-engines
          path: python-engines/engine-contract.json
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python tests
    if: always()
    needs:
      - python-scope
      - python-shards
      - python-engines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require a valid scope decision
        env:
          SCOPE_RESULT: ${{ needs.python-scope.result }}
          FULL_PYTHON: ${{ needs.python-scope.outputs.full }}
          SHARD_RESULT: ${{ needs.python-shards.result }}
          ENGINE_RESULT: ${{ needs.python-engines.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$ENGINE_RESULT" = success
          case "$FULL_PYTHON" in
            true) test "$SHARD_RESULT" = success ;;
            false) test "$SHARD_RESULT" = skipped ;;
            *) exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python for focused contracts
        if: needs.python-scope.outputs.full == 'false'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies for focused contracts
        if: needs.python-scope.outputs.full == 'false'
        run: uv sync --frozen

      - name: Download Python results
        if: needs.python-scope.outputs.full == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: python-shards
          merge-multiple: true

      - name: Download engine result for focused contracts
        if: needs.python-scope.outputs.full == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-engines
          path: python-shards

      - name: Verify mandatory engine evidence
        env:
          ENGINE_CACHE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.engine_cache_mode || 'normal' }}
        run: >-
          python3 scripts/ci/engine_contract_gate.py verify
          --selection scripts/data/engine-contract-selection.json --results python-shards

      - name: Run focused frontend Python contracts
        if: needs.python-scope.outputs.full == 'false'
        run: >-
          uv run pytest -q
          scripts/ci/test_public_settings.py
          scripts/ci/test_smoke_web_routes.py
          tests/test_native_google_configuration.py
          tests/test_deployment_policy.py
          tests/test_hosting_attempt_binding.py
          tests/test_local_review_runner.py
          tests/research_harness/test_thread_embedded_schema.py

      - name: Verify complete Python coverage
        if: needs.python-scope.outputs.full == 'true'
        env:
          SHARD_RESULT: ${{ needs.python-shards.result }}
        run: |
          test "$SHARD_RESULT" = success
          python3 scripts/ci/python_shards.py verify --count "$PYTHON_HOSTED_SHARDS" python-shards/shard-*.json

  flutter:
    name: Flutter checks and web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/specimen_digitization
    steps:
      # Two commits deep, so the guard tests can read the base: the first
      # parent of a pull request's merge commit, or the previous main.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore production FlutterFire configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          test -n "$FIREBASE_OPTIONS_DART_B64"
          printf '%s' "$FIREBASE_OPTIONS_DART_B64" | base64 --decode > lib/firebase_options.dart

      - name: Use credential-free Firebase configuration
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: cp lib/firebase_options.ci.dart lib/firebase_options.dart

      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install design system dependencies
        working-directory: apps/specimen_digitization/packages/specimen_ui
        run: flutter pub get

      # The cheapest gate, so it runs before the analyzers. It covers the
      # client and the design system and nothing else: the frozen Dart under
      # docs/execution/qa-evidence is evidence, not source.
      - name: Check Dart formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test packages/specimen_ui/lib packages/specimen_ui/test

      - name: Check UI writing
        run: >-
          python3 ../../scripts/ci/check_ui_strings.py
          --baseline ../../scripts/ci/ui_strings_baseline.txt

      - name: Analyze the design system
        working-directory: apps/specimen_digitization/packages/specimen_ui
        run: flutter analyze --fatal-infos

      - name: Run design system tests
        working-directory: apps/specimen_digitization/packages/specimen_ui
        run: flutter test

      - name: Analyze Flutter code
        run: flutter analyze --fatal-infos

      # The sign-off gate compares every guard allowance with the base's copy
      # (test/theme/exemptions_owner_approved_test.dart).
      - name: Run Flutter tests
        env:
          GATE_BASE: HEAD^1
        run: flutter test

      - name: Install Node.js for browser contracts
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check cross-origin intake authorization in Chrome
        run: node ../../scripts/ci/check_intake_auth_session_browser.cjs

      - name: Build Flutter web release
        env:
          SPECIMEN_API_BASE_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SPECIMEN_API_BASE_URL || '' }}
          SPECIMEN_RECAPTCHA_SITE_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SPECIMEN_RECAPTCHA_SITE_KEY || '' }}
          SPECIMEN_ADMIN_CONTACT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SPECIMEN_ADMIN_CONTACT || '' }}
          SPECIMEN_PILOT_SCOPE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SPECIMEN_PILOT_SCOPE || '' }}
          SPECIMEN_GOOGLE_SIGN_IN_ENABLED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SPECIMEN_GOOGLE_SIGN_IN_ENABLED || '' }}
          BULK_INTAKE_ENABLED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.BULK_INTAKE_ENABLED || '' }}
        run: ../../scripts/ci/build_web.sh

      - name: Stamp release with its source revision
        run: ../../scripts/ci/write_deployment_metadata.sh build/web

      # The artifact is checked here, before it can be uploaded and therefore
      # before anything can deploy it: every route the router declares answers
      # with the application shell under the rewrites firebase.json declares
      # and carries the security headers it declares, the design system
      # gallery is absent from the release bundle, and deployment.json is the
      # exact marker the deploy guard and the public smoke accept. It serves
      # the build on loopback, contacts no host, holds no credential and
      # deploys nothing.
      - name: Check the built web release over its routes
        run: python3 ../../scripts/ci/smoke_web_routes.py --require-marker

      - name: Upload web release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-web-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/specimen_digitization/build/web
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: Flutter ${{ matrix.target }} build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
          - target: ios
            runner: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Select runner JDK 17 for Android
        if: matrix.target == 'android'
        run: |
          test -n "$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Build with temporary synthetic native configuration
        run: scripts/ci/build_mobile.sh "${{ matrix.target }}"

  deploy-hosting:
    name: Deploy Firebase Hosting
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - repository-checks
      - python
      - flutter
      - mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://specimen-digitization.web.app
    env:
      DEPLOYMENT_ENVIRONMENT: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: firebase-hosting-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download tested web release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flutter-web-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/specimen_digitization/build/web

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: specimen-digitization
          workload_identity_provider: projects/716045864126/locations/global/workloadIdentityPools/github-actions/providers/specimen-digitization # pragma: allowlist secret
          service_account: github-firebase-hosting@specimen-digitization.iam.gserviceaccount.com

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Deploy the tested artifact to Firebase Hosting
        run: scripts/ci/deploy_hosting.sh

      - name: Verify the public site
        run: scripts/ci/smoke_hosting.sh https://specimen-digitization.web.app "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
