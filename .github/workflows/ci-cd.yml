name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.38.5"
  UV_VERSION: "0.12.5"

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Run repository safety hooks
        run: uvx --from pre-commit==4.5.1 pre-commit run --all-files

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run Python tests
        run: uv run pytest -q

  flutter:
    name: Flutter checks and web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/specimen_digitization
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore production FlutterFire configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          test -n "$FIREBASE_OPTIONS_DART_B64"
          printf '%s' "$FIREBASE_OPTIONS_DART_B64" | base64 --decode > lib/firebase_options.dart

      - name: Use credential-free Firebase configuration
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: cp lib/firebase_options.ci.dart lib/firebase_options.dart

      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Flutter code
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build Flutter web release
        run: flutter build web --release

      - name: Stamp release with its source revision
        run: ../../scripts/ci/write_deployment_metadata.sh build/web

      - name: Upload web release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-web-${{ github.sha }}
          path: apps/specimen_digitization/build/web
          if-no-files-found: error
          retention-days: 7

  deploy-hosting:
    name: Deploy Firebase Hosting
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - repository-checks
      - python
      - flutter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://specimen-digitization.web.app
    env:
      DEPLOYMENT_ENVIRONMENT: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: firebase-hosting-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download tested web release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flutter-web-${{ github.sha }}
          path: apps/specimen_digitization/build/web

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: specimen-digitization
          workload_identity_provider: projects/716045864126/locations/global/workloadIdentityPools/github-actions/providers/specimen-digitization # pragma: allowlist secret
          service_account: github-firebase-hosting@specimen-digitization.iam.gserviceaccount.com

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Deploy the tested artifact to Firebase Hosting
        run: scripts/ci/deploy_hosting.sh

      - name: Verify the public site
        run: scripts/ci/smoke_hosting.sh https://specimen-digitization.web.app "$GITHUB_SHA"
