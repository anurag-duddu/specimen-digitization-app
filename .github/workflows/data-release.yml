name: Data release

# Every merge to main releases the data plane: the database's roles and tables, the Data Connect schema and
# connector, the Storage rules and the first rows. Each step reads the live state first and changes only what
# differs, so a commit that touches no data file changes nothing. The runtime release waits for this run.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: specimen-data-release
  cancel-in-progress: false

jobs:
  release:
    name: Release the data plane for the merged commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: data-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the pinned Cloud SQL connector and PostgreSQL client
        run: npm install --prefix "$RUNNER_TEMP/release-node" --no-audit --no-fund --ignore-scripts @google-cloud/cloud-sql-connector@1.9.1 pg@8.19.0
      - name: Authenticate as the data release identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: specimen-digitization
          workload_identity_provider: projects/716045864126/locations/global/workloadIdentityPools/github-actions/providers/specimen-data-release # pragma: allowlist secret
          service_account: specimen-data-release@specimen-digitization.iam.gserviceaccount.com
      - name: Release the database, Data Connect and Storage rules
        env:
          RELEASE_NODE_MODULES: ${{ runner.temp }}/release-node/node_modules
          # The owner's first-rows artifact, the only GitHub secret this workflow reads. scripts/ops/owner_setup.sh sets it.
          DATA_BOOTSTRAP_ARTIFACT_B64: ${{ secrets.DATA_BOOTSTRAP_ARTIFACT_B64 }}
        run: uv run python scripts/release/data_release.py
      - name: Publish the ten pinned georeferencing datasets
        run: uv run python scripts/release/georef_datasets.py
