[project]
name = "specimen-digitization"
version = "0.1.0"
description = "Backend processing and agent harnesses for Specimen Digitization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "firebase-admin>=6,<8",
    "logfire[variables]>=5.0,<6",
    "pillow>=11,<13",
    "pydantic-ai-slim[huggingface]>=2.40,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
heic = ["pillow-heif==1.7.0"]
raw = ["rawpy==0.27.1"]

[dependency-groups]
dev = [
    "pydantic-evals[logfire]>=2.40,<3",
    "pytest>=8,<10",
]

[project.scripts]
specimen-demo = "specimen_digitization.application.demo:main"
specimen-worker = "specimen_digitization.application.worker:main"
specimen-api = "specimen_digitization.application.cli:main"
specimen-logfire-smoke = "specimen_digitization.logfire_smoke:main"
specimen-huggingface-preflight = "specimen_digitization.huggingface_preflight:main"
specimen-eval-smoke = "specimen_digitization.evaluation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specimen_digitization"]
